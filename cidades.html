endem do setor. Vinho fino nacional já é só <b>1 em cada 10 garrafas</b> vendidas no país.</li></ul><p>  - Ângulo Rony: *&quot;Enquanto a Europa banca o vinho deles, o governo Lula assina acordo que joga o importado subsidiado contra o colono da Serra e ainda aumenta o imposto do nosso. É produtor brasileiro apanhando dos dois lados.&quot;* Patriotismo econômico + propriedade + anti-Lula.</p><p>  - Fontes: <a href=\"https://www.jornaldocomercio.com/mapa-economico/regiao-serra/2026/04/1243979-desigualdades-na-cadeia-produtiva-do-vinho-preocupam-o-setor.html\" target=\"_blank\" rel=\"noopener\">Jornal do Comércio – desigualdades na cadeia do vinho</a> · <a href=\"https://timesbrasil.com.br/empresas-e-negocios/acordo-mercosul-ue-deve-ampliar-concorrencia-e-mudar-disputa-no-mercado-de-vinhos-no-brasil-avalia-especialista/\" target=\"_blank\" rel=\"noopener\">Times Brasil – Mercosul-UE amplia concorrência no vinho</a></p><h4>C. A cidade que TRABALHA — pleno emprego vs. assistencialismo (DNA puro)</h4><ul><li>Flores da Cunha vive <b>pleno emprego</b>: <b>+14 mil trabalhadores formais</b> (CAGED), <b>+3.300 empregos criados em 5 anos</b>, sobra vaga e falta mão de obra qualificada. Além do vinho, é polo de <b>metalmecânica, móveis, vestuário e plástico</b>. <b>PIB per capita bem acima da média do RS</b> (a economia cresceu ~240% nominal em 10 anos).</li></ul><p>  - Ângulo Rony: *&quot;Aqui ninguém espera Bolsa pra viver — aqui se acorda cedo, se produz e se emprega. É o Brasil que dá certo quando o governo sai da frente.&quot;* Trabalho/empreendedorismo vs. assistencialismo — encaixe perfeito, e é <b>elogio à cidade</b> (pertencimento).</p><p>  - Fontes: <a href=\"https://jornaloflorense.com.br/flores-da-cunha-criou-mais-de-33-mil-novos-empregos-nos-ultimos-cinco-anos/\" target=\"_blank\" rel=\"noopener\">Jornal O Florense – 3,3 mil empregos em 5 anos</a> · <a href=\"https://meumunicipio.org.br/perfil-municipio/4308201-Flores-da-Cunha-RS\" target=\"_blank\" rel=\"noopener\">Meu Município – perfil econômico FdC</a></p><h4>D. Uva e vinho = identidade + pequeno produtor familiar (agro/propriedade)</h4><ul><li><b>Maior produtor de vinho do Brasil desde 1994.</b> Em <b>2025: 85,7 milhões de litros</b> (43% de todo o RS); <b>~1.300 propriedades</b> produtoras de uva; <b>~200 vinícolas/cantinas</b> (da grande empresa à cantina de família); a cadeia é <b>~15% da economia</b> e arrecada <b>+R$100 milhões</b>. É <b>Capital Nacional da Vindima</b>.</li></ul><p>  - Ângulo Rony: exaltar o <b>produtor familiar</b> e a <b>propriedade</b> (contra qualquer taxação/burocracia que sufoque o pequeno). Casar com A e B.</p><p>  - Fontes: <a href=\"https://www.floresdacunha.rs.gov.br/secao.php?id=1\" target=\"_blank\" rel=\"noopener\">Prefeitura de Flores da Cunha – Dados Gerais</a> · <a href=\"https://www.floresdacunha.rs.gov.br/noticias_int.php?id=7987\" target=\"_blank\" rel=\"noopener\">Prefeitura – É Tempo de Vindima 2026</a></p><h4>E. Fé, família e tradição italiana (valores cristãos + pertencimento)</h4><ul><li>Colonização italiana desde <b>1877</b> (antiga Nova Trento); <b>150 anos da imigração italiana no Brasil</b> (marco de 2025). <b>Igreja Matriz N.S. de Lourdes</b> (estilo gótico, 1904–1914) e a <b>Capela N.S. de Caravaggio em Otávio Rocha</b> (1926) — devoção trazida da Itália. Cidade católica, de família grande, trabalho e tradição.</li></ul><p>  - Ângulo Rony: fé/família/tradição, resgate dos valores do colono, &quot;trabalho e Deus&quot; — fala direta ao eleitor conservador cristão da Serra.</p><p>  - Fontes: <a href=\"https://paroquiafloresdacunha.wordpress.com/2015/08/21/um_pouco_sobre_a_igreja_matriz_flores_da_cunha/\" target=\"_blank\" rel=\"noopener\">Paróquia N.S. de Lourdes – história da Igreja Matriz</a> · <a href=\"https://www.viagensecaminhos.com/otavio-rocha-flores-da-cunha/\" target=\"_blank\" rel=\"noopener\">Viagens e Caminhos – Otávio Rocha e a Capela de Caravaggio</a></p><h3>💛 ORGULHO / PERTENCIMENTO (gravar na chegada, mostra respeito)</h3><ul><li><b>Maior produtora de vinhos do Brasil</b> e <b>Capital Nacional da Vindima</b>; a mais italiana das cidades da imigração; <b>emancipada em 17/05/1924</b> (centenária); distrito pitoresco de <b>Otávio Rocha</b> com a Capela de Caravaggio; cidade de <b>pleno emprego</b> que &quot;faz por merecer&quot;. Nome em honra ao ex-governador <b>General Flores da Cunha</b>.</li></ul><p>  - Fontes: <a href=\"https://www.floresdacunha.rs.gov.br/secao.php?id=2\" target=\"_blank\" rel=\"noopener\">Prefeitura – História</a> · <a href=\"https://cidades.ibge.gov.br/brasil/rs/flores-da-cunha/panorama\" target=\"_blank\" rel=\"noopener\">IBGE Cidades – Flores da Cunha (panorama)</a></p><h3>Lacunas (não achado — não inventar)</h3><ul><li><b>Alinhamento político do contato &quot;Kauan&quot;</b> e de quem organiza o jantar (confirmar antes p/ não errar o tom).</li><li><b>Nome/partido do(s) vereador(es) parceiro(s)</b> e se há oposição interna ao prefeito Ulian (PP).</li><li><b>Dados SSP/RS específicos de FdC</b> (taxa de homicídios, ranking estadual) — só há notícias avulsas.</li><li><b>Posição oficial do prefeito/vinícolas locais sobre o Imposto Seletivo</b> (se houver moção da Câmara, vira munição pronta).</li><li><b>População 2022 = 30.892 hab (censo IBGE)</b>; <b>PIB per capita atualizado</b> e salário médio/IDHM recentes a confirmar (fontes divergem: R$60,3 mil em 2019 no IBGE vs. ~R$81 mil no Meu Município).</li><li><b>Qual vinícola/roteiro visitar</b> (definir p/ foto/vídeo com o produtor local).</li></ul>","elec":{"municipio":"FLORES DA CUNHA","lula_pct":17.9,"bolso_pct":82.1,"lula_votos":3691,"bolso_votos":16910,"vencedor":"Bolsonaro","abst_pct":13.0,"branco_pct":1.2,"nulo_pct":2.4,"aptos":24577,"comparecimento":21384,"dep_fed":{"nome":"MAURICIO MARCON","partido":"PODE","votos":3931},"dep_est":{"nome":"CLAUDIA MANTOVANI","partido":"REPUBLICANOS","votos":1880}},"dossie":{"e":{"ano":2024,"pop":33430,"orc":250852981.71,"prop":42199346.37,"fed":60431986.87,"est":78252963.17,"pp":16.8,"pf":24.1,"pe":31.2,"dep":55.3,"principal":"Transferências (União/Estado)","setor":{"dom":"Indústria","dom_pct":51.3,"pib":2538142000.0,"agro":6.5,"ind":51.3,"serv":33.1,"adm":9.1},"gasto":[{"nome":"Educação","valor":48820282.96,"pct":23.6},{"nome":"Saúde","valor":43301004.25,"pct":20.9},{"nome":"Transporte","valor":29477806.65,"pct":14.2},{"nome":"Previdência","valor":21578567.07,"pct":10.4}]},"hooks":["<b>Terreno amigo:</b> Flores da Cunha deu <b>82.1% ao Bolsonaro</b> em 2022 — cidade de família, trabalho e fé. Abrir reconhecendo o povo.","<b>Dependência de Brasília:</b> <b>55.3%</b> do orçamento vem de repasses federais/estaduais. Gancho: “o futuro daqui se decide em Brasília — e é lá que eu quero brigar por vocês”.","<b>O básico que passa por Brasília:</b> a prefeitura investe <b>23.6% em educação</b> — e o recurso depende do federal liberar."]}},{"nome":"Frederico Westphalen","estudo":"<h2>ESTUDO DE CIDADE — FREDERICO WESTPHALEN (RS)</h2><p>&gt; Rony (vereador de Erechim, pré-candidato a Dep. Federal) em visita. Aqui ele é <b>quase-vizinho</b>: FW é o polo do <b>Médio Alto Uruguai</b>, mesma macrorregião norte/agro de Erechim (Alto Uruguai). Trabalhar <b>pertencimento regional forte</b> (&quot;nossa região&quot;, &quot;o interior que produz&quot;) + cruzar com o DNA (agro/propriedade, trabalho vs. assistencialismo, fé/família, anti-Lula/Brasília esquece o interior). Cidade <b>de direita</b> (votou Bolsonaro), então o tom anti-Lula ressoa — mas cuidado com aliados locais (ver Correções).</p><h3>⚠️ CORREÇÕES DE PRECISÃO (não errar em vídeo)</h3><p>1. <b>Prefeito é DIREITA, não esquerda.</b> Orlando Girardi é do <b>PP</b> (eleito 2024 com 51,98%), vice Chester Francescatto (PP), coligação <b>&quot;Aliança Para o Futuro&quot; (PP + União + PSD + Federação PSDB/Cidadania)</b>. É <b>aliado natural do campo do Rony</b> — NUNCA enquadrar a prefeitura como &quot;esquerdopata&quot;. Se houver crítica de gestão, usar <b>&quot;velha política / renovação&quot;</b> e só se o vereador parceiro for oposição a Girardi. Câmara 2025-28 também é de centro-direita/direita (MDB, PP, PDT, PSDB e <b>1 do PL</b>, Marcos Ceratto Cerutti).</p><p>2. <b>Governador Eduardo Leite (PSDB) é centro-direita</b> — não é esquerda. Vários investimentos que aparecem na cidade (hospital, agricultura familiar, rodovia estadual) vêm do <b>governo do Estado (Leite)</b>. Não atacar como se fosse gestão petista, e não creditar ao governo federal.</p><p>3. <b>NÃO confundir esferas.</b> O alvo &quot;Lula/PT&quot; é <b>federal</b>. Municipal = prefeito PP (aliado). Estadual = Leite/PSDB (centro-direita). O gancho anti-esquerda honesto aqui é <b>Brasília/federal</b> (ex.: duplicação da BR-386 depende do governo federal).</p><p>4. <b>FW é cidade média-pequena (~33 mil hab), polo de serviços — não é &quot;grande agro de soja&quot;.</b> O forte do campo local é <b>agricultura familiar e LEITE</b> (o leite já superou soja e milho como principal renda no campo). Falar &quot;latifúndio de soja&quot; erra o retrato — aqui é o <b>pequeno produtor / propriedade familiar</b>.</p><p>5. <b>É a &quot;Princesa do Médio Alto Uruguai&quot; e polo universitário/de comunicação</b>, não uma cidade-dormitório nem periferia de metrópole (fica a ~428 km de Porto Alegre, quase na divisa com SC). Tratar como <b>capital regional</b> que o interior orgulha.</p><h3>🏆 GANCHOS FORTES (cruzados com o DNA do Rony)</h3><h4>A. Pertencimento regional — &quot;nossa região, o mesmo norte&quot; (ABERTURA / CAMPEÃO de conexão)</h4><ul><li>FW é o <b>polo do Médio Alto Uruguai</b>, macrorregião norte do RS colada ao <b>Alto Uruguai de Erechim</b>: mesmo perfil de <b>colonização (italianos, poloneses, açorianos, alemães)</b>, mesma fé, mesma vocação agrícola. Rony não chega como &quot;de fora&quot; — chega como <b>conterrâneo da mesma gente que trabalha e planta</b>. Emancipada em <b>1954</b>, nasceu como <b>Vila Barril</b> e leva o nome do <b>engenheiro Frederico Westphalen</b>, chefe da Comissão de Terras que colonizou a região.</li></ul><p>  - Fontes: <a href=\"https://www.turismo.rs.gov.br/turismo/municipio/visualizar/135\" target=\"_blank\" rel=\"noopener\">Turismo RS — Frederico Westphalen</a> · <a href=\"https://www.fredericowestphalen.rs.leg.br/institucional/historia\" target=\"_blank\" rel=\"noopener\">Câmara FW — História</a> · <a href=\"https://www.ufsm.br/cursos/graduacao/frederico-westphalen/relacoes-publicas/conheca-fw\" target=\"_blank\" rel=\"noopener\">UFSM — Conheça FW</a></p><h4>B. Agro / agricultura familiar / propriedade — o leite e o pequeno produtor (DNA direto)</h4><ul><li><b>O leite virou a principal renda do campo em FW</b>, superando soja e milho: <b>+60% de produção entre 2015 e 2024</b>, gerando <b>R$ 54 mi em 2024</b> e impacto de <b>~R$ 165 mi</b> no PIB local. MAS o nº de propriedades leiteiras <b>caiu de 374 para 169</b> — ou seja, <b>mais produção com menos famílias no campo</b>. Ângulo Rony: <b>valorizar o produtor familiar que segura o interior</b>, trabalho e propriedade privada; alertar contra o <b>esvaziamento do campo</b> (êxodo). ⚠️ Não atacar o produtor nem o programa estadual — atacar o abandono de Brasília ao pequeno.</li></ul><p>  - Fontes: <a href=\"https://www.milkpoint.com.br/noticias-e-mercado/giro-noticias/producao-de-leite-cresce-60-em-frederico-westphalen-e-se-torna-principal-geradora-de-renda-no-campo-238985/\" target=\"_blank\" rel=\"noopener\">MilkPoint — leite supera soja e milho em FW</a></p><ul><li><b>Apoio à agricultura familiar (AgroFamília RS)</b> com assinatura de contratos em FW veio do <b>governo do Estado (Leite)</b>. Use como prova de que <b>quando se apoia o pequeno produtor, o interior responde</b> — sem creditar ao federal. ⚠️ crédito é estadual (aliado); não confundir.</li></ul><p>  - Fonte: <a href=\"https://estado.rs.gov.br/governo-leite-amplia-apoio-a-agricultura-familiar-com-novas-assinaturas-em-frederico-westphalen-e-tenente-portela\" target=\"_blank\" rel=\"noopener\">Governo do RS — AgroFamília em FW</a></p><h4>C. Juventude / êxodo x universidade e oportunidade (bolso + futuro)</h4><ul><li>FW é <b>polo universitário regional</b> — reúne <b>URI, UFSM, IFF, UNOPAR e UERGS</b> e recebe estudantes de toda a região e de outros estados. Forma gente qualificada, mas o desafio é <b>segurar o jovem no interior</b> (emprego/empreendedorismo, não assistencialismo). Ângulo Rony: <b>cidade que forma o jovem mas Brasília não gera as oportunidades para ele ficar</b> — trabalho e empresa vs. dependência do governo. No curso de Jornalismo da UFSM (desde 2006), boa parte dos formados permanece atuando na região — prova de que <b>o interior segura quem tem oportunidade aqui</b>.</li></ul><p>  - Fontes: <a href=\"https://www.ufsm.br/cursos/graduacao/frederico-westphalen/relacoes-publicas/conheca-fw\" target=\"_blank\" rel=\"noopener\">UFSM — Conheça FW (5 universidades)</a> · <a href=\"https://www.fw.uri.br/pt\" target=\"_blank\" rel=\"noopener\">URI Frederico Westphalen</a> · <a href=\"https://www.ufsm.br/cursos/graduacao/frederico-westphalen/jornalismo-bacharelado/sobre-o-curso\" target=\"_blank\" rel=\"noopener\">UFSM — Curso de Jornalismo FW</a></p><h4>D. Fé / família / valores cristãos (pertencimento + DNA)</h4><ul><li>Terra de forte religiosidade: <b>Santuário de Schoenstatt</b>, <b>monumento Cristo Rei</b> e a festa <b>&quot;Frederico em Luz&quot;</b> (Natal) — patrimônio cristão e de família que casa com o discurso do Rony (fé/família). Gravar respeito a esses símbolos na chegada mostra pertencimento genuíno.</li></ul><p>  - Fonte: <a href=\"https://www.ufsm.br/cursos/graduacao/frederico-westphalen/relacoes-publicas/conheca-fw\" target=\"_blank\" rel=\"noopener\">UFSM — Conheça FW (pontos e festas)</a></p><h4>E. Brasília esqueceu o interior — BR-386 e infraestrutura (munição anti-federal, SEGURA)</h4><ul><li>FW <b>votou Bolsonaro no 1º turno de 2022: 54,07% (10.799 votos) contra 39,12% de Lula (7.813)</b> — base à direita, discurso anti-Lula ressoa. A <b>duplicação da BR-386</b> (que passa por FW) é demanda antiga do norte e <b>depende do governo federal</b> — teve edital de projeto do trecho FW–Boa Vista das Missões, mas a obra segue lenta. Ângulo: <b>&quot;o interior produz leite, grão e gente, e Brasília não devolve nem a estrada&quot;</b>. Alvo é o federal (Lula/DNIT), não a prefeitura.</li></ul><p>  - Fontes: <a href=\"https://www.oaltouruguai.com.br/noticia/5785/confira-os-principais-resultados-do-pleito-em-frederico-westphalen\" target=\"_blank\" rel=\"noopener\">O Alto Uruguai — resultado do pleito 2022 em FW</a> · <a href=\"https://rdfoco.com.br/noticia/110679/governo-federal-autoriza-edital-para-projeto-de-duplicacao-da-br-386-entre-frederico-westphalen-e-boa-vista-das-missoes\" target=\"_blank\" rel=\"noopener\">RDFoco — edital de duplicação da BR-386 FW–Boa Vista das Missões</a></p><h4>F. Saúde regional — hospital que atende a região (cobrança de resultado, sem queimar aliado)</h4><ul><li>O <b>Hospital Divina Providência (HDP)</b> é referência regional e está ampliando <b>hemodiálise e oncologia</b> (investimento acima de <b>R$ 6 mi</b>, com recursos da <b>Consulta Popular + programa estadual &quot;Avançar na Saúde&quot;</b>, conclusão prevista p/ 1º tri de 2026). Ângulo Rony: <b>defender que a saúde do interior seja resolvida no interior</b> (não obrigar o povo a viajar) e cobrar entrega no prazo. ⚠️ recursos são estaduais (Leite/aliado) — enquadrar como <b>&quot;o interior merece&quot;</b>, não como crítica ao governo do Estado.</li></ul><p>  - Fontes: <a href=\"https://lamais.com.br/noticia/70934/investimento-nas-obras-dos-setores-de-hemodialise-e-oncologia-do-hdp-ja-superam-r-6-milhoes\" target=\"_blank\" rel=\"noopener\">LA+ — obras de hemodiálise e oncologia do HDP</a> · <a href=\"https://saude.rs.gov.br/saude-libera-recursos-e-recebe-projeto-de-nova-unidade-em-hospital-de-frederico-westphalen\" target=\"_blank\" rel=\"noopener\">Saúde RS — recursos e nova unidade no hospital de FW</a></p><h4>G. Comunicação / liberdade de expressão (gancho anti-sistema, opcional)</h4><ul><li>FW é <b>referência regional em comunicação</b>: cursos de Jornalismo (UFSM) e Relações Públicas, rádios comunitárias e emissoras que pautam o Médio Alto Uruguai. Para o público que valoriza <b>liberdade de expressão / imprensa livre</b>, dá para amarrar ao DNA anti-censura do Rony (contra tentativas de regular/censurar mídia). ⚠️ usar com leveza — é terreno da imprensa local; elogiar a tradição, não brigar com veículos.</li></ul><p>  - Fonte: <a href=\"https://www.ufsm.br/cursos/graduacao/frederico-westphalen/jornalismo-bacharelado/sobre-o-curso\" target=\"_blank\" rel=\"noopener\">UFSM — Curso de Jornalismo FW (desenvolvimento da comunicação regional)</a></p><h3>💛 ORGULHO / PERTENCIMENTO (gravar na chegada, mostra respeito)</h3><ul><li><b>&quot;A Princesa do Médio Alto Uruguai&quot;</b>, polo de <b>educação, saúde e comunicação</b> da região; ~<b>33 mil habitantes</b> e <b>PIB per capita ~R$ 54,9 mil (2023)</b> — dos mais fortes da região; <b>ExpoFred</b> (feira multissetorial que move a economia regional, herança da 1ª exposição agrícola dos anos 1960 no silo da <b>Cotrifred</b>, de 1957). Nome em homenagem ao engenheiro <b>Frederico Westphalen</b>, nascida como <b>Vila Barril</b>, emancipada em <b>1954</b>.</li></ul><p>  - Fontes: <a href=\"https://cidades.ibge.gov.br/brasil/rs/frederico-westphalen/panorama\" target=\"_blank\" rel=\"noopener\">IBGE Cidades — panorama FW</a> · <a href=\"https://www.ufsm.br/cursos/graduacao/frederico-westphalen/relacoes-publicas/conheca-fw\" target=\"_blank\" rel=\"noopener\">UFSM — Conheça FW</a> · <a href=\"https://www.fredericowestphalen.rs.leg.br/institucional/historia\" target=\"_blank\" rel=\"noopener\">Câmara FW — História</a></p><h3>Lacunas (não achado — não inventar)</h3><p>Dados de criminalidade/homicídios específicos de FW (SSP-RS não localizado por município); taxa de desemprego e salário médio exato; % de esgotamento sanitário; número atual exato de estudantes universitários; nome do deputado federal de referência/base da região (checar antes de citar aliado); controvérsias locais recentes de gestão (só usar se o vereador parceiro confirmar e for oposição ao prefeito PP).</p>","elec":{"municipio":"FREDERICO WESTPHALEN","lula_pct":39.3,"bolso_pct":60.7,"lula_votos":7918,"bolso_votos":12234,"vencedor":"Bolsonaro","abst_pct":18.3,"branco_pct":1.4,"nulo_pct":1.9,"aptos":25537,"comparecimento":20856,"dep_fed":{"nome":"DR. JORGE ALAN","partido":"PSDB","votos":5329},"dep_est":{"nome":"SILVANA COVATTI","partido":"PP","votos":2364}},"dossie":{"e":{"ano":2024,"pop":32284,"orc":197516561.97,"prop":30599388.82,"fed":58028435.52,"est":47556391.77,"pp":15.5,"pf":29.4,"pe":24.1,"dep":53.5,"principal":"Transferências (União/Estado)","setor":{"dom":"Serviços","dom_pct":56.0,"pib":1430611000.0,"agro":11.2,"ind":19.1,"serv":56.0,"adm":13.8},"gasto":[{"nome":"Saúde","valor":43121919.02,"pct":26.9},{"nome":"Educação","valor":35045890.37,"pct":21.9},{"nome":"Administração","valor":29924678.91,"pct":18.7},{"nome":"Previdência","valor":16782152.31,"pct":10.5}]},"hooks":["<b>Terreno amigo:</b> Frederico Westphalen deu <b>60.7% ao Bolsonaro</b> em 2022 — cidade de família, trabalho e fé. Abrir reconhecendo o povo.","<b>Dependência de Brasília:</b> <b>53.5%</b> do orçamento vem de repasses federais/estaduais. Gancho: “o futuro daqui se decide em Brasília — e é lá que eu quero brigar por vocês”.","<b>O básico que passa por Brasília:</b> a prefeitura investe <b>26.9% em saúde</b> — e o recurso depende do federal liberar."]}},{"nome":"Garibaldi","estudo":"<h2>ESTUDO DE CIDADE — GARIBALDI (RS)</h2><p>&gt; Rony (vereador de Erechim, pré-candidato a Dep. Federal) em visita à <b>Capital Nacional do Espumante</b>, coração da Serra Gaúcha, colonização italiana. É <b>visitante</b> — respeito/pertencimento + cruzar com o DNA (bolso/tributos, empreendedorismo, fé/família, anti-Lula/PT). <b>ATENÇÃO: cidade governada pela direita e com base empresarial aliada — o jogo aqui é somar, não atacar a gestão local.</b></p><h3>⚠️ CORREÇÕES DE PRECISÃO (não errar em vídeo)</h3><p>1. <b>Garibaldi NÃO é governada pela esquerda — é DIREITA/centro-direita.</b> Prefeito <b>Sérgio Chesini (PP), REELEITO em 2024 com 62,64%</b>, vice <b>Adriano Carniel (PP)</b>, coligação apoiada por <b>PP + Republicanos + PL + Podemos</b>. Derrotou Antônio Cettolin (MDB). A Câmara é dominada pelo bloco governista (PP + PL somam 6 das 9 cadeiras). → O alvo &quot;esquerda&quot; vale no <b>federal (Lula/PT/Haddad)</b>, NÃO no municipal. <b>Não atacar a gestão local — é aliada.</b> Enquadrar o prefeito/empresários como parceiros contra a asfixia tributária de Brasília.</p><p>   - Fontes: <a href=\"https://leouve.com.br/cidades/garibaldi/sergio-chesini-pp-e-reeleito-prefeito-de-garibaldi/\" target=\"_blank\" rel=\"noopener\">Leouve – Chesini reeleito</a> · <a href=\"https://www.otempo.com.br/eleicoes/2024/prefeito/2024/10/9/sergio-chesini-do-pp-e-eleito-prefeito-de-garibaldi-rs-nas-eleic\" target=\"_blank\" rel=\"noopener\">O Tempo</a> · <a href=\"https://resultados.tre-rs.jus.br/eleicoes/2024/619/RS86690.html\" target=\"_blank\" rel=\"noopener\">TRE-RS – resultado 2024</a></p><p>2. <b>CILADA do título &quot;Capital Nacional do Espumante&quot;: o PL é relatado por deputada do PT.</b> O PL 9692/2018 (que dá o título federal) tem como <b>relatora a dep. Denise Pessôa (PT/RS)</b>; aprovado na Comissão de Cultura em dez/2025, segue para a CCJ. → <b>Não trashear o título e não dizer que &quot;só a direita defende o espumante&quot;</b> — a esquerda local vai reivindicar o crédito. Elogiar a cidade e o título; a briga do bolso é contra o <b>imposto da reforma tributária</b>, não contra o título.</p><p>   - Fontes: <a href=\"https://www.camara.leg.br/proposicoesWeb/fichadetramitacao?idProposicao=2168758\" target=\"_blank\" rel=\"noopener\">Câmara dos Deputados – PL 9692/2018</a> · <a href=\"https://leouve.com.br/geral/projeto-que-reconhece-garibaldi-como-capital-nacional-do-espumante-avanca-apos-aprovacao-de-relatorio/\" target=\"_blank\" rel=\"noopener\">Leouve</a></p><p>3. <b>CILADA &quot;trabalho escravo&quot; no setor do vinho (2023).</b> Fev/2023: 207 trabalhadores resgatados em condição análoga à escravidão na colheita da uva (Bento Gonçalves), via <b>terceirizada Fênix</b>, que prestava serviço a <b>Aurora, Salton e Vinícola Garibaldi</b> (a cooperativa). As três fecharam <b>acordo de R$ 7 mi com o MPT</b> e adotaram mudanças. → <b>Não elogiar o setor cegamente NEM levantar o tema.</b> Se a esquerda usar, enquadrar: foi <b>terceirizada</b>, houve <b>acordo e correção</b>, e não jogar contra os empregadores locais (aliados). Estar ciente para não ser pego de surpresa.</p><p>   - Fontes: <a href=\"https://www.infomoney.com.br/carreira/trabalho-escravo-aurora-garibaldi-e-salton-fazem-acordo-de-r-7-milhoes-com-mpt/\" target=\"_blank\" rel=\"noopener\">InfoMoney – acordo R$ 7 mi</a> · <a href=\"https://reporterbrasil.org.br/2024/03/comentarios-das-vinicolas-aurora-garibaldi-e-salton-sobre-mudancas-apos-caso-de-trabalho-escravo/\" target=\"_blank\" rel=\"noopener\">Repórter Brasil – mudanças</a></p><p>4. <b>Garibaldi NÃO é violenta — é cidade SEGURA.</b> Taxa de criminalidade ~13% ABAIXO da média do RS (cerca de 5.944 vs 6.861 ocorrências/100 mil hab.); crimes predominantes são <b>não violentos (ameaça, estelionato, golpes eletrônicos)</b>. Tem Guarda Civil Municipal (criada em 2020). → <b>Não usar discurso de &quot;caos na segurança&quot;</b> — a checagem derruba. Brecha real e simpática: <b>golpes/estelionato eletrônico</b> (proteção ao idoso/família).</p><p>   - Fontes: <a href=\"https://crimebrasil.com.br/cidade/rs/garibaldi\" target=\"_blank\" rel=\"noopener\">CrimeBrasil – Garibaldi (compila SSP/RS)</a> · <a href=\"https://www.ssp.rs.gov.br/indicadores-da-criminalidade\" target=\"_blank\" rel=\"noopener\">Painel SSP/RS</a></p><p>5. <b>&quot;Municipal x estadual x federal&quot;:</b> a dor tributária do espumante é <b>FEDERAL</b> (reforma/Imposto Seletivo — LC 214/2025, sancionada no governo Lula). É esse o alvo legítimo. Gestão municipal (Chesini/PP) e Estado (Leite) são do mesmo campo — não confundir nem responsabilizar o prefeito aliado pela carga tributária.</p><h3>🏆 GANCHOS FORTES (cruzados com o DNA do Rony)</h3><h4>A. Imposto Seletivo / Reforma Tributária asfixiando o espumante (CAMPEÃO — bolso + anti-Lula + empreendedorismo + defesa da cidade)</h4><ul><li>Estimativas da cadeia apontam tributação do vinho podendo chegar a <b>~55% a partir de 2027</b> com o <b>Imposto Seletivo</b> da reforma. Risco de <b>bitributação</b> pela combinação <b>ad valorem (% do valor) + ad rem (valor fixo por litro/teor alcoólico)</b>, que penaliza margem/escala do vinho nacional. Reforma é a <b>EC 132/2023 + LC 214/2025 (sancionada sob o governo Lula)</b>. O setor (Consevitis-RS, Ibravin, Uvibra) pede <b>tratamento diferenciado</b> para vinho e espumante frente aos destilados e entregou <b>documento de demandas a Geraldo Alckmin em Caxias do Sul</b>.</li></ul><p>  - Ângulo Rony: *Brasília taxa o suor de quem produz — a Capital do Espumante não pode virar caixa do governo Lula.* Bolso + empreendedorismo + defender a cidade anfitriã. <b>É o gancho que mais casa com o palanque empresarial do almoço.</b></p><p>  - Fontes: <a href=\"https://www.otempo.com.br/economia/2026/6/5/imposto-seletivo-para-bebidas-alcoolicas-pode-gerar-bitributacao-e-setor-avalia-impacto\" target=\"_blank\" rel=\"noopener\">O Tempo – IS e bitributação em bebidas</a> · <a href=\"https://www.consevitis-rs.com.br/pt/noticias/setor-vitivinicola-entrega-documento-com-demandas-estrategicas-a-geraldo-alckmin-em-caxias-do-sul\" target=\"_blank\" rel=\"noopener\">Consevitis-RS – demandas a Alckmin</a> · <a href=\"https://www.diretriz.cnt.br/reforma-tributaria-bebidas/\" target=\"_blank\" rel=\"noopener\">CNT/Diretriz – reforma e bebidas</a> · <a href=\"https://www.esteticare.com.br/imposto-seletivo-sobre-o-vinho-preocupa-pequenas-vinicolas-e-reacende/\" target=\"_blank\" rel=\"noopener\">Estimativa ~55%</a></p><h4>B. Cidade que PRODUZ — empreendedorismo e indústria (trabalho vs. assistencialismo)</h4><ul><li><b>PIB per capita R$ 103.842 (2023)</b> — quase o DOBRO da média do RS (~R$ 59,7 mil) e acima de Bento Gonçalves e Caxias. <b>Indústria = 52,6% do valor adicionado</b>; salário médio ~R$ 4,1 mil (2,9 salários mínimos); ~35,5 mil habitantes. Setor de espumante <b>cresceu 10% em 2025</b>; <b>exportações de espumante +29,8%</b> no 1º sem/2025. <b>Cooperativa Vinícola Garibaldi</b> (1931) reúne <b>430+ famílias</b> e ~1.000 ha de vinhedos.</li></ul><p>  - Ângulo Rony: *Aqui ninguém pede favor a Brasília — aqui se trabalha, se produz e se exporta.* Vitrine do trabalho/empreendedorismo que ele defende contra o assistencialismo.</p><p>  - Fontes: <a href=\"https://cidades.ibge.gov.br/brasil/rs/garibaldi/panorama\" target=\"_blank\" rel=\"noopener\">IBGE Cidades – Garibaldi</a> · <a href=\"https://minutomt.com.br/agro/setor-de-espumantes-cresce-10-em-2025-e-consolida-forca-coletiva-das-vinicolas-de-garibaldi/\" target=\"_blank\" rel=\"noopener\">Setor +10% / APEG</a> · <a href=\"https://www.consevitis-rs.com.br/pt/noticias/setor-vitivinicola-brasileiro-comemora-resultados-positivos-nas-exportacoes-no-primeiro-semestre\" target=\"_blank\" rel=\"noopener\">Consevitis-RS – exportações</a> · <a href=\"https://www.wine.com.br/winepedia/vinicola-garibaldi/\" target=\"_blank\" rel=\"noopener\">Cooperativa Garibaldi</a></p><h4>C. Agro / uva / agricultura familiar (propriedade + produtor)</h4><ul><li>Cadeia da uva movida por <b>famílias produtoras</b> (herança da colonização italiana). Safra do RS 2025/26 estimada em <b>~800 milhões de kg</b> (alta sobre ~750 mi em 2024/25). O RS concentra ~90% da vitivinicultura nacional; Garibaldi + Bento respondem por cerca de <b>80% da produção nacional de espumante</b>.</li></ul><p>  - Ângulo Rony: defesa do <b>pequeno produtor e da propriedade</b> contra a carga tributária e a burocracia — o produtor da uva é quem sustenta a taça. (Casa com a bandeira anti-MST/propriedade sem precisar de conflito local.)</p><p>  - Fontes: <a href=\"https://revistacultivar.com.br/noticias/setor-preve-alta-na-producao-de-uva-para-safra-2025-26-no-rs\" target=\"_blank\" rel=\"noopener\">Revista Cultivar – safra 2025/26 RS</a></p><h4>D. Fé, família e tradição italiana (valores cristãos + pertencimento)</h4><ul><li>Colonização <b>católica italiana</b>; <b>São Pedro é o padroeiro</b>, Igreja Matriz São Pedro (1924); em 2025 a região celebrou os <b>150 anos da Imigração Italiana</b>. Cultura de família, trabalho e fé — exatamente o eixo valores do Rony.</li></ul><p>  - Ângulo Rony: *A força de Garibaldi vem da fé, da família e do trabalho que os imigrantes trouxeram — é isso que precisamos defender no Brasil.*</p><p>  - Fontes: <a href=\"https://turismo.garibaldi.rs.gov.br/local/igreja-matriz-sao-pedro\" target=\"_blank\" rel=\"noopener\">Igreja Matriz São Pedro</a> · <a href=\"https://www.garibaldi.rs.gov.br/noticias/comemoracoes-dos-150-anos-da-imigracao-italiana-destacam-sobrenomes-de-pioneiros-da-antiga-colonia-conde-d-eu\" target=\"_blank\" rel=\"noopener\">150 anos da Imigração Italiana</a></p><h4>E. Golpes/estelionato eletrônico (secundário — proteção ao idoso/família)</h4><ul><li>Mesmo em cidade segura, <b>estelionato e golpes eletrônicos</b> estão entre os crimes que mais aparecem. Gancho leve de proteção ao idoso e à família, sem falso alarme de &quot;violência&quot;.</li></ul><p>  - Fonte: <a href=\"https://crimebrasil.com.br/cidade/rs/garibaldi\" target=\"_blank\" rel=\"noopener\">CrimeBrasil – perfil de crimes Garibaldi</a></p><h3>💛 ORGULHO / PERTENCIMENTO (gravar na chegada, mostra respeito)</h3><ul><li>Origem na <b>Colônia Conde d&#x27;Eu (1870)</b>; emancipada em <b>31/10/1900 com o nome Garibaldi</b>, homenagem a <b>Giuseppe Garibaldi</b>, herói da Revolução Farroupilha. <b>Primeiro espumante do Brasil produzido aqui em 1913</b> (Manoel Peterlongo Filho). <b>Fenachamp — a maior festa de espumante do país</b> (bienal, anos ímpares, outubro). Passeio da <b>Maria Fumaça</b> (Bento–Garibaldi–Carlos Barbosa). Em 2025 a cidade fez <b>125 anos</b> com visita do <b>tataraneto de Giuseppe Garibaldi</b>.</li></ul><p>  - Fontes: <a href=\"https://www.garibaldi.rs.gov.br/pagina/historia\" target=\"_blank\" rel=\"noopener\">Prefeitura – História</a> · <a href=\"https://turismo.garibaldi.rs.gov.br/local/igreja-matriz-sao-pedro\" target=\"_blank\" rel=\"noopener\">Igreja Matriz São Pedro</a> · <a href=\"https://www.fenachamp.com.br\" target=\"_blank\" rel=\"noopener\">Fenachamp</a> · <a href=\"https://www.cisga.com.br/noticias/garibaldi-celebra-125-anos-com-visita-do-tataraneto-de-giuseppe-garibaldi\" target=\"_blank\" rel=\"noopener\">125 anos + tataraneto de Garibaldi</a></p><h3>Lacunas (não achado — não inventar)</h3><ul><li><b>Identidade e alinhamento do &quot;ex-prefeito&quot; do almoço</b> — CONFIRMAR ANTES. O ex-prefeito mais notório é <b>Antônio Cettolin (MDB)</b>, 4 mandatos/16 anos, que <b>PERDEU para Chesini em 2024</b> e é oposição; ex-secretários dele sofreram busca e apreensão da PF. <b>Se o almoço for com Cettolin, é palanque de OPOSIÇÃO ao prefeito aliado (PP)</b> — risco de Rony entrar em briga local. Se for outro ex-prefeito (PP-aliado), é palanque amigo. Não assumir. (<a href=\"https://www.portaladesso.com.br/noticias/18921/policia-federal-faz-busca-e-apreensao-em-garibaldi-e-mira-ex-secretarios-de-cettolin.html\" target=\"_blank\" rel=\"noopener\">Cettolin/PF</a> · <a href=\"https://www.garibaldi.rs.gov.br/pagina/ex-prefeitos\" target=\"_blank\" rel=\"noopener\">lista de ex-prefeitos</a>)</li><li><b>Quem são &quot;Pitta&quot; e &quot;Kauan&quot;</b> — NÃO constam entre os 9 vereadores atuais nem como prefeito/vice. São provavelmente <b>articuladores/base local ou empresários</b>; verificar cargo e alinhamento antes de tratar como autoridade. (Vereadores 2025-28: Douglas Cettolin/MDB, Livio Bortolini/PP, Marcia Pedersetti/PP, Bruno da Saúde/PL, Cassio Facchi/PP <a href=\"https://leouve.com.br/ultimas/garibaldi-conhece-seus-9-novos-vereadores-neste-domingo/\" target=\"_blank\" rel=\"noopener\">presidente], Luana Meneghetti/MDB, Leandro Delazeri/PP, Arnaldo Seganfredo/MDB, Giovan Flores/PL — [fonte</a>). <b>Aliados naturais na Câmara: os 2 vereadores do PL (Bruno da Saúde, Giovan Flores).</b></li><li>Homicídios de Garibaldi (nº exato isolado) na SSP/RS; IDHM e densidade; nº de empregos do setor espumante só no município; produção de uva só do município; posição pública do prefeito Chesini e da bancada federal de direita do RS sobre o Imposto Seletivo do vinho.</li></ul>","elec":{"municipio":"GARIBALDI","lula_pct":24.2,"bolso_pct":75.8,"lula_votos":5250,"bolso_votos":16455,"vencedor":"Bolsonaro","abst_pct":12.6,"branco_pct":1.5,"nulo_pct":2.1,"aptos":25767,"comparecimento":22519,"dep_fed":{"nome":"MARCIO BIOLCHI","partido":"MDB","votos":2980},"dep_est":{"nome":"GUILHERME PASIN","partido":"PP","votos":5298}},"dossie":{"e":{"ano":2024,"pop":35219,"orc":308863529.55,"prop":58042180.2,"fed":67242828.06,"est":85542210.88,"pp":18.8,"pf":21.8,"pe":27.7,"dep":49.5,"principal":"Transferências (União/Estado)","setor":{"dom":"Indústria","dom_pct":52.6,"pib":2997969000.0,"agro":2.6,"ind":52.6,"serv":36.6,"adm":8.3},"gasto":[{"nome":"Saúde","valor":60527783.9,"pct":21.0},{"nome":"Educação","valor":52047558.09,"pct":18.1},{"nome":"Transporte","valor":50948062.18,"pct":17.7},{"nome":"Previdência","valor":35442853.81,"pct":12.3}]},"hooks":["<b>Terreno amigo:</b> Garibaldi deu <b>75.8% ao Bolsonaro</b> em 2022 — cidade de família, trabalho e fé. Abrir reconhecendo o povo.","<b>O básico que passa por Brasília:</b> a prefeitura investe <b>21.0% em saúde</b> — e o recurso depende do federal liberar."]}},{"nome":"Jacutinga","estudo":"<h2>ESTUDO DE CIDADE — JACUTINGA (RS)</h2><p>&gt; Rony (vereador de Erechim, pré-candidato a Dep. Federal) em visita. <b>É a Jacutinga do RS</b> — cidade pequena (3,3 mil hab.), agrícola, colonização italiana, na região de Erechim (Alto Uruguai). Rony é <b>visitante e quase vizinho</b>: pertencimento regional é o eixo. À noite há <b>lançamento de candidatura de Filipe Gil (aliado local)</b> — tom de APOIO, nunca de crítica.</p><h3>⚠️ CORREÇÕES DE PRECISÃO (não errar em vídeo)</h3><p>1. <b>É JACUTINGA-RS, não Jacutinga-MG.</b> Existe uma Jacutinga em Minas Gerais (Sul de Minas, ~25 mil hab., polo de moda íntima/turismo, tem a cooperativa &quot;Coapeja&quot; e a Catedral de Santo Antônio de MG). <b>NADA disso é da nossa cidade.</b> A nossa é o <b>município gaúcho do Alto Uruguai, IBGE 4310900, ~3.338 hab. (Censo 2022), economia agrícola, a ~395 km de Porto Alegre e coladinho na região de Erechim.</b> Não citar Coapeja, moda íntima, nem dados de MG.</p><p>   - Fontes: <a href=\"https://cidades.ibge.gov.br/brasil/rs/jacutinga/panorama\" target=\"_blank\" rel=\"noopener\">IBGE Cidades – Jacutinga/RS</a> · <a href=\"https://www.amau.com.br/site/jacutinga/\" target=\"_blank\" rel=\"noopener\">AMAU – Jacutinga</a></p><p>2. <b>O governo municipal NÃO é da esquerda.</b> Prefeito <b>Ademir Sakrezenski é do MDB (centro)</b>; o 2º colocado em 2024 foi do <b>PP (centro-direita)</b>. <b>PT não teve candidato a prefeito.</b> → O alvo &quot;Lula/PT/esquerda&quot; vale no <b>federal</b>, não no palanque municipal. No local, o enquadramento é <b>interior produtivo x abandono federal</b>, não &quot;esquerdopata&quot;.</p><p>   - Fonte: <a href=\"https://www.otempo.com.br/eleicoes/2024/candidatos/rio-grande-do-sul/jacutinga/prefeito/ademir-sakrezenski-15\" target=\"_blank\" rel=\"noopener\">O Tempo – Ademir Sakrezenski eleito</a></p><p>3. <b>Padroeiro é SANTO ANTÔNIO</b> (não Nossa Senhora). Igreja bendita em 09/04/1930; paróquia criada em 1937. Jacutinga pertence à <b>Diocese de Erechim</b> — a mesma diocese da cidade do Rony. <b>Não errar o santo em vídeo de fé.</b></p><p>   - Fonte: <a href=\"https://www.diocesedeerexim.org.br/paroquia/santo-antonio--jacutinga-22\" target=\"_blank\" rel=\"noopener\">Diocese de Erexim – Paróquia Santo Antônio, Jacutinga</a></p><p>4. <b>Filipe Gil (o aliado que lança candidatura) não tem registro público achável online.</b> Não inventar cargo, partido ou biografia. Confirmar com a coordenação local ANTES de gravar qualquer coisa nominal. Tom sempre de apoio (ver &quot;Lacunas&quot;).</p><p>5. <b>Não chamar Jacutinga de &quot;cidade violenta&quot;.</b> É município minúsculo e rural; não há base para discurso de criminalidade (dado de homicídios é lacuna, provavelmente próximo de zero). Evitar.</p><h3>🏆 GANCHOS FORTES (cruzados com o DNA do Rony)</h3><h4>A. Interior produtivo / agro / propriedade (CAMPEÃO — a alma da cidade)</h4><ul><li><b>A agropecuária responde por 53% do valor adicionado do município</b> (serviços 27,9%, administração pública 12,2%, indústria 6,9%). Culturas: <b>soja, milho, trigo, feijão, cevada e mandioca</b>. É uma economia que vive do que planta — terra, trabalho e propriedade.</li><li><b>PIB per capita de Jacutinga (~R$ 56,5 mil em 2023) é SUPERIOR à média do RS (~R$ 50,7 mil)</b> e à da própria região de Erechim. Ângulo: *&quot;o interior que trabalha e produz, e ainda assim é o que Brasília mais esquece.&quot;* Cruza com bolso/tributos (o produtor sustenta o país e é sufocado de imposto) e com trabalho x assistencialismo.</li></ul><p>   - Fontes: <a href=\"https://www.caravela.info/en/regional/jacutinga---rs\" target=\"_blank\" rel=\"noopener\">Economia de Jacutinga – Caravela/IBGE</a> · <a href=\"https://jacutinga.rs.gov.br/sobre-o-municipio/\" target=\"_blank\" rel=\"noopener\">Prefeitura – Sobre o Município</a></p><ul><li><b>Prefeito é agricultor.</b> Ademir Sakrezenski (MDB) é lavrador de origem (nascido em Barão de Cotegipe). Reforça o retrato de uma cidade governada por gente da roça — casa com a defesa da agricultura familiar e da propriedade rural. ⚠️ Não atacar o prefeito (é aliado potencial de centro); citar como orgulho local.</li></ul><p>   - Fonte: <a href=\"https://www.otempo.com.br/eleicoes/2024/candidatos/rio-grande-do-sul/jacutinga/prefeito/ademir-sakrezenski-15\" target=\"_blank\" rel=\"noopener\">O Tempo – perfil Ademir Sakrezenski</a></p><h4>B. Fé / família / mesma diocese do Rony (pertencimento + valores)</h4><ul><li><b>Paróquia Santo Antônio</b>, coração da comunidade desde 1930; Jacutinga está na <b>Diocese de Erechim</b>, a mesma da cidade do Rony. Gancho: *&quot;a nossa fé é a mesma, o nosso santo padroeiro é vizinho de casa.&quot;* Casa direto com fé/família e com o pertencimento regional.</li></ul><p>   - Fonte: <a href=\"https://www.diocesedeerexim.org.br/paroquia/santo-antonio--jacutinga-22\" target=\"_blank\" rel=\"noopener\">Diocese de Erexim – Santo Antônio, Jacutinga</a></p><ul><li><b>Colonização italiana e de trabalho duro.</b> A cidade nasceu de famílias como Tortelli, Fabiane, Nava e Fioravante, e da lida na madeira/serrarias antes da lavoura. Narrativa de família, fé e suor — exatamente o RS conservador que Rony representa. ⚠️ Confirmar sobrenomes localmente antes de citar nominalmente.</li></ul><p>   - Fonte: <a href=\"https://www.amau.com.br/site/jacutinga/\" target=\"_blank\" rel=\"noopener\">AMAU – história de Jacutinga</a></p><h4>C. Terreno amigo / RS conservador (leitura de campanha)</h4><ul><li>O RS deu <b>56,35% a Bolsonaro no 2º turno de 2022</b>, e as cidadezinhas de colonização italiana do Alto Uruguai costumam ser ainda mais à direita. É palanque naturalmente favorável ao discurso anti-Lula/anti-PT <b>no plano federal</b> — que é onde Rony disputa. ⚠️ O percentual EXATO de Jacutinga é lacuna (confirmar no TSE); não cravar número da cidade sem checar.</li></ul><p>   - Fonte: <a href=\"https://www.em.com.br/app/noticia/politica/2022/10/30/interna_politica,1414521/quem-ganhou-o-2-turno-da-eleicao-para-presidente-no-rio-grande-do-sul.shtml\" target=\"_blank\" rel=\"noopener\">Estado de Minas – resultado RS 2º turno 2022</a></p><h4>D. Apoio ao aliado — lançamento do Filipe Gil (à noite)</h4><ul><li>O evento da noite é <b>lançamento de candidatura de Filipe Gil</b> (provável aliado local). Postura: <b>fortalecer o palanque, não roubar a cena.</b> Ângulo seguro sem depender de dados que não temos: *&quot;gente nova, do interior, disposta a trabalhar pela cidade e a levar a voz de Jacutinga mais longe.&quot;* ⚠️ Só personalizar (cargo/partido/bandeiras dele) depois de confirmar com a coordenação. Ver &quot;Lacunas&quot;.</li></ul><h3>💛 ORGULHO / PERTENCIMENTO (gravar na chegada, mostra respeito)</h3><ul><li><b>Jacutinga = terra da ave.</b> O nome vem da <b>jacutinga</b>, ave nativa que existia em fartura na região — símbolo de mata farta e de um lugar que nasceu do meio do verde.</li><li><b>Município jovem e batalhador:</b> distrito em 1952, emancipado em <b>1º de junho de 1964</b> (Lei estadual nº 4.734), instalado em 10/01/1965 — nasceu do desbravamento das matas e das serrarias da antiga fazenda Quatro Irmãos. Gentílico: <b>jacutinguense</b>.</li><li><b>Interior que produz acima da média do estado</b> (PIB per capita &gt; média do RS) — orgulho legítimo de cidade pequena que se sustenta pelo trabalho.</li></ul><p>   - Fontes: <a href=\"https://jacutinga.rs.gov.br/sobre-o-municipio/\" target=\"_blank\" rel=\"noopener\">Prefeitura – Sobre o Município</a> · <a href=\"https://www.amau.com.br/site/jacutinga/\" target=\"_blank\" rel=\"noopener\">AMAU – Jacutinga</a></p><h3>Lacunas (não achado — não inventar)</h3><ul><li><b>Filipe Gil:</b> quem é, cargo pretendido, partido, bandeiras — SEM registro público online. Confirmar 100% com a coordenação local antes de gravar. É o item mais crítico da agenda.</li><li><b>Voto de Jacutinga em 2022 (Bolsonaro x Lula):</b> percentual municipal exato (só temos o do RS). Checar no <a href=\"https://resultados.tse.jus.br/\" target=\"_blank\" rel=\"noopener\">TSE – Resultados</a>.</li><li><b>Prefeito Sakrezenski:</b> se é 1º ou 2º mandato; principais obras/pautas da gestão 2025-2028.</li><li><b>Câmara de Vereadores:</b> composição, presidente, se há vereador parceiro do Rony na cidade (sites de câmaras pequenas costumam ser precários).</li><li><b>Dados sociais finos:</b> salário médio, taxa de emprego, dependência de FPM, IDHM atualizado (só temos IDHM 0,726 de 2010).</li><li><b>Segurança pública (SSP/RS):</b> sem dados relevantes achados — cidade muito pequena; não usar como pauta.</li><li><b>Divergência de área</b> entre fontes (IBGE ~193,9 km² x AMAU ~179,3 km²) — usar o número do IBGE se precisar citar.</li><li><b>Detalhes do almoço (11h):</b> anfitrião, local, público — confirmar com a agenda.</li></ul>","elec":{"municipio":"JACUTINGA","lula_pct":35.9,"bolso_pct":64.1,"lula_votos":881,"bolso_votos":1570,"vencedor":"Bolsonaro","abst_pct":12.4,"branco_pct":1.9,"nulo_pct":2.5,"aptos":2928,"comparecimento":2565,"dep_fed":{"nome":"AFONSO HAMM","partido":"PP","votos":543},"dep_est":{"nome":"IVAR PAVAN","partido":"PT","votos":346}},"dossie":{"e":{"ano":2024,"pop":3198,"orc":46510849.95,"prop":3924361.41,"fed":19967405.07,"est":10957004.98,"pp":8.4,"pf":42.9,"pe":23.6,"dep":66.5,"principal":"Transferências (União/Estado)","setor":{"dom":"Agropecuária","dom_pct":53.0,"pib":232301000.0,"agro":53.0,"ind":6.9,"serv":27.9,"adm":12.2},"gasto":[{"nome":"Saúde","valor":8369000.99,"pct":19.2},{"nome":"Educação","valor":6409591.56,"pct":14.7},{"nome":"Administração","valor":5852105.24,"pct":13.4},{"nome":"Previdência","valor":5781393.44,"pct":13.3}]},"hooks":["<b>Terreno amigo:</b> Jacutinga deu <b>64.1% ao Bolsonaro</b> em 2022 — cidade de família, trabalho e fé. Abrir reconhecendo o povo.","<b>Dependência de Brasília:</b> <b>66.5%</b> do orçamento vem de repasses federais/estaduais. Gancho: “o futuro daqui se decide em Brasília — e é lá que eu quero brigar por vocês”.","<b>Defesa do produtor:</b> o agro é <b>53.0%</b> da economia. Gancho: “enquanto o Lula taxa quem produz, a gente precisa de quem defenda o produtor rural”.","<b>O básico que passa por Brasília:</b> a prefeitura investe <b>19.2% em saúde</b> — e o recurso depende do federal liberar."]}},{"nome":"Novo Hamburgo","estudo":"<h2>ESTUDO DE CIDADE — NOVO HAMBURGO (RS)</h2><p>&gt; Rony (vereador de Erechim, pré-candidato a Dep. Federal) em visita <b>à noite, 14/08/2026</b>. É <b>visitante</b> — conteúdo precisa mostrar respeito/pertencimento + cruzar com o DNA dele (anti-Lula/PT, bolso/tributos, trabalho vs. assistencialismo, fé/família, anti-sistema). Cidade = <b>Capital Nacional do Calçado</b>, colonização alemã, coração do Vale do Sinos.</p><h3>⚠️ CORREÇÕES DE PRECISÃO (não errar em vídeo)</h3><p>1. <b>Novo Hamburgo NÃO é &quot;cidade violenta&quot;.</b> É o OPOSTO: fechou 2025 com a <b>3ª menor taxa de homicídios do RS</b> entre municípios de 100 mil+ (índice 4,39), atrás só de Pelotas e Uruguaiana; <b>−44% em homicídios</b>, <b>latrocínio zerado</b>, <b>−38% em roubos de veículo/comércio</b>. NÃO chamar de perigosa — a checagem derruba. Ângulo correto: <b>elogiar</b> e creditar gestão <b>estadual (Brigada Militar/RS Seguro) + municipal (Guarda + videomonitoramento)</b> — NÃO o governo federal.</p><p>2. <b>O prefeito é ALIADO da direita — NÃO atacar.</b> <b>Gustavo Finck (PP)</b>, eleito 2024 com 53,32%, vice <b>Gerson Haas (PL)</b>, coligação &quot;Coragem para Mudar&quot; (PP/PL/Republicanos/PRD). É campo Rony. Alvo &quot;esquerda&quot; vale no <b>federal (Lula/PT)</b>; no municipal o enquadramento é de parceria.</p><p>3. <b>Cuidado com o &quot;tarifaço do Trump&quot; (MINA TERRESTRE).</b> A tarifa de 25% dos EUA sobre o calçado brasileiro <b>atinge em cheio</b> o principal destino de exportação de Novo Hamburgo (EUA compram 1 em cada 5 pares) e ameaça empregos locais. Defender a tarifa na capital do calçado é tiro no pé. <b>Foco seguro:</b> culpar a <b>&quot;invasão asiática&quot;/China</b> (importados baratos) + <b>Custo Brasil/tributos</b> + <b>câmbio</b> — não a tarifa americana.</p><p>4. <b>Municipal x estadual x federal:</b> enchente/reconstrução de diques = obra estruturante com <b>recurso federal (R$ 1,9 bi na bacia do Sinos) + estado</b>; segurança = <b>estado + município</b>; crise do calçado = <b>política federal (tributos, câmbio, comércio exterior)</b>. Não misturar culpas.</p><p>5. <b>Fátima Daudt (MDB) é RIVAL, não &quot;esquerda&quot;.</b> Ex-prefeita (2017–2024), agora <b>pré-candidata a Dep. Federal pelo MDB</b> — disputa a MESMA vaga do Rony. É centro, não esquerda. Se citar a &quot;herança financeira&quot;, enquadrar como &quot;velha política/conta que não fecha&quot;, nunca como &quot;esquerdopata&quot;.</p><h3>🏆 GANCHOS FORTES (cruzados com o DNA do Rony)</h3><h4>A. Indústria do calçado / empregos (CAMPEÃO — bolso + trabalho + anti-China + anti-Custo Brasil)</h4><ul><li><b>Novo Hamburgo fechou 2025 com saldo NEGATIVO de empregos (−963 vagas formais)</b> — o 1º ano no vermelho desde a pandemia, quebrando 4 anos seguidos de saldo positivo. Base industrial concentrada = sente mais o baque externo.</li></ul><p>  - Fonte: <a href=\"https://www.abcmais.com/brasil/rio-grande-do-sul/vale-do-rio-dos-sinos/novo-hamburgo/pela-primeira-vez-desde-a-pandemia-novo-hamburgo-fecha-o-ano-com-saldo-negativo-de-empregos-canoas-e-sao-leopoldo-tem-desempenho-positivo/\" target=\"_blank\" rel=\"noopener\">abc+ (saldo negativo de empregos)</a></p><ul><li><b>&quot;Invasão asiática&quot;: a China está afogando o setor.</b> No 1º semestre de 2025 o setor calçadista deixou de criar ~7,8 mil empregos por causa das importações; a <b>China é a principal origem</b> (9,7 mi de pares, +27,4% em volume). Ásia = 87% dos pares importados. Abicalçados diz que o desafio é <b>estancar a importação</b>. Ângulo Rony: produto brasileiro, feito por trabalhador brasileiro, perdendo para importado barato — bolso + trabalho + soberania.</li></ul><p>  - Fontes: <a href=\"https://www.jornaldocomercio.com/economia/2025/04/1200257-desafio-do-setor-calcadista-e-estancar-aumento-das-importacoes-diz-abicalcados.html\" target=\"_blank\" rel=\"noopener\">Jornal do Comércio (Abicalçados/importações)</a> · <a href=\"https://www.abcmais.com/economia/producao-de-calcados-cresce-em-2024-mas-invasao-asiatica-ainda-preocupa-entenda/\" target=\"_blank\" rel=\"noopener\">abc+ (&quot;invasão asiática&quot;)</a></p><ul><li><b>A Abicalçados tem sede em Novo Hamburgo</b> — a cidade é o cérebro nacional do setor. ~80% da exportação de calçados do Brasil sai do RS, com NH no centro (a região exporta ~US$ 2 bi). Gancho: quando o setor tosse, Novo Hamburgo tem pneumonia.</li></ul><p>  - Fonte: <a href=\"https://wwd.com/sourcing-journal/trade/25-brazil-tariffs-us-footwear-shoes-ustr-fdra-aafa-abicalcados-1239073976/\" target=\"_blank\" rel=\"noopener\">WWD/Sourcing Journal (exportação, papel de NH e Abicalçados)</a></p><ul><li><b>Fábricas fechando.</b> Ex.: a Brasil Shoes (Sapiranga, Vale do Sinos) encerrou atividades demitindo 200 trabalhadores. Símbolo do sapateiro que perde o emprego.</li></ul><p>  - Fonte: <a href=\"https://exclusivo.com.br/negocios/fabrica-de-calcados-fecha-as-portas-e-demite-200-trabalhadores/\" target=\"_blank\" rel=\"noopener\">Exclusivo (fábrica fecha, 200 demitidos)</a></p><h4>B. Tarifaço dos EUA (DELICADO — ver Correção 3; usar SÓ pelo ângulo &quot;proteger emprego&quot;)</h4><ul><li>Tarifa de 25% de Trump sobre calçado brasileiro derruba exportação para o principal mercado. Abicalçados revisou projeção para <b>queda média de 7,1%</b> nas exportações até fim de 2026; para os EUA, receita já caiu <b>−23,6%</b> no semestre. O tema <b>divide</b> trabalhadores e empresários do setor.</li></ul><p>  - Fontes: <a href=\"https://apublica.org/2026/07/tarifaco-divide-trabalhadores-e-empresarios-do-setor-de-calcados/\" target=\"_blank\" rel=\"noopener\">A Pública (tarifaço divide o setor)</a> · <a href=\"https://www.otempo.com.br/economia/2026/7/16/setores-afetados-pelo-tarifaco-como-textil-calcadista-e-de-maquinas-temem-demissoes-e-prejuizos\" target=\"_blank\" rel=\"noopener\">O Tempo (setores afetados temem demissões)</a></p><ul><li>⚠️ <b>Não defender a tarifa.</b> Enquadrar como &quot;meu compromisso é com o emprego do sapateiro hamburguense — seja contra importado chinês, seja pra abrir mercado&quot;. Foco no trabalhador, não em Trump.</li></ul><h4>C. Enchentes 2024 + reconstrução travada (munição federal — já na base do Rony)</h4><ul><li><b>Maio/2024: pior enchente da história do rio dos Sinos.</b> ~<b>32 mil pessoas atingidas</b> em Novo Hamburgo, +10 mil casas afetadas, ~12 mil pessoas acolhidas. Bairros baixos (Santo Afonso, Canudos, Roselândia) inundados. Um ano depois, casas condenadas viraram abrigo de usuários de droga — insegurança e abandono.</li></ul><p>  - Fontes: <a href=\"https://www.jornaldocomercio.com/jornal-cidades/2024/05/1153274-novo-hamburgo-tem-32-mil-pessoas-atingidas-pelas-enchentes.html\" target=\"_blank\" rel=\"noopener\">Jornal do Comércio (32 mil atingidos)</a> · <a href=\"https://www.abcmais.com/brasil/rio-grande-do-sul/vale-do-rio-dos-sinos/novo-hamburgo/casas-condenadas-pela-enchente-de-2024-viram-abrigo-para-moradores-de-rua-e-usuarios-de-drogas-em-novo-hamburgo/\" target=\"_blank\" rel=\"noopener\">abc+ (casas condenadas viram abrigo)</a></p><ul><li><b>Obra de proteção travada por burocracia federal.</b> Bacia do Sinos tem <b>R$ 1,9 bi federal disponível</b>, mas <b>impasse entre governo federal e estado atrasou</b> as obras (diques, casas de bombas) — sem previsão de início (abr/2025). Em NH, o sistema de contenção (dique de Santo Afonso até São Leopoldo) é orçado em ~R$ 800 mi. Ângulo Rony: <b>dinheiro existe, o governo Lula não faz sair do papel</b> — liga a `ATAQUE/rio_grande_do_sul.md`.</li></ul><p>  - Fontes: <a href=\"https://agenciabrasil.ebc.com.br/geral/noticia/2025-04/impasse-em-projetos-atrasa-obras-de-protecao-contra-enchentes-no-rs\" target=\"_blank\" rel=\"noopener\">Agência Brasil (impasse atrasa obras de proteção no RS)</a> · <a href=\"https://www.abcmais.com/politica/video-deputados-criticam-burocracia-na-reconstrucao-apos-enchentes-no-rio-grande-do-sul/\" target=\"_blank\" rel=\"noopener\">abc+ (deputados criticam burocracia na reconstrução)</a></p><h4>D. Segurança — para ELOGIAR (contraponto ao &quot;Brasil de Lula&quot;)</h4><ul><li>Novo Hamburgo é hoje <b>referência de queda de criminalidade</b>: 3ª menor taxa de homicídios do RS (100 mil+), −44% homicídios, latrocínio zerado, −38% roubos, resultado de videomonitoramento + Guarda Municipal reorganizada + integração com Brigada/PC. Ângulo: <b>onde há gestão séria (estado + município de direita), a segurança melhora</b> — mérito NÃO é federal.</li></ul><p>  - Fontes: <a href=\"https://canaldomontanha.com.br/noticia/3150/novo-hamburgo-registra-terceira-menor-taxa-de-homicidios-do-rs\" target=\"_blank\" rel=\"noopener\">Canal do Montanha (3ª menor taxa de homicídios do RS)</a> · <a href=\"https://ssp.rs.gov.br/politicas-de-seguranca-do-governo-do-estado-reduzem-criminalidade-na-regiao-metropolitana\" target=\"_blank\" rel=\"noopener\">SSP/RS (políticas de segurança reduzem criminalidade na RMPA)</a></p><h4>E. Conta pública / &quot;velha política&quot; (herança financeira)</h4><ul><li>A gestão Finck (PP) decretou/apontou <b>calamidade financeira</b>, atribuindo a situação à gestão anterior (Fátima Daudt/MDB, 2017–2024), que nega e diz ter contas aprovadas pelo TCE. Ângulo: &quot;quem paga a conta da máquina inchada é o contribuinte&quot; — bolso + anti-velha política.</li></ul><p>  - Fonte: <a href=\"https://expansao.co/ex-prefeita-fatima-daudt-se-manifesta-sobre-decreto-de-calamidade-financeira-em-novo-hamburgo/\" target=\"_blank\" rel=\"noopener\">Expansão (ex-prefeita se manifesta sobre calamidade financeira)</a></p><p>  - ⚠️ <b>Delicado:</b> Fátima Daudt é MDB (centro) e <b>rival direta na disputa por Dep. Federal</b>. Usar como &quot;velha política/renovação&quot;, nunca &quot;esquerda&quot;. Não queimar o aliado Finck no processo — o crédito da faxina é dele.</p><h4>F. Fé / família / tradição alemã (identidade — casa com o DNA cristão-conservador)</h4><ul><li>Cidade de forte matriz <b>evangélica luterana e católica</b> (sede de diocese; Comunidade Evangélica de Hamburgo Velho histórica) e tradição de <b>trabalho, ordem e família</b> herdada da colonização alemã. Casa com &quot;fé, família e trabalho&quot; do Rony sem forçar. Bom para a visita <b>noturna</b> (culto/comunidade, comércio, associativismo).</li></ul><p>  - Fonte: <a href=\"https://www.novohamburgo.rs.gov.br/historia\" target=\"_blank\" rel=\"noopener\">Prefeitura de NH — História</a></p><h3>💛 ORGULHO / PERTENCIMENTO (gravar na chegada, mostra respeito)</h3><ul><li><b>Capital Nacional do Calçado</b>; cidade emancipada de São Leopoldo em <b>05/04/1927</b>; polo criado pelo trabalho dos imigrantes alemães chegados ao Vale do Sinos a partir de 1824.</li><li><b>Hamburgo Velho</b> — centro histórico tombado pelo IPHAN (2015), ~70 imóveis da imigração alemã; <b>Casa Schmitt-Presser (1830)</b>, primeiro imóvel em enxaimel tombado pelo IPHAN, hoje museu comunitário.</li><li><b>Museu Nacional do Calçado</b> (fundado 1999); feiras <b>Fenac/Fimec</b> que movem a economia e trazem o mundo do calçado a NH.</li><li><b>Esporte Clube Novo Hamburgo (o &quot;Anilado&quot;)</b> — <b>Campeão Gaúcho de 2017</b>, o maior do Vale do Sinos, batendo os grandes de POA. Orgulho da torcida.</li></ul><p>  - Fontes: <a href=\"https://www.novohamburgo.rs.gov.br/historia\" target=\"_blank\" rel=\"noopener\">Prefeitura de NH — História</a> · <a href=\"https://pt.wikipedia.org/wiki/Museu_Comunit%C3%A1rio_Casa_Schmitt-Presser\" target=\"_blank\" rel=\"noopener\">pt.wikipedia — Casa Schmitt-Presser</a> · <a href=\"https://www.gazetaesportiva.com/campeonatos/gaucho/novo-hamburgo-vence-inter-no-penaltis-e-fica-com-o-titulo-do-gauchao/\" target=\"_blank\" rel=\"noopener\">Gazeta Esportiva (título gaúcho 2017)</a> · <a href=\"https://cidades.ibge.gov.br/brasil/rs/novo-hamburgo/panorama\" target=\"_blank\" rel=\"noopener\">IBGE Cidades — Novo Hamburgo</a></p><h3>Números-âncora (IBGE)</h3><ul><li>População (Censo 2022): <b>227.646 hab.</b>; densidade ~1.023 hab/km².</li><li>PIB per capita (2023): <b>R$ 52.434,84</b> — <b>200º de 497</b> municípios do RS (acima da média estadual; economia industrial-comercial).</li></ul><p>  - Fonte: <a href=\"https://cidades.ibge.gov.br/brasil/rs/novo-hamburgo/panorama\" target=\"_blank\" rel=\"noopener\">IBGE Cidades — Novo Hamburgo</a></p><h3>Lacunas (não achado — não inventar)</h3><ul><li>Salário médio mensal e nº exato de pessoal ocupado (IBGE Cadastro Central de Empresas — página JS, não extraída).</li><li>Nome/partido de vereador(es) parceiro(s) do Rony na Câmara de NH (confirmar antes de citar aliado local).</li><li>Perfil religioso/bandeiras específicas do prefeito Finck (só confirmado: PP, vice PL, coligação de direita).</li><li>Dado municipal isolado de desemprego (taxa %) e nº atual de empregos no calçado só em NH (2025/2026).</li><li>Existência de invasão MST/conflito de terra na área urbana de NH (cidade é urbana/industrial — provável não haver; não usar o tema anti-MST sem fato local).</li><li>Detalhe da agenda noturna de 14/08 (evento, local, quem recebe).</li></ul>","elec":{"municipio":"NOVO HAMBURGO","lula_pct":31.5,"bolso_pct":68.5,"lula_votos":44134,"bolso_votos":95799,"vencedor":"Bolsonaro","abst_pct":19.4,"branco_pct":1.6,"nulo_pct":2.5,"aptos":180892,"comparecimento":145884,"dep_fed":{"nome":"TENENTE CORONEL ZUCCO","partido":"REPUBLICANOS","votos":18564},"dep_est":{"nome":"DELEGADO ZUCCO","partido":"REPUBLICANOS","votos":15750}},"dossie":{"e":{"ano":2024,"pop":241306,"orc":1575297274.64,"prop":382097924.41,"fed":346176293.04,"est":301974170.78,"pp":24.3,"pf":22.0,"pe":19.2,"dep":41.2,"principal":"Transferências (União/Estado)","setor":{"dom":"Serviços","dom_pct":58.6,"pib":10037923000.0,"agro":0.3,"ind":26.2,"serv":58.6,"adm":14.9},"gasto":[{"nome":"Saúde","valor":414070702.22,"pct":28.3},{"nome":"Educação","valor":280005949.99,"pct":19.2},{"nome":"Previdência","valor":237948929.84,"pct":16.3},{"nome":"Administração","valor":130302947.35,"pct":8.9}]},"hooks":["<b>Terreno amigo:</b> Novo Hamburgo deu <b>68.5% ao Bolsonaro</b> em 2022 — cidade de família, trabalho e fé. Abrir reconhecendo o povo.","<b>O básico que passa por Brasília:</b> a prefeitura investe <b>28.3% em saúde</b> — e o recurso depende do federal liberar."]}},{"nome":"Rio Pardo","estudo":"<h2>ESTUDO DE CIDADE — RIO PARDO (RS)</h2><p>&gt; Rony (vereador de Erechim, pré-candidato a Dep. Federal) em visita <b>05/08/2026, à noite, para receber HOMENAGEM na Câmara de Vereadores</b>. É <b>visitante E homenageado</b> — o conteúdo tem que ser 90% respeito/história/pertencimento e cruzar com o DNA dele (bolso, agro, fé/família, patriotismo/tradição). <b>Crítica local pega muito mal aqui</b> — não queimar quem está homenageando.</p><h3>⚠️ CORREÇÕES DE PRECISÃO (não errar em vídeo)</h3><p>1. <b>NÃO presuma plateia anti-Lula.</b> Rio Pardo <b>votou em LULA no 2º turno de 2022</b> (58,24% / 12.819 votos × Bolsonaro 41,76% / 9.190). É uma das poucas cidades do Vale do Rio Pardo onde Lula ganhou (Lula venceu em 8, Bolsonaro em 15 da região). → O enquadramento <b>anti-Lula/PT funciona no plano FEDERAL/nacional (bolso, imposto, custo de vida)</b>, mas <b>não trate a cidade como reduto bolsonarista</b> — o tom seguro é economia/tradição/produtor, não &quot;guerra cultural&quot; contra o público local.</p><p>   - Fontes: <a href=\"https://www.portalarauto.com.br/Pages/216449/bolsonaro-vence-em-15-cidades-do-vale-do-rio-pardo-no-2o-turno-lula-leva-a-melhor-em-8\" target=\"_blank\" rel=\"noopener\">Portal Arauto – 2º turno Vale do Rio Pardo</a> · <a href=\"https://www.tre-rs.jus.br/eleicoes/resultados-das-eleicoes/2022/2o-turno\" target=\"_blank\" rel=\"noopener\">TRE-RS – 2º turno 2022</a></p><p>2. <b>Prefeito é MDB, não &quot;esquerda&quot;.</b> <b>Rogério Monteiro (MDB)</b>, eleito em 1º turno em 2024 (34,78%), mandato 2025-2028 (antecessor: Rafael Barros). MDB é centrão. → <b>Não chamar a gestão municipal de &quot;esquerda&quot;/&quot;petista&quot;</b>. Com a HOMENAGEM na Câmara, o mais seguro é <b>não criticar gestão local</b> de forma alguma; se inevitável, só como &quot;velha política/renovação&quot;, nunca partidarizado.</p><p>   - Fontes: <a href=\"https://www.cnnbrasil.com.br/eleicoes/rogerio-monteiro-e-eleito-prefeito-de-rio-pardo-rs/\" target=\"_blank\" rel=\"noopener\">CNN Brasil</a> · <a href=\"https://www.otempo.com.br/eleicoes/2024/prefeito/2024/10/9/rogerio-monteiro-do-mdb-e-eleito-prefeito-de-rio-pardo-rs-nas-el\" target=\"_blank\" rel=\"noopener\">O Tempo</a></p><p>3. <b>General Osório NÃO nasceu em Rio Pardo</b> (nasceu em Conceição do Arroio, atual município de Osório, 1808). Ele passou por Rio Pardo e ali conheceu a esposa — <b>é &quot;passagem&quot;, não &quot;terra natal&quot;</b>. Não afirmar que é rio-pardense.</p><p>   - Fonte: <a href=\"https://pt.wikipedia.org/wiki/Manuel_Lu%C3%ADs_Os%C3%B3rio\" target=\"_blank\" rel=\"noopener\">Wikipédia – Manuel Luís Osório</a></p><p>4. <b>Tombamentos: federal × estadual — não confundir.</b> A <b>Rua da Ladeira</b> (1ª rua calçada do RS, 1813) é <b>Patrimônio Histórico Nacional pelo IPHAN (16/03/1955)</b>. Já a <b>Antiga Escola Militar</b> (Centro Regional de Cultura) é tombamento <b>estadual, pelo IPHAE (1983)</b>. São instâncias diferentes.</p><p>   - Fontes: <a href=\"http://www.iphae.rs.gov.br/Main.php?do=BensTombadosDetalhesAc&amp;item=15629\" target=\"_blank\" rel=\"noopener\">IPHAE – Antiga Escola Militar</a> · <a href=\"https://www.ipatrimonio.org/rio-pardo-antiga-escola-militar/\" target=\"_blank\" rel=\"noopener\">ipatrimônio</a></p><p>5. <b>Getúlio Vargas estudou na Escola Militar de Rio Pardo</b> (fato real, junto com Dutra e Mascarenhas de Moraes). Cuidado: Getúlio é ícone do <b>trabalhismo/getulismo</b> (herança reivindicada pela esquerda). Use como <b>fato histórico/orgulho da cidade</b>, nunca como endosso político.</p><p>   - Fonte: <a href=\"https://www.ipatrimonio.org/rio-pardo-antiga-escola-militar/\" target=\"_blank\" rel=\"noopener\">ipatrimônio – Antiga Escola Militar</a></p><h3>🏆 GANCHOS FORTES (cruzados com o DNA do Rony)</h3><h4>A. História / patriotismo / tradição (CAMPEÃO — casa perfeitamente com a HOMENAGEM)</h4><ul><li><b>Uma das 4 cidades mais antigas do RS</b> (município desde 1809, junto com Porto Alegre, Rio Grande e Santo Antônio da Patrulha). Foi <b>um dos maiores centros militares, comerciais e culturais do sul do Brasil</b> no início do séc. XIX — porto no Jacuí abastecendo Missões, Pampa e Serra. &quot;Cidade Monumento&quot;.</li><li><b>Batalha do Rio Pardo / Barro Vermelho (30/04/1838)</b> — um dos combates mais sangrentos da <b>Revolução Farroupilha</b>, vitória farroupilha (Bento Gonçalves, Bento Manuel, Netto). Marcada pela Cruz do Barro Vermelho na Praça 30 de Abril. <b>Rio Pardo é também apontada como &quot;berço do Hino Rio-Grandense&quot;.</b></li><li>Ângulo p/ o Rony (patriotismo/tradição/valores do RS): honrar a cidade que forjou o Rio Grande — &quot;aqui se fez história, aqui se defendeu a terra&quot;. Munição nobre para o discurso de homenagem.</li></ul><p>  - Fontes: <a href=\"https://www.riopardo.rs.gov.br/portal/servicos/1005/historia-do-municipio/\" target=\"_blank\" rel=\"noopener\">Prefeitura – História do Município</a> · <a href=\"https://www.gaz.com.br/revolucao-farroupilha-em-acao-no-vale-do-rio-pardo/\" target=\"_blank\" rel=\"noopener\">Gaz – Farroupilha no Vale do Rio Pardo</a> · <a href=\"https://www.riopardo.rs.gov.br/portal/noticias/0/3/1208/rio-pardo-berco-do-hino-rio-grandense\" target=\"_blank\" rel=\"noopener\">Prefeitura – Rio Pardo berço do Hino Rio-Grandense</a></p><h4>B. Fumo / tabaco — bolso + agro + anti-carga tributária federal (o gancho econômico mais forte e local)</h4><ul><li>Rio Pardo está no <b>coração da fumicultura do Vale do Rio Pardo</b> — maior produção de fumo do país, base de <b>pequena propriedade familiar</b>. Em 22 municípios do Vale, o tabaco é em média <b>50,4% da produção primária</b>.</li><li><b>Crise 2025/26 (dor real &quot;no bolso&quot;):</b> preço despencou para <b>R$ 50–70/arroba</b>; em maio/2026 <b>menos de 50% da safra 24/25 comercializada</b>; produtores estimam <b>perdas de R$ 10 mil a R$ 20 mil por safra</b>; risco de <b>êxodo rural</b> e de queda na arrecadação municipal da região.</li><li><b>Munição anti-governo federal (sem atacar a plateia):</b> a <b>Lei Complementar 214/2025</b> (regulamentação da Reforma Tributária) enquadrou cigarro/fumo no <b>Imposto Seletivo (&quot;imposto do pecado&quot;)</b> — mais carga sobre um setor que sustenta o pequeno produtor gaúcho. Ângulo Rony: <b>trabalho e empreendedorismo do agricultor familiar × Estado que taxa e sufoca quem produz</b>.</li></ul><p>  - Fontes: <a href=\"https://www.jornaldocomercio.com/jornal-cidades/2026/05/1250256-queda-no-preco-do-tabaco-impacta-cidades-do-vale-do-rio-pardo.html\" target=\"_blank\" rel=\"noopener\">Jornal do Comércio – queda do tabaco no Vale</a> · <a href=\"https://www.camara.leg.br/noticias/693157-SETOR-DE-TABACO-REJEITA-INICIATIVAS-QUE-AUMENTEM-A-TRIBUTACAO-SOBRE-CIGARROS\" target=\"_blank\" rel=\"noopener\">Câmara dos Deputados – setor rejeita mais tributação</a> · <a href=\"https://atlassocioeconomico.rs.gov.br/fumo\" target=\"_blank\" rel=\"noopener\">Atlas Socioeconômico RS – Fumo</a></p><p>  - ⚠️ <b>Delicado:</b> debate tabaco × saúde é sensível. Foque no <b>produtor/emprego/renda e na carga tributária</b>, não em &quot;defender o cigarro&quot;. Não atacar o agricultor.</p><h4>C. Fé / família / religiosidade (casa com o DNA cristão)</h4><ul><li><b>Igreja Matriz Nossa Senhora do Rosário</b> — inaugurada em <b>1779</b> (nave principal concluída em 1801), monumento à fé dos colonizadores <b>luso-açorianos</b>, rica em altares e arte sacra. Cidade de forte religiosidade e tradição familiar.</li><li>Ângulo Rony (fé/família/valores): reverência à fé que fundou a cidade; respeito às raízes cristãs açorianas. Bom para chegada/abertura.</li></ul><p>  - Fonte: <a href=\"https://www.riopardo.rs.gov.br/portal/turismo/0/9/1301/igreja-matriz-nossa-senhora-do-rosario\" target=\"_blank\" rel=\"noopener\">Prefeitura – Igreja Matriz N.S. do Rosário</a></p><h4>D. Economia / êxodo / oportunidade (bolso + trabalho vs. assistencialismo)</h4><ul><li><b>População encolhendo:</b> 34.654 hab. (Censo 2022); queda de <b>11,1% em 5 anos</b> e <b>19,3% em 30 anos</b>. <b>PIB per capita R$ 36.013 (2023) — abaixo da média do RS (~R$ 50,7 mil)</b> e da média regional.</li><li>Ângulo Rony (sem apontar culpado local, com a homenagem): <b>jovem que precisa sair para trabalhar</b>; falta de oportunidade; defesa de quem empreende e produz × modelo que só distribui. Enquadrar como agenda de <b>desenvolvimento</b>, não como ataque à gestão.</li></ul><p>  - Fonte: <a href=\"https://cidades.ibge.gov.br/brasil/rs/rio-pardo/panorama\" target=\"_blank\" rel=\"noopener\">IBGE Cidades – Rio Pardo Panorama</a></p><h4>E. Agro / arroz / propriedade (agro tradicional do Vale/Jacuí)</h4><ul><li>Além do fumo, Rio Pardo é região de <b>arroz</b> (várzeas do Jacuí) e pecuária — identidade produtiva rural forte. Serve ao DNA de <b>agro/propriedade/trabalho no campo</b>.</li><li>⚠️ <b>Não achei invasão de terra / acampamento MST específico em Rio Pardo</b> (há pressão do MST no RS em outras cidades — Pedras Altas, Encruzilhada do Sul, Tupanciretã). <b>Não inventar invasão local</b> — se usar anti-MST, manter no plano estadual/federal.</li></ul><p>  - Fonte: <a href=\"https://www.agricultura.rs.gov.br/rio-pardo\" target=\"_blank\" rel=\"noopener\">Secretaria da Agricultura RS – Rio Pardo</a></p><h3>💛 ORGULHO / PERTENCIMENTO (gravar na chegada — aqui a cidade é ouro)</h3><ul><li><b>Rua da Ladeira</b>: 1ª rua calçada do RS (1813), casario colonial, <b>Patrimônio Histórico Nacional (IPHAN, 16/03/1955)</b> — comparada à Calle de los Suspiros de Colonia del Sacramento.</li><li><b>Antiga Escola Militar</b> (Centro Regional de Cultura, prédio neoclássico 1848–1882, tombado pelo IPHAE em 1983): ali estudaram <b>Getúlio Vargas, Eurico Gaspar Dutra e Mascarenhas de Moraes</b>.</li><li><b>Centro Histórico</b> vivo: Igreja Matriz N.S. do Rosário (1779), Sobrado dos Azulejos, <b>Museu Histórico Barão de Santo Ângelo</b> (acervo da Revolução Farroupilha, Sala Açoriana), Praça 30 de Abril / Cruz do Barro Vermelho.</li><li>Frase-guia: *&quot;Rio Pardo não é só uma das cidades mais antigas do RS — é onde o Rio Grande se fez.&quot;*</li></ul><p>  - Fontes: <a href=\"https://www.ipatrimonio.org/rio-pardo-antiga-escola-militar/\" target=\"_blank\" rel=\"noopener\">ipatrimônio – Antiga Escola Militar</a> · <a href=\"https://www.riopardo.rs.gov.br/portal/turismo/9\" target=\"_blank\" rel=\"noopener\">Prefeitura – Turismo</a> · <a href=\"https://www.riopardo.rs.gov.br/portal/servicos/1005/historia-do-municipio/\" target=\"_blank\" rel=\"noopener\">Prefeitura – História</a></p><h3>🤝 RELAÇÃO COM A CÂMARA (homenagem — ler antes de gravar)</h3><ul><li><b>Câmara 2025-2028 é majoritariamente direita/centro-direita</b> — 13 vereadores: <b>PL (3): Antônio Limberger, Gilberto Silva de Oliveira, Murilo Konzen</b> · PP: Thiago Corrêa Hertz · PSD: Artur Franco de Matos · PSDB: Diego Bitencourte · Republicanos: Iara Soares · Podemos (2): Marciele Rosa, Tenente Marcos Rogério · MDB (3): Fernando Blanco, Mário Cezar de Oliveira, Tiago Mello · PDT: Getúlio Silveira Jr.</li><li><b>Presidência:</b> Fernando Blanco (MDB) em 2025; <b>na data da visita (ago/2026) o presidente é Thiago Corrêa Hertz (PP)</b>, vice Murilo Konzen (PL).</li><li>Os <b>vereadores do PL/PP</b> são os aliados naturais e prováveis proponentes da homenagem. <b>Agradeça a Câmara como instituição e nominalmente quem propôs</b> (confirmar quem foi — ver Lacunas). <b>Não atacar nenhum vereador nem o prefeito (MDB)</b> — a foto do dia é de união, não de disputa.</li></ul><p>  - Fonte: <a href=\"https://portalarauto.com.br/24-12-2025/camara-de-rio-pardo-define-mesa-diretora-e-comissoes-para-2026-em-sessao-ordinaria/\" target=\"_blank\" rel=\"noopener\">Portal Arauto – Mesa Diretora 2026 e vereadores</a></p><h3>Lacunas (não achado — não inventar)</h3><ul><li><b>Quem propôs a homenagem ao Rony na Câmara</b> (autor do projeto/requerimento) — confirmar antes p/ agradecer nominalmente.</li><li><b>Dados de segurança específicos de Rio Pardo</b> (homicídios/furtos por SSP-RS): não checados no nível municipal — não afirmar que a cidade é violenta ou segura sem o número. (Contexto: RS teve forte queda de criminalidade em 2025.)</li><li><b>Vice-prefeito</b> (nome/partido) e composição do secretariado.</li><li><b>Taxa de desemprego / salário médio</b> local.</li><li><b>Invasão MST ou acampamento em Rio Pardo</b> (não encontrado — só pressão regional no RS).</li><li><b>Pauta/gestão municipal específica</b> (saúde, obras) — não aprofundado de propósito: com a homenagem, evitar munição de crítica local.</li></ul>","elec":{"municipio":"RIO PARDO","lula_pct":58.2,"bolso_pct":41.8,"lula_votos":12819,"bolso_votos":9190,"vencedor":"Lula","abst_pct":22.5,"branco_pct":1.9,"nulo_pct":2.7,"aptos":29799,"comparecimento":23089,"dep_fed":{"nome":"MARCELO MORAES","partido":"PL","votos":2985},"dep_est":{"nome":"EDIVILSON BRUM","partido":"MDB","votos":8622}},"dossie":{"e":{"ano":2024,"pop":34447,"orc":202902971.46,"prop":23427000.19,"fed":78422907.61,"est":52711343.94,"pp":11.5,"pf":38.7,"pe":26.0,"dep":64.7,"principal":"Transferências (União/Estado)","setor":{"dom":"Agropecuária","dom_pct":43.8,"pib":1390525000.0,"agro":43.8,"ind":8.2,"serv":31.0,"adm":17.0},"gasto":[{"nome":"Educação","valor":41347385.36,"pct":23.6},{"nome":"Saúde","valor":36580497.39,"pct":20.9},{"nome":"Urbanismo","valor":16725275.73,"pct":9.5},{"nome":"Administração","valor":14074788.81,"pct":8.0}]},"hooks":["<b>Dependência de Brasília:</b> <b>64.7%</b> do orçamento vem de repasses federais/estaduais. Gancho: “o futuro daqui se decide em Brasília — e é lá que eu quero brigar por vocês”.","<b>Defesa do produtor:</b> o agro é <b>43.8%</b> da economia. Gancho: “enquanto o Lula taxa quem produz, a gente precisa de quem defenda o produtor rural”.","<b>O básico que passa por Brasília:</b> a prefeitura investe <b>23.6% em educação</b> — e o recurso depende do federal liberar."]}},{"nome":"Sananduva","estudo":"<h2>ESTUDO DE CIDADE — SANANDUVA (RS)</h2><p>&gt; Rony (vereador de Erechim, pré-candidato a Dep. Federal) em visita — <b>almoço com apoiadores e lideranças locais em 04/08/2026</b> (contato: Mariano). É <b>visitante em terreno amigo</b>: cidade pequena (~16 mil), agro/agricultura familiar, colonização italiana católica, nordeste gaúcho conservador, prefeito do PL. Conteúdo precisa mostrar respeito/pertencimento + cruzar com o DNA dele (bolso, trabalho vs. assistencialismo, propriedade, fé/família, futuro do campo). <b>Aqui o inimigo é federal (Lula/PT/&quot;o sistema&quot;), NÃO a gestão local.</b></p><h3>⚠️ CORREÇÕES DE PRECISÃO (não errar em vídeo)</h3><p>1. <b>Sananduva NÃO é governada pela esquerda — é do PL.</b> Prefeito <b>Claiton de Aguiar (PL)</b>, eleito em 2024 com <b>45,41% (4.971 votos)</b>, vice <b>Tiago Tomielo</b>, mandato 2025–2028; derrotou Marcos Bala (32,87%). <b>PL = mesmo campo do Rony/Bolsonaro → ALIADO.</b> Não atacar a Prefeitura como &quot;esquerda&quot;; se houver crítica de gestão, é caso a caso e só se a liderança parceira for oposição — enquadrar como &quot;cobrança&quot;, nunca &quot;petismo&quot;. O alvo &quot;esquerda/Lula/PT&quot; vale no <b>federal</b>.</p><p>   - Fontes: <a href=\"https://www.cnnbrasil.com.br/eleicoes/claiton-de-aguiar-e-eleito-prefeito-de-sananduva-rs/\" target=\"_blank\" rel=\"noopener\">CNN Brasil</a> · <a href=\"https://www.otempo.com.br/eleicoes/2024/prefeito/2024/10/9/claiton-de-aguiar-do-pl-e-eleito-prefeito-de-sananduva-rs-nas-el\" target=\"_blank\" rel=\"noopener\">O Tempo</a> · <a href=\"https://www.folhadonordeste.com.br/site/noticias.php?id=14938\" target=\"_blank\" rel=\"noopener\">Posse — Folha do Nordeste</a></p><p>2. <b>Padroeiro é São João Batista</b> — a matriz é a <b>Igreja Matriz São João Batista</b>. Não chutar outro santo em vídeo de chegada (erro clássico que queima o &quot;respeito&quot;). Colonização <b>italiana católica</b>.</p><p>   - Fonte: <a href=\"https://camarasananduva.rs.gov.br/cidade\" target=\"_blank\" rel=\"noopener\">Câmara de Vereadores — A cidade</a></p><p>3. <b>Origem do município:</b> Sananduva foi elevada a município em <b>1954</b> (Lei estadual 2.521, de 15/12/1954), <b>desmembrada de Lagoa Vermelha</b>; instalação em 28/02/1955. Atenção: <b>Ibiaçá e São João da Urtiga se emanciparam DE Sananduva depois</b> — não inverter (não dizer que Sananduva saiu de Ibiaçá). O nome vem da <b>árvore corticeira-do-banhado</b> (flor vermelho-escarlate) da região.</p><p>   - Fontes: <a href=\"https://www.sananduva.rs.gov.br/pg.php?area=HISTORIA\" target=\"_blank\" rel=\"noopener\">Prefeitura — História</a> · <a href=\"https://pt.wikipedia.org/wiki/Hist%C3%B3ria_de_Sananduva\" target=\"_blank\" rel=\"noopener\">Wikipédia — História de Sananduva</a></p><p>4. <b>Não afirmar percentual de Bolsonaro/Lula 2022 em Sananduva sem o dado do TSE</b> (ver Lacunas). O que dá para afirmar com fonte é o <b>padrão regional</b>: o nordeste gaúcho de colonização italiana é o mais bolsonarista do RS. Falar do padrão, não de um número inventado.</p><p>   - Fonte: <a href=\"https://www.brasildefato.com.br/2022/11/01/no-nordeste-gaucho-o-campeao-de-votos-nao-e-lula-mas-bolsonaro/\" target=\"_blank\" rel=\"noopener\">Brasil de Fato — nordeste gaúcho, campeão é Bolsonaro</a></p><h3>🏆 GANCHOS FORTES (cruzados com o DNA do Rony)</h3><h4>A. Agricultura familiar = a cidade (CAMPEÃO — bolso + trabalho + propriedade)</h4><ul><li><b>1.338 estabelecimentos agropecuários</b>; a <b>agropecuária responde por ~29,1% do PIB</b> (serviços 43,5%, indústria 14,7%, administração pública 12,6%). Economia de ~R$ 843,8 mi; <b>PIB per capita 2023 ≈ R$ 53,5 mil</b> (acima da média do RS). Predomínio de <b>propriedade familiar</b>: grãos (soja, milho, trigo, feijão), <b>leite, suínos e aves</b>; ~30% da população vivia na zona rural (2010).</li></ul><p>  - Ângulo Rony: <b>quem sustenta Sananduva é o homem e a mulher do campo, não o assistencialismo.</b> Defender o produtor, a propriedade e o direito de trabalhar. Cruza direto com o DNA &quot;trabalho/empreendedorismo vs. bolsa&quot;.</p><p>  - Fontes: <a href=\"https://cidades.ibge.gov.br/brasil/rs/sananduva/panorama\" target=\"_blank\" rel=\"noopener\">IBGE Cidades — Panorama</a> · <a href=\"https://www.caravela.info/en/regional/sananduva---rs\" target=\"_blank\" rel=\"noopener\">Economia — Caravela</a> · <a href=\"https://www.agrolink.com.br/regional/rs/sananduva/\" target=\"_blank\" rel=\"noopener\">Agrolink — Sananduva</a> · <a href=\"https://www.researchgate.net/publication/404641621_A_MULTIFUNCIONALIDADE_DA_AGRICULTURA_EM_SANANDUVARS_CONTRIBUICOES_SOCIAIS_ECONOMICAS_E_AMBIENTAIS_PARA_O_DESENVOLVIMENTO_RURAL_LOCAL\" target=\"_blank\" rel=\"noopener\">Multifuncionalidade da agricultura em Sananduva (ResearchGate)</a></p><h4>B. Êxodo de jovens / sucessão no campo (dor real do interior — família + futuro)</h4><ul><li>Nas microrregiões rurais do RS (Fetraf-RS), a <b>população de 15–29 anos caiu pela metade</b> entre 1991 e 2010; para 71,2% dos entrevistados as maiores mudanças foram <b>êxodo rural, envelhecimento e falta de sucessão</b>. Causas apontadas: <b>renda</b> e <b>falta de perspectiva/incentivo</b> para o jovem ficar. Sananduva é caso estudado desse fenômeno.</li></ul><p>  - Ângulo Rony: <b>&quot;quem vai tocar a terra amanhã?&quot;</b> — o filho do agricultor está indo embora porque o Estado sufoca quem produz. Renda no campo, menos imposto, menos burocracia = jovem fica. Cruza com bolso + família + anti-sistema.</p><p>  - Fontes: <a href=\"https://ihu.unisinos.br/668788-populacao-jovem-caiu-pela-metade-na-maioria-das-regioes-rurais-do-rs-em-20-anos\" target=\"_blank\" rel=\"noopener\">IHU/Unisinos — população jovem caiu pela metade</a> · <a href=\"https://www.researchgate.net/publication/404641621_A_MULTIFUNCIONALIDADE_DA_AGRICULTURA_EM_SANANDUVARS_CONTRIBUICOES_SOCIAIS_ECONOMICAS_E_AMBIENTAIS_PARA_O_DESENVOLVIMENTO_RURAL_LOCAL\" target=\"_blank\" rel=\"noopener\">ResearchGate — multifuncionalidade em Sananduva</a></p><h4>C. Emprego / suinocultura: retomada do frigorífico Majestade (empreendedorismo + emprego)</h4><ul><li>A <b>Cooperativa Regional de Carnes e Derivados</b> (marca <b>Majestade</b>, fundada em 1966) é referência de emprego local; a unidade de abate de suínos ficou <b>parada desde março/2023</b>. Em <b>jan/2024 o Grupo Bugio adquiriu a planta</b> (capacidade ~1.200 suínos/dia) com promessa de <b>~350 empregos diretos + 150 indiretos</b>.</li></ul><p>  - Ângulo Rony: <b>cadeia produtiva que gera trabalho de verdade</b> — celebrar a retomada e cobrar que o poder público (federal) pare de atrapalhar quem produz e emprega. Positivo, mostra que ele entende a economia local. (Não prometer nada em nome da empresa.)</p><p>  - Fontes: <a href=\"https://ecofrigo.com.br/2024/01/18/grupo-bugio-adquire-unidade-de-abate-majestade-em-sananduva-rs/\" target=\"_blank\" rel=\"noopener\">Ecofrigo — Grupo Bugio adquire unidade Majestade</a> · <a href=\"https://www.econodata.com.br/consulta-empresa/95323275000172-COOP-REGIONAL-SANANDUVA-DE-CARNES-E-DERIVADOS-LTDA\" target=\"_blank\" rel=\"noopener\">Econodata — Coop. Regional Sananduva de Carnes</a></p><h4>D. Custo do produtor / carga tributária (bolso — enquadramento federal, terreno seguro)</h4><ul><li>PIB per capita alto no papel (~R$ 53,5 mil) <b>não chega no bolsão de quem planta</b>: o produtor paga caro em insumo, combustível, energia e imposto. Sananduva é 100% dependente do desempenho do agro — <b>toda alta de custo/tributo bate direto na cidade</b>.</li></ul><p>  - Ângulo Rony: transformar dado local em pauta nacional — <b>o Lula/o sistema encarece a v
