<script>
const CID=[{"nome":"Cachoeira do Sul","estudo":"<h2>ESTUDO DE CIDADE — CACHOEIRA DO SUL (RS)</h2><p>&gt; Rony (vereador de Erechim, pré-candidato a Dep. Federal) em visita. É <b>visitante</b> — conteúdo precisa mostrar respeito/pertencimento + cruzar com o DNA dele (bolso, trabalho vs. assistencialismo, fé/família, propriedade, anti-Lula/anti-sistema).</p><p>&gt; <b>DETALHE DE OURO:</b> a visita de <b>05/08</b> cai exatamente no <b>aniversário da cidade (emancipação em 05/08/1820 → 206 anos)</b>. Abrir cumprimentando o aniversário = pertencimento imediato. É a <b>Capital (Estadual) do Arroz</b> / <b>&quot;Princesa do Jacuí&quot;</b> — aqui a pauta é AGRO/ARROZ.</p><h3>⚠️ CORREÇÕES DE PRECISÃO (não errar em vídeo)</h3><p>1. <b>Cachoeira do Sul NÃO é &quot;Capital Nacional do Arroz&quot; por lei federal.</b> O título oficial é <b>&quot;Capital Estadual do Arroz&quot;</b> (lei estadual, 2019). O &quot;nacional&quot; é <b>autoproclamado / PL 4231/2024 (dep. Pompeo de Mattos) ainda em tramitação</b>. Pode dizer &quot;conhecida como Capital do Arroz&quot; e &quot;sede da Fenarroz&quot; — mas <b>não afirme que é título nacional oficial</b>, a checagem derruba.</p><p>   - Fontes: <a href=\"https://www.cachoeiradosul.rs.gov.br/portal/noticias/0/3/3723/cachoeira-agora-sera-capital-estadual-do-arroz\" target=\"_blank\" rel=\"noopener\">O Correio – Capital Estadual (2019)</a> · <a href=\"https://ocorreio.com.br/projeto-preve-titulo-capital-nacional-do-arroz-para-cachoeira-do-sul/\" target=\"_blank\" rel=\"noopener\">O Correio – PL Capital Nacional</a></p><p>2. <b>A crise do arroz (preço, importação, ICMS) é competência FEDERAL/ESTADUAL — NÃO do prefeito.</b> Preço baixo, leilão de importação e ICMS não se resolvem na Prefeitura. Culpar o prefeito local pela crise do arroz é cilada. O alvo correto é <b>Lula/governo federal</b> (importação, política agrícola) e o <b>estadual</b> (ICMS). No municipal, o enquadramento honesto é &quot;cobrar apoio ao produtor&quot;, não responsabilizar.</p><p>3. <b>Cachoeira do Sul NÃO está entre as cidades &quot;mais violentas&quot; nem no RS Seguro.</b> Não é um dos 23 municípios prioritários do programa RS Seguro; o RS teve <b>homicídios −27% em 2025</b> (549 vítimas vs. 750 em 2024). <b>Não afirmar que &quot;lidera violência&quot;</b> — não se sustenta.</p><p>   - Fontes: <a href=\"https://www.ssp.rs.gov.br/com-queda-nos-indices-de-mortes-violentas-primeiro-semestre-de-2025-aponta-para-um-ano-mais-seguro-que-2024\" target=\"_blank\" rel=\"noopener\">SSP/RS – queda de mortes 2025</a> · <a href=\"https://estado.rs.gov.br/rs-seguro-amplia-de-18-para-23-os-municipios-priorizados\" target=\"_blank\" rel=\"noopener\">Estado/RS – 23 municípios RS Seguro</a></p><p>4. <b>Não é governada pela esquerda.</b> Prefeito <b>Leandro Balardin (PSDB)</b>; 2º colocado em 2024 foi <b>Hilton de Franceschi (Republicanos)</b>. Palanque local é <b>todo de centro-direita</b> → &quot;esquerda&quot; só cola no <b>federal (Lula/PT)</b>. No municipal, crítica de gestão = &quot;velha política / renovação&quot;, nunca &quot;esquerdopata&quot;.</p><p>5. <b>Fundação/emancipação = 05/08/1820</b> (5º município do RS, então Província de São Pedro). &quot;Princesa do Jacuí&quot; é o apelido histórico. Não confundir com Cachoeira (BA) nem Cachoeirinha (RS).</p><h3>🏆 GANCHOS FORTES (cruzados com o DNA do Rony)</h3><h4>A. Leilão de importação de arroz do governo Lula (CAMPEÃO — anti-Lula + arroz + anti-sistema, na Capital do Arroz)</h4><ul><li>Após a enchente de 2024, o governo Lula anunciou compra de <b>até 1 milhão de toneladas de arroz importado (R$ 7 bi anunciados)</b>. O leilão de junho/2024 arrematou <b>263 mil toneladas</b> e foi <b>anulado após suspeitas de fraude</b>: entre as vencedoras, <b>mercearia, locadora de veículos e fábrica de sorvetes</b> — a &quot;Wisley A. de Souza&quot; (marca de queijo, capital social de só R$ 80 mil) levou <b>147 mil t por R$ 736 mi</b>. O secretário de Política Agrícola <b>Neri Geller caiu</b>. Ângulo: *na Capital do Arroz, o produtor quebrado assistiu o governo Lula tentar importar arroz — e ainda entregar para sorveteria e locadora. É o sistema contra quem produz.*</li></ul><p>  - Fontes: <a href=\"https://www.gazetadopovo.com.br/agronegocio/leilao-do-arroz-foi-fiasco-anunciado-governo-lula-ignorou-todos-os-alertas/\" target=\"_blank\" rel=\"noopener\">Gazeta do Povo – &quot;fiasco anunciado&quot;</a> · <a href=\"https://www.metropoles.com/brasil/governo-lula-anula-leilao-que-comprou-263-mil-toneladas-de-arroz\" target=\"_blank\" rel=\"noopener\">Metrópoles – anulação 263 mil t</a> · <a href=\"https://www.seudinheiro.com/2024/economia/o-que-levou-o-governo-lula-a-cancelar-o-leilao-para-compra-de-arroz-importado-rocc/\" target=\"_blank\" rel=\"noopener\">Seu Dinheiro – por que cancelou</a></p><h4>B. Preço do arroz no chão / produtor no vermelho (bolso + trabalho vs. governo)</h4><ul><li>Em 2025/26 a saca de 50 kg chegou a ~<b>R$ 40</b>, com <b>custo de produção de R$ 90–100/saca</b> — prejuízo de <b>R$ 20–30 por saca</b> (Federarroz); <b>menor preço em ~14 anos</b>. Causas: supersafra no Mercosul, volta da Índia ao mercado e <b>importação</b>. Federarroz/Farsul pedem redução de ICMS, alongamento de custeio, estímulo à exportação e <b>combate à importação</b>. Ângulo: *quem trabalha e produz está pagando para plantar; enquanto isso o governo importa. Renda no bolso do produtor, não política que quebra o campo.*</li></ul><p>  - Fontes: <a href=\"https://www.cnnbrasil.com.br/agro/produtores-de-arroz-do-rs-pedem-medidas-para-evitar-crise/\" target=\"_blank\" rel=\"noopener\">CNN Brasil – produtores pedem medidas</a> · <a href=\"https://www.canalrural.com.br/agricultura/arroz/preco-do-arroz-atinge-menor-nivel-em-14-anos-e-preocupa-produtores/\" target=\"_blank\" rel=\"noopener\">Canal Rural – menor preço em 14 anos</a> · <a href=\"https://planetaarroz.com.br/custo-alto-e-oferta-contida-sustentam-precos-no-rs-margens-do-arroz-seguem-no-vermelho/\" target=\"_blank\" rel=\"noopener\">Planeta Arroz – margens no vermelho</a> · <a href=\"https://minutomt.com.br/agro/federarroz-e-farsul-debatem-desafios-e-perspectivas-da-safra-de-arroz-2025-2026/\" target=\"_blank\" rel=\"noopener\">Federarroz/Farsul – safra 2025/26</a></p><h4>C. Enchentes de 2024 na várzea do arroz (dor local + resposta federal falha → liga ao Lula)</h4><ul><li>A enchente histórica de 2024 castigou as várzeas do <b>Jacuí, Soturno, Jaguari e Toropi</b> (mudança de leito, areia/pedra, lixiviação de nutrientes). A safra 2023/24 de Cachoeira caiu para <b>~148 mil t</b> com produtividade de <b>7.444 kg/ha</b> — uma das menores da série recente. Setor arrozeiro (UCR local, Carlos Wachholz) pediu ampliação de prazo de zoneamento. Ângulo: *o produtor levantou de novo com o próprio suor; a resposta federal foi importar arroz e prometer o que não entregou* (liga à pauta `ATAQUE/rio_grande_do_sul.md`).</li></ul><p>  - Fontes: <a href=\"https://ocorreio.com.br/enchentes-setor-arrozeiro-quer-estender-zoneamento/\" target=\"_blank\" rel=\"noopener\">O Correio – zoneamento pós-enchente</a> · <a href=\"https://planetaarroz.com.br/arroz-fecha-com-safra-cheia/\" target=\"_blank\" rel=\"noopener\">Planeta Arroz – safra de Cachoeira</a></p><h4>D. Fenarroz — a vitrine do trabalho e do agro (pertencimento + valorizar quem produz)</h4><ul><li>Cachoeira do Sul é <b>sede da Fenarroz (Feira Nacional do Arroz)</b>, organizada pelo <b>IRGA</b>, tida como a maior feira orizícola das Américas *(claim da cidade/imprensa — apresentar como &quot;reconhecida como&quot;, não como dado oficial)*. É o símbolo de uma cidade que se orgulha de <b>produzir, trabalhar e alimentar o Brasil</b>. Ângulo: exaltar o produtor e o agro como motor — casa com &quot;trabalho/empreendedorismo vs. assistencialismo&quot;.</li></ul><p>  - Fontes: <a href=\"https://irga.rs.gov.br/20-feira-nacional-do-arroz-fenarroz-cachoeira-do-sul\" target=\"_blank\" rel=\"noopener\">IRGA – Fenarroz Cachoeira do Sul</a> · <a href=\"https://planetaarroz.com.br/cachoeira-capital-do-arroz-no-rs/\" target=\"_blank\" rel=\"noopener\">Planeta Arroz – Cachoeira, capital do arroz</a></p><h4>E. Economia / bolso (retomada é a prioridade da própria cidade)</h4><ul><li><b>PIB per capita R$ 42.103 (2023) — 310º de 497 no RS</b>; população ~<b>80 mil</b> (Censo 2022; est. 82 mil em 2025); economia muito dependente do arroz/agro. O próprio prefeito coloca <b>reestruturação econômica</b> como prioridade. Ângulo: cidade que quer crescer precisa de <b>carga tributária menor, crédito ao produtor e menos Brasília no caminho</b> — bolso e trabalho.</li></ul><p>  - Fontes: <a href=\"https://cidades.ibge.gov.br/brasil/rs/cachoeira-do-sul/panorama\" target=\"_blank\" rel=\"noopener\">IBGE Cidades – panorama</a> · <a href=\"https://www.jornaldocomercio.com/mapa-economico/regiao-centro/2026/05/1246188-cachoeira-do-sul-busca-reestruturacao-economica-afirma-prefeito.html\" target=\"_blank\" rel=\"noopener\">Jornal do Comércio – reestruturação econômica</a></p><h4>F. Prefeito e palanque local (ALIADO potencial — tratar com cuidado, ver nota)</h4><ul><li><b>Leandro Balardin (PSDB)</b>, eleito 2024 com <b>40,22% (17.088 votos)</b>; vice <b>Dulce Lopes</b>. 2º colocado: <b>Hilton de Franceschi (Republicanos), 32,35%</b>. Balardin é <b>vice-presidente da FAMURS (2026/27)</b> e prioriza retomada econômica (obra da ponte).</li></ul><p>  - ⚠️ <b>Delicado:</b> todo o palanque local é <b>centro-direita</b> (PSDB e Republicanos). <b>Não atacar o prefeito nem tratar ninguém local como &quot;esquerda&quot;.</b> Cachoeira tende a ser terreno de aliança, não de confronto. Se houver crítica, que seja a Brasília/Lula, não à Prefeitura. Confirmar com a liderança &quot;Gil&quot; (retorno 12/09) quem é aliado e quem é oposição antes de nominar alguém.</p><p>  - Fontes: <a href=\"https://www.otempo.com.br/eleicoes/2024/prefeito/2024/10/9/balardin-do-psdb-e-eleito-prefeito-de-cachoeira-do-sul-rs-nas-el\" target=\"_blank\" rel=\"noopener\">O Tempo – Balardin eleito</a> · <a href=\"https://www.cachoeiradosul.rs.gov.br/portal/noticias/0/3/11160/prefeito-vice-e-secretarios-iniciam-a-gestao-2025--2028\" target=\"_blank\" rel=\"noopener\">Prefeitura – gestão 2025-2028</a> · <a href=\"https://www.cachoeiradosul.rs.gov.br/portal/noticias/0/3/13428/prefeito-balardin-e-eleito-vice-presidente-da-famurs\" target=\"_blank\" rel=\"noopener\">Prefeitura – Balardin vice na FAMURS</a></p><h3>💛 ORGULHO / PERTENCIMENTO (gravar na chegada, mostra respeito)</h3><ul><li><b>206 anos em 05/08/2026</b> (emancipada de Rio Pardo em 05/08/1820, 5º município do RS) — a visita cai no aniversário da cidade, cumprimentar de cara. <b>&quot;Princesa do Jacuí&quot;</b>, à margem esquerda do rio Jacuí, no coração do RS. Cartão-postal: <b>Ponte do Fandango</b> (1961), 1ª ponte-barragem do Brasil; <b>Catedral N. Sra. da Conceição</b>, <b>Casa de Cultura</b>, <b>Château d&#x27;Eau</b>, <b>Museu Municipal</b>. Terra do arroz e da Fenarroz.</li></ul><p>  - Fontes: <a href=\"https://www.cachoeiradosul.rs.gov.br/portal/noticias/0/3/13925/cachoeira-do-sul-celebra-206-anos-de-emancipacao-com-programacao-especial-no-dia-5-de-agosto\" target=\"_blank\" rel=\"noopener\">Prefeitura – 206 anos / programação 05/08</a> · <a href=\"https://www.cachoeiradosul.rs.gov.br/portal/servicos/1003/a-cidade/\" target=\"_blank\" rel=\"noopener\">Prefeitura – A Cidade</a> · <a href=\"https://www.creditoreal.com.br/blog/cachoeira-do-sul\" target=\"_blank\" rel=\"noopener\">Crédito Real – &quot;Princesa do Jacuí&quot;</a></p><h3>Lacunas (não achado — não inventar)</h3><ul><li><b>MST/invasão em Cachoeira do Sul:</b> não localizada ocupação do MST no município (buscas retornaram Cachoeiro de Itapemirim-ES e outras regiões). Manter a pauta anti-MST/propriedade no <b>plano estadual/federal</b>, não afirmar invasão local. Confirmar com &quot;Gil&quot;.</li><li>Homicídios/estatística criminal isolada de Cachoeira do Sul (2024/2025); taxa de desemprego e salário médio locais.</li><li>Número exato de hectares de arroz do município e ranking nacional de produção atualizado (IRGA por município).</li><li>Relatório oficial de perdas das enchentes 2024 com valores (fonte local retornou 403 — buscar via IRGA/Defesa Civil/Prefeitura).</li><li>Bandeiras de fé/família com gancho local específico (paróquia, evento religioso, pauta de costumes na Câmara) — checar antes de usar.</li></ul>","elec":{"municipio":"CACHOEIRA DO SUL","lula_pct":39.9,"bolso_pct":60.1,"lula_votos":18957,"bolso_votos":28555,"vencedor":"Bolsonaro","abst_pct":25.3,"branco_pct":2.2,"nulo_pct":2.4,"aptos":66730,"comparecimento":49825,"dep_fed":{"nome":"MARLON SANTOS","partido":"PL","votos":24086},"dep_est":{"nome":"CLAUDIO TATSCH","partido":"PL","votos":9266}},"dossie":{"e":{"ano":2024,"pop":79778,"orc":479500495.45,"prop":70461640.65,"fed":165926684.38,"est":122741150.23,"pp":14.7,"pf":34.6,"pe":25.6,"dep":60.2,"principal":"Transferências (União/Estado)","setor":{"dom":"Serviços","dom_pct":41.2,"pib":3542706000.0,"agro":30.2,"ind":14.8,"serv":41.2,"adm":13.8},"gasto":[{"nome":"Saúde","valor":115178811.85,"pct":30.6},{"nome":"Previdência","valor":82970263.27,"pct":22.1},{"nome":"Educação","valor":75977732.03,"pct":20.2},{"nome":"Administração","valor":32982222.61,"pct":8.8}]},"hooks":["<b>Terreno amigo:</b> Cachoeira do Sul deu <b>60.1% ao Bolsonaro</b> em 2022 — cidade de família, trabalho e fé. Abrir reconhecendo o povo.","<b>Dependência de Brasília:</b> <b>60.2%</b> do orçamento vem de repasses federais/estaduais. Gancho: “o futuro daqui se decide em Brasília — e é lá que eu quero brigar por vocês”.","<b>Defesa do produtor:</b> o agro é <b>30.2%</b> da economia. Gancho: “enquanto o Lula taxa quem produz, a gente precisa de quem defenda o produtor rural”.","<b>O básico que passa por Brasília:</b> a prefeitura investe <b>30.6% em saúde</b> — e o recurso depende do federal liberar."]}},{"nome":"Candelária","estudo":"<h2>ESTUDO DE CIDADE — CANDELÁRIA (RS)</h2><p>&gt; Rony (vereador de Erechim, pré-candidato a Dep. Federal) em visita. É <b>visitante</b> — conteúdo precisa mostrar respeito/pertencimento + cruzar com o DNA dele (anti-Lula/PT, bolso, trabalho x assistencialismo, fé/família, propriedade, anti-intervenção/globalismo).</p><p>&gt; <b>Terra do fumo, colônia alemã, agricultura familiar.</b> O tema-mãe aqui é a <b>cadeia do tabaco</b> — bolso puro e anti-intervenção. Cidade de <b>maioria de direita</b> (prefeito PP; berço do senador Heinze). Alvo é o federal (Lula/PT) e a agenda antitabagismo da OMS, NUNCA a gestão local aliada.</p><h3>⚠️ CORREÇÕES DE PRECISÃO (não errar em vídeo)</h3><p>1. <b>Candelária NÃO é a &quot;Capital Nacional do Tabaco&quot;.</b> Esse título é de <b>Santa Cruz do Sul</b>; o maior produtor do país é <b>Canguçu</b>. Candelária é <b>um dos maiores produtores do Brasil</b> (top 15; ~9º do Sul em safras recentes), mas chamá-la de &quot;capital do fumo&quot; a checagem derruba. Dizer <b>&quot;um dos maiores produtores de tabaco do país / do Vale do Rio Pardo&quot;</b>.</p><p>2. <b>Convenção-Quadro / COP11 é FEDERAL e INTERNACIONAL, não municipal.</b> É tratado da OMS, conduzido por Itamaraty + Ministério da Saúde (Comissão Nacional de Implementação). O tratado <b>NÃO proíbe plantar fumo</b> — o Brasil fez declaração interpretativa (2005) garantindo produção e apoio ao produtor. <b>Não afirmar &quot;querem proibir o fumo&quot; como fato consumado</b> — enquadrar como <b>pressão/ameaça regulatória e antitabagismo que sufoca o pequeno produtor</b>. É verdade que na COP11 (Genebra, nov/2025) a delegação e a Afubra tiveram <b>credenciamento negado</b> para as sessões — esse é o ângulo forte e checável.</p><p>3. <b>Prefeito Nestor &quot;Rim&quot; Ellwanger é do PP (direita/aliado), NÃO esquerda.</b> Eleito 2024 com 73,15%. Vice Cristiano Becker. Crítica de gestão (se houver) = <b>&quot;velha política&quot;</b>, jamais &quot;esquerdopata&quot;. No municipal o adversário histórico não é a esquerda.</p><p>4. <b>Heinze nasceu em Candelária (1950), mas foi PREFEITO DE SÃO BORJA — não de Candelária.</b> Ele é <b>filho ilustre</b> da cidade (usar como pertencimento/aliança), mas <b>não dizer &quot;ex-prefeito de Candelária&quot;</b> — a checagem pega.</p><p>5. <b>Cilada do sobrenome Ellwanger.</b> <b>Siegfried Ellwanger Castan</b> — editor negacionista do Holocausto, réu do famoso &quot;Caso Ellwanger&quot; (STF, 2003) — era de Candelária. O prefeito <b>Nestor Ellwanger é outra pessoa/outra família</b> (sobrenome comuníssimo na colônia alemã). <b>NÃO exaltar &quot;o sobrenome Ellwanger&quot;, NÃO associar</b> — tema tóxico, risco de recorte fora de contexto. Elogiar a herança alemã pela cultura/trabalho, sem cair nesse nome.</p><p>6. <b>RS não é violento — o oposto.</b> SSP/RS: <b>2025 é o ano mais seguro da história</b> (homicídios −44% de 2019 a 2025; −27% no 1º semestre). <b>Não usar a região como exemplo de &quot;caos na segurança&quot;</b> — a checagem derruba.</p><h3>🏆 GANCHOS FORTES (cruzados com o DNA do Rony)</h3><h4>A. Cadeia do TABACO — a ameaça da OMS ao bolso do colono (CAMPEÃO — bolso + anti-intervenção + soberania)</h4><ul><li><b>COP11 da Convenção-Quadro (Genebra, 17–22/nov/2025):</b> o Brasil é o maior exportador mundial de tabaco, mas a <b>Afubra e a comitiva gaúcha tiveram o credenciamento NEGADO</b> para as sessões onde se decide o futuro da cadeia — decidem sobre o produtor <b>sem o produtor na sala</b>. Ângulo Rony: *burocracia globalista/OMS legislando sobre a vida do colono gaúcho; soberania produtiva; quem defende a família do fumicultor?*</li></ul><p>  - Fontes: <a href=\"https://afubra.com.br/apos-cop-11-afubra-defende-uniao-para-garantir-renda-e-diversificacao-ao-produtor-de-tabaco/\" target=\"_blank\" rel=\"noopener\">Afubra – após COP11</a> · <a href=\"https://www.sdr.rs.gov.br/comitiva-gaucha-em-defesa-dos-produtores-de-tabaco-tem-reuniao-com-representantes-do-brasil-que-participam-da-cop11-em-genebra\" target=\"_blank\" rel=\"noopener\">SDR/RS – comitiva em Genebra</a></p><ul><li><b>Carga tributária esmaga o setor:</b> imposto sobre o cigarro chega a <b>~79% (varia de 69% a 83%)</b>; em <b>2026 o IPI subiu de 40% para 60%</b> e o <b>preço mínimo do maço foi de R$ 6,50 para R$ 7,50</b>. Do total arrecadado, o <b>fumicultor fica com ~3%</b> — o resto é imposto e indústria. Ângulo: *o governo Lula tira do bolso de quem planta e de quem consome, e ainda empurra o mercado pro contrabando.*</li></ul><p>  - Fontes: <a href=\"https://www.inca.gov.br/observatorio-da-politica-nacional-de-controle-do-tabaco/precos-e-impostos\" target=\"_blank\" rel=\"noopener\">INCA – Preços e Impostos</a> · <a href=\"https://www.camara.leg.br/noticias/693001-arrecadacao-com-cigarros-somou-quase-r-15-bilhoes-em-2019-diz-entidade/\" target=\"_blank\" rel=\"noopener\">Câmara dos Deputados – arrecadação/repartição</a></p><ul><li><b>Peso econômico real (para dimensionar o que está em jogo):</b> o tabaco foi o <b>2º produto mais exportado do RS em 2024 (12,55% das exportações)</b>, gerando <b>R$ 11,8 bi</b> de renda aos produtores; a <b>Fetag/RS estima ~70 mil famílias</b> vivendo do fumo no estado. É <b>agricultura familiar de verdade</b> — pequena propriedade, mão de obra da família.</li></ul><p>  - Fonte: <a href=\"https://folhadomate.com/livre/projeto-de-lei-declara-fumicultura-como-atividade-de-interesse-economico-social-e-cultural-do-rs/\" target=\"_blank\" rel=\"noopener\">Folha do Mate – peso da fumicultura no RS</a></p><ul><li><b>Reação legislativa (bandeira pronta p/ abraçar):</b> a ALRS analisa o <b>PL 177/2025 (&quot;Lei Harry Antonio Werner&quot;), do dep. Marcus Vinícius (PP)</b>, que reconhece a fumicultura como <b>atividade de relevante interesse econômico, social e cultural do RS</b>; dezenas de câmaras municipais aprovaram versões próprias (22 dos 25 maiores produtores até out/2025). Ângulo Rony: *defender por lei quem sustenta o interior contra a canetada de fora.*</li></ul><p>  - Fonte: <a href=\"https://expansao.co/projeto-de-lei-reconhece-fumicultura-como-atividade-de-interesse-economico-no-rs/\" target=\"_blank\" rel=\"noopener\">Expansão – PL da fumicultura no RS</a></p><h4>B. Agricultura familiar e êxodo rural (trabalho x assistencialismo)</h4><ul><li><b>Candelária produziu ~12.550 t de tabaco na safra 2024/25, com ~2.763 famílias</b> — mas o setor <b>encolhe</b>: eram +3.600 famílias em 2020. Causas: <b>êxodo rural</b> (jovens saindo do campo pra fábrica/cidade), alta de custos e insumos, aposentadoria dos mais velhos. Ângulo: *como manter o jovem no interior com renda digna e sem depender de bolsa — trabalho, não assistencialismo.*</li></ul><p>  - Fontes: <a href=\"https://portalarauto.com.br/22-08-2025/veja-quais-sao-os-oito-municipios-da-regiao-que-figuram-entre-os-maiores-produtores-de-tabaco/\" target=\"_blank\" rel=\"noopener\">Portal Arauto – maiores produtores da região (safra 24/25)</a> · <a href=\"https://jornaldecandelaria.com.br/rural/candelaria-cai-cinco-posicoes-entre-os-maiores-produtores-de-tabaco-sul-brasileiros/\" target=\"_blank\" rel=\"noopener\">Jornal de Candelária – queda no ranking / êxodo</a></p><ul><li><b>Diversificação é o contra-argumento honesto:</b> o próprio setor (Afubra) admite migração para soja/milho e pede programas de diversificação de renda — o produtor não é &quot;viciado no fumo&quot;, é sufocado por imposto e insegurança regulatória. Bom para não parecer defesa do cigarro, e sim <b>defesa do homem do campo e da liberdade de produzir</b>.</li></ul><p>  - Fonte: <a href=\"https://afubra.com.br/apos-cop-11-afubra-defende-uniao-para-garantir-renda-e-diversificacao-ao-produtor-de-tabaco/\" target=\"_blank\" rel=\"noopener\">Afubra – diversificação e renda pós-COP11</a></p><h4>C. Fé, família e tradição da colônia alemã (valores — combustível de pertencimento)</h4><ul><li>Candelária é <b>colônia alemã</b> (imigrantes desde 1862), com <b>forte herança germânica</b>: costumes, arquitetura, o dialeto <b>Hunsrückisch</b> ainda falado, e festas como a <b>Festa da Colônia (Koloniefest)</b>, a <b>Chocande</b> (Páscoa) e o <b>Natal das Candeias</b>. Trabalho, fé e família são a espinha dorsal cultural. Ângulo Rony: *os valores que construíram o RS — família, fé cristã, trabalho duro, propriedade — são os mesmos que ele defende em Brasília.*</li></ul><p>  - Fontes: <a href=\"https://www.candelaria.rs.gov.br/conteudos/8\" target=\"_blank\" rel=\"noopener\">Prefeitura de Candelária – História</a> · <a href=\"https://www.turismo.rs.gov.br/turismo/municipio/visualizar/60\" target=\"_blank\" rel=\"noopener\">Turismo RS – Candelária</a></p><h4>D. Economia e emprego além do fumo (bolso)</h4><ul><li><b>PIB per capita R$ 42.713 (2023)</b> — acima da média de muitos vizinhos, puxado pelo agro + <b>industrialização calçadista</b> crescente. É a alternativa de emprego que segura o jovem que sai da lavoura. Ângulo: *gerar emprego e renda no interior é o caminho; o freio é carga tributária e burocracia federal.*</li></ul><p>  - Fonte: <a href=\"https://cidades.ibge.gov.br/brasil/rs/candelaria/panorama\" target=\"_blank\" rel=\"noopener\">IBGE Cidades – Candelária panorama</a></p><h4>E. Aliança/pertencimento local — a direita já é casa aqui (usar para somar, não para atacar)</h4><ul><li><b>Prefeito Nestor &quot;Rim&quot; Ellwanger (PP)</b> eleito com <b>73,15%</b> — cidade de maioria clara de direita. <b>Berço do senador Luis Carlos Heinze (PP)</b>, que <b>nasceu em Candelária (1950)</b>, é agrônomo e uma das vozes históricas do agro/ruralismo no Congresso. Ângulo: *chegar somando à direita local e ao agro, reforçando que Candelária &quot;exporta&quot; liderança conservadora pro Brasil.* Cruza direto com anti-Lula/PT e pauta do campo.</li></ul><p>  - Fontes: <a href=\"https://www.cnnbrasil.com.br/eleicoes/nestor-r-ellwanger-rim-e-eleito-prefeito-de-candelaria-rs/\" target=\"_blank\" rel=\"noopener\">CNN Brasil – Rim eleito prefeito</a> · <a href=\"https://www.matinaljornalismo.com.br/matinal/reportagem-matinal/luis-carlos-heinze-perfil/\" target=\"_blank\" rel=\"noopener\">Matinal – perfil de Heinze (nascido em Candelária)</a></p><h3>💛 ORGULHO / PERTENCIMENTO (gravar na chegada, mostra respeito)</h3><ul><li><b>Emancipada em 07/07/1925</b> (raiz na redução jesuítica Jesus Maria, 1633; colônia alemã desde 1862). <b>&quot;Terra dos Dinossauros&quot;</b> — fósseis de ~230 milhões de anos, incluindo o *Guaibasaurus candelariensis*. Cartões-postais: <b>Aqueduto de Candelária (1862)</b>, <b>Cerro do Botucaraí</b>, <b>Ponte do Império</b>, e as festas da colônia. Cidade trabalhadora, do campo e da fé.</li></ul><p>  - Fontes: <a href=\"https://www.candelaria.rs.gov.br/conteudos/8\" target=\"_blank\" rel=\"noopener\">Prefeitura – História</a> · <a href=\"https://www.turismo.rs.gov.br/turismo/municipio/visualizar/60\" target=\"_blank\" rel=\"noopener\">Turismo RS – Candelária</a></p><h3>Lacunas (não achado — não inventar)</h3><ul><li>Indicadores criminais <b>de Candelária isolados</b> (SSP/RS publica por município em dados.rs.gov.br, mas não foram coletados aqui) — usar só a tendência estadual de queda.</li><li>Taxa de desemprego / salário médio local; nº de empregos do setor calçadista.</li><li>Confirmação de que <b>a Câmara de Candelária</b> especificamente aprovou a lei da fumicultura (aprovada em dezenas de municípios; falta confirmar Candelária).</li><li>Posição exata de Candelária no ranking da safra <b>2024/25</b> (últimos números firmes: ~12.550 t / ~2.763 famílias — checar antes de citar como &quot;9º lugar&quot;, dado que é de 2020/21).</li><li>Pautas locais de saúde/educação/fila de creche; nome do vereador parceiro na visita (definir enquadramento se houver crítica à gestão).</li></ul>","elec":{"municipio":"CANDELÁRIA","lula_pct":41.3,"bolso_pct":58.7,"lula_votos":7249,"bolso_votos":10324,"vencedor":"Bolsonaro","abst_pct":17.2,"branco_pct":2.4,"nulo_pct":2.8,"aptos":22402,"comparecimento":18538,"dep_fed":{"nome":"MARCELO MORAES","partido":"PL","votos":3480},"dep_est":{"nome":"KELLY MORAES","partido":"PL","votos":3330}},"dossie":{"e":{"ano":2024,"pop":28249,"orc":196565266.21,"prop":15848510.39,"fed":73614437.22,"est":48330670.27,"pp":8.1,"pf":37.5,"pe":24.6,"dep":62.1,"principal":"Transferências (União/Estado)","setor":{"dom":"Serviços","dom_pct":34.1,"pib":1078191000.0,"agro":29.7,"ind":18.2,"serv":34.1,"adm":18.0},"gasto":[{"nome":"Saúde","valor":41434440.89,"pct":25.2},{"nome":"Educação","valor":31347372.36,"pct":19.0},{"nome":"Previdência","valor":18108495.98,"pct":11.0},{"nome":"Transporte","valor":17439034.61,"pct":10.6}]},"hooks":["<b>Dependência de Brasília:</b> <b>62.1%</b> do orçamento vem de repasses federais/estaduais. Gancho: “o futuro daqui se decide em Brasília — e é lá que eu quero brigar por vocês”.","<b>Defesa do produtor:</b> o agro é <b>29.7%</b> da economia. Gancho: “enquanto o Lula taxa quem produz, a gente precisa de quem defenda o produtor rural”.","<b>O básico que passa por Brasília:</b> a prefeitura investe <b>25.2% em saúde</b> — e o recurso depende do federal liberar."]}},{"nome":"Canoas","estudo":"<h2>ESTUDO DE CIDADE — CANOAS (RS)</h2><p>&gt; Rony (vereador de Erechim, pré-candidato a Dep. Federal) em visita. É <b>visitante</b> — conteúdo precisa mostrar respeito/pertencimento + cruzar com o DNA dele (anti-Lula/PT, bolso, trabalho, fé/família, anti-sistema).</p><p>&gt; <b>ATENÇÃO POLÍTICA:</b> Canoas é <b>campo aliado</b>. Prefeito é do <b>PL</b> (Airton Souza) e a anfitriã é a vereadora <b>Larissa Rodrigues (PL, cristã, conservadora, bolsonarista)</b>. Aqui o jogo é <b>elogiar/somar com o aliado local</b> e mirar o alvo certo: <b>Lula/PT no federal</b> e a <b>velha política (gestão anterior)</b> no municipal. Errar o alvo aqui é fogo amigo.</p><h3>⚠️ CORREÇÕES DE PRECISÃO (não errar em vídeo)</h3><p>1. <b>Canoas NÃO é &quot;governada pela esquerda&quot;.</b> O prefeito (2025–2028) é <b>Airton Souza (PL)</b>, eleito no 2º turno de 2024 com <b>52,32%</b>, derrotando <b>Jairo Jorge (PSD</b>, em coligação com <b>PT, PDT, PCdoB, PSB, Cidadania</b> e outros). → O alvo &quot;esquerda&quot; vale no <b>federal (Lula/PT)</b> e na <b>gestão ANTERIOR (Jairo Jorge)</b>. <b>NÃO atacar a Prefeitura atual</b> — é aliada do Rony e da Larissa. <a href=\"https://www.gazetadopovo.com.br/eleicoes/2024/resultado-eleicoes-canoas-2-turno-airton-souza-eleito/\" target=\"_blank\" rel=\"noopener\">Gazeta do Povo</a> · <a href=\"https://sul21.com.br/noticias/politica/eleicoes-2024/2024/10/airton-souza-pl-e-jairo-jorge-psd-disputam-o-segundo-turno-em-canoas/\" target=\"_blank\" rel=\"noopener\">Sul21</a></p><p>2. <b>Canoas NÃO é &quot;das mais violentas&quot; — está no MELHOR momento da série histórica.</b> Em 2025 os homicídios <b>despencaram</b> (28 casos de jan–out, <b>−47% vs 2024</b> e <b>−62% vs 2023</b>; melhor patamar desde 2010; taxa ~8,05/100 mil). <b>Isso é vitória do aliado (PL) na segurança</b> → o enquadramento honesto é <b>ELOGIAR o resultado</b>, nunca chamar a cidade de violenta. A checagem derruba e ainda ofende o anfitrião. <a href=\"https://www.canoas.rs.gov.br/noticias/canoas-e-destaque-de-boas-praticas-de-seguranca-no-estado-apos-reducao-historica-de-homicidios/\" target=\"_blank\" rel=\"noopener\">Prefeitura de Canoas</a></p><p>3. <b>Canoas NÃO é cidade pobre / dormitório.</b> É a <b>3ª maior economia do RS</b>, com <b>PIB per capita R$ 83.895 (2023)</b>, sede da <b>REFAP (Petrobras)</b>, parque industrial forte e <b>2º maior polo universitário do estado</b> (ULBRA, La Salle, UniRitter, IFRS). O ângulo &quot;bolso&quot; aqui é <b>carga tributária / custo de vida / emprego na indústria</b>, NÃO miséria. <a href=\"https://www.correiobraziliense.com.br/cbradar/a-terra-do-aviao-supera-quase-todo-o-estado-em-riqueza-e-se-consolida-como-o-segundo-maior-polo-universitario-do-sul/\" target=\"_blank\" rel=\"noopener\">Correio Braziliense</a></p><p>4. <b>Larissa Rodrigues disputa DEPUTADA ESTADUAL (não federal).</b> Não é concorrente do Rony (federal) — é <b>aliada</b>. Ela é do <b>PL</b>, cristã, mãe simbólica ps://causaoperaria.org.br/2026/faltam-3-mil-casas-de-programa-para-afetados-por-enchentes/\" target=\"_blank\" rel=\"noopener\">Causa Operária</a> · <a href=\"https://jornaltimoneiro.com.br/index.php/2026/06/30/canoas-recebe-recursos-saude-residencial-nazario-807-moradias/\" target=\"_blank\" rel=\"noopener\">Jornal Timoneiro – Residencial Nazário/807 moradias</a></li><li>Ângulo Rony: <b>&quot;O gaúcho reconstruiu com o próprio suor enquanto Brasília enrolou.&quot;</b> Trabalho/empreendedorismo (MEI que perdeu tudo e reergueu) x assistencialismo/burocracia federal. <a href=\"https://www.canoas.rs.gov.br/noticias/canoas-anuncia-construcao-de-15-mil-moradias-populares-para-afetados-pela-enchente/\" target=\"_blank\" rel=\"noopener\">Prefeitura – 1.500 moradias</a></li></ul><h4>B. Segurança — VITÓRIA DO ALIADO (elogiar, NÃO atacar)</h4><ul><li>Sob a nova gestão (PL), Canoas teve <b>queda histórica de homicídios em 2025</b>: <b>28 casos (jan–out), −47% vs 2024, −62% vs 2023</b>, melhor da série desde 2010; a cidade chegou a passar <b>quase 2 meses sem homicídio</b>. A redução veio principalmente de <b>Mathias Velho e Guajuviras</b>, bairros que historicamente concentravam a violência.</li></ul><p>  - Fontes: <a href=\"https://www.canoas.rs.gov.br/noticias/canoas-e-destaque-de-boas-praticas-de-seguranca-no-estado-apos-reducao-historica-de-homicidios/\" target=\"_blank\" rel=\"noopener\">Prefeitura de Canoas</a> · <a href=\"https://www.canoas.rs.gov.br/noticias/primeiro-trimestre-de-2025-tem-o-menor-numero-de-homicidios-dos-ultimos-quatro-anos/\" target=\"_blank\" rel=\"noopener\">Prefeitura – 1º trimestre 2025</a></p><ul><li>Ângulo Rony (DNA lei-e-ordem): <b>&quot;Quando a direita assume, a bandidagem recua.&quot;</b> Elogiar a virada e defender que é preciso <b>eleger reforço no federal/estadual</b> para blindar o resultado. ⚠️ Nunca dizer que Canoas &quot;é perigosa&quot; — é o oposto do fato de 2025 e ofende o anfitrião.</li></ul><h4>C. Economia / indústria / bolso (trabalho e carga tributária)</h4><ul><li>Canoas é a <b>3ª maior economia do RS</b>, <b>PIB per capita R$ 83.895 (2023)</b>, movida por <b>REFAP (Petrobras)</b>, metalurgia, automotivo e serviços; abriga <b>Yara, AGCO, Saint-Gobain, MWM, Springer Carrier, Full Gauge</b>. &quot;<b>Terra do Avião</b>&quot;, <b>2º maior polo universitário do estado</b>.</li></ul><p>  - Fontes: <a href=\"https://www.correiobraziliense.com.br/cbradar/a-terra-do-aviao-supera-quase-todo-o-estado-em-riqueza-e-se-consolida-como-o-segundo-maior-polo-universitario-do-sul/\" target=\"_blank\" rel=\"noopener\">Correio Braziliense</a> · <a href=\"https://cidades.ibge.gov.br/brasil/rs/canoas/panorama\" target=\"_blank\" rel=\"noopener\">IBGE Cidades</a></p><ul><li>Ângulo Rony (bolso/anti-sistema): cidade que <b>produz riqueza</b> mas o trabalhador e o empresário sentem <b>carga tributária, combustível e custo de vida</b> — tudo decisão de <b>Brasília</b>. REFAP = orgulho local + gancho para falar de <b>preço de combustível / política da Petrobras</b> sem atacar a cidade. Defesa do <b>empreendedor/MEI</b> (o mesmo que a enchente derrubou).</li></ul><h4>D. Velha política / gestão anterior (anti-corrupção — mira o alvo CERTO)</h4><ul><li>A <b>gestão anterior (Jairo Jorge)</b> foi marcada por <b>afastamento cautelar</b> (~quase 1 ano, 2022–2023) na <b>Operação Copa Livre</b>, que apurou <b>fraude em contratos da Saúde</b> (~R$ 66,7 mi, 5 contratos: HPS, Samu, terceirizadas). Ele voltou ao cargo por decisão judicial e <b>perdeu a reeleição em 2024</b> — inclusive muito cobrado pela <b>condução das enchentes</b>.</li></ul><p>  - Fontes: <a href=\"https://jornaltimoneiro.com.br/index.php/2024/04/02/jairo-jorge-tem-derrubada-cautelar-de-afastamento-pelo-stj/\" target=\"_blank\" rel=\"noopener\">Jornal Timoneiro</a> · <a href=\"https://en.wikipedia.org/wiki/Jairo_Jorge\" target=\"_blank\" rel=\"noopener\">Wikipedia – Jairo Jorge</a></p><ul><li>Ângulo Rony (anti-sistema/renovação): <b>&quot;A velha política, 1871</b> (ferrovia São Leopoldo–POA) e <b>emancipação em 27/06/1939</b>. O nome vem das <b>canoas</b> usadas nas cheias do <b>Rio Gravataí</b>.</li></ul><p>  - Fontes: <a href=\"https://forcaaerea.com.br/base-aerea-de-canoas-completa-81-anos/\" target=\"_blank\" rel=\"noopener\">Força Aérea Brasileira</a> · <a href=\"https://www.creditoreal.com.br/blog/canoas-a-terra-do-aviao-e-do-crescimento-economico\" target=\"_blank\" rel=\"noopener\">Crédito Real – história</a></p><ul><li><b>Padroeira Nossa Senhora das Graças</b> e a tradição da imagem encontrada boiando no Rio Gravataí (Festa das Canoas) — gancho de <b>fé</b> com raiz local. Bairro <b>Nossa Senhora das Graças</b> é onde mora a Larissa.</li><li><b>Polo de conhecimento:</b> 2º maior polo universitário do RS (ULBRA, La Salle, UniRitter, IFRS) — cidade de <b>trabalho e estudo</b>, orgulho gaúcho de reerguer-se após a maior tragédia climática do estado.</li></ul><p>  - Fonte: <a href=\"https://www.correiobraziliense.com.br/cbradar/a-terra-do-aviao-supera-quase-todo-o-estado-em-riqueza-e-se-consolida-como-o-segundo-maior-polo-universitario-do-sul/\" target=\"_blank\" rel=\"noopener\">Correio Braziliense</a></p><h3>Lacunas (não achado — não inventar)</h3><ul><li>Número <b>oficial SSP/RS</b> de homicídios de Canoas para o <b>ano fechado de 2025</b> (os dados acima são de release municipal jan–out; cruzar com boletim SSP/RS antes de citar total anual).</li><li><b>Salário médio, taxa de desemprego e % da população ocupada</b> de Canoas (IBGE não extraído — buscar no Panorama/Cidades@ antes de afirmar).</li><li><b>Notícia recente sobre a REFAP</b> (investimento/produção/Petrobras) para atualizar o gancho de combustível/emprego.</li><li><b>Programa/nome da política de segurança</b> da atual gestão que explica a queda (para creditar corretamente o aliado).</li><li>Detalhes/estágio atual do processo de <b>Jairo Jorge</b> (situação em 2026) — confirmar antes de usar como fato consumado.</li></ul>","elec":{"municipio":"CANOAS","lula_pct":45.1,"bolso_pct":54.9,"lula_votos":88851,"bolso_votos":108143,"vencedor":"Bolsonaro","abst_pct":19.9,"branco_pct":1.8,"nulo_pct":3.0,"aptos":258563,"comparecimento":207042,"dep_fed":{"nome":"BUSATO","partido":"UNIÃO","votos":18345},"dep_est":{"nome":"MARCIO FREITAS","partido":"AVANTE","votos":16323}},"dossie":{"e":{"ano":2024,"pop":339133,"orc":2915841025.57,"prop":500040636.79,"fed":648979363.05,"est":1000211310.24,"pp":17.1,"pf":22.3,"pe":34.3,"dep":56.6,"principal":"Transferências (União/Estado)","setor":{"dom":"Serviços","dom_pct":45.5,"pib":21995418000.0,"agro":0.1,"ind":44.4,"serv":45.5,"adm":10.1},"gasto":[{"nome":"Saúde","valor":665761615.18,"pct":24.2},{"nome":"Educação","valor":495902632.64,"pct":18.1},{"nome":"Administração","valor":345192863.6,"pct":12.6},{"nome":"Previdência","valor":342160499.59,"pct":12.5}]},"hooks":["<b>Dependência de Brasília:</b> <b>56.6%</b> do orçamento vem de repasses federais/estaduais. Gancho: “o futuro daqui se decide em Brasília — e é lá que eu quero brigar por vocês”.","<b>O básico que passa por Brasília:</b> a prefeitura investe <b>24.2% em saúde</b> — e o recurso depende do federal liberar."]}},{"nome":"Caxias do Sul","estudo":"<h2>ESTUDO DE CIDADE — CAXIAS DO SUL (RS)</h2><p>&gt; Rony (vereador de Erechim, pré-candidato a Dep. Federal) em visita. É <b>visitante</b> numa cidade que se orgulha do <b>trabalho, da indústria e da tradição italiana</b>. Aqui o gancho natural NÃO é o rural/MST — é <b>bolso, carga tributária que sufoca a indústria, custo Brasil, empreendedorismo vs. assistencialismo, fé/família italiana</b>. Respeito/pertencimento + cruzar com o DNA (anti-Lula/PT, anti-sistema, valores).</p><h3>⚠️ CORREÇÕES DE PRECISÃO (não errar em vídeo)</h3><p>1. <b>Caxias NÃO é &quot;cidade violenta&quot; — é uma das mais SEGURAS do Sul.</b> SSP/RS: <b>queda histórica de +60% em vítimas de crimes violentos em 2025</b>; homicídios dolosos caíram de 48 para 13 no 1º semestre (−73%); a cidade fechou 2025 entre os menores índices em 15 anos. <b>Não usar &quot;insegurança galopante&quot; — a checagem derruba.</b> Brecha real é <b>estelionato/golpes</b> (crime nº 1, ~4,8 mil casos/ano) e ameaça. Enquadre segurança pela ótica do <b>golpe ao trabalhador/idoso</b>, não do &quot;caos&quot;.</p><p>   - Fontes: <a href=\"https://ssp.rs.gov.br/caxias-do-sul-registra-queda-historica-de-mais-de-60-em-numero-de-vitimas-de-crimes-violentos\" target=\"_blank\" rel=\"noopener\">SSP/RS</a> · <a href=\"https://www.brigadamilitar.rs.gov.br/caxias-do-sul-alcanca-resultados-historicos-na-reducao-da-criminalidade-em-2025\" target=\"_blank\" rel=\"noopener\">Brigada Militar</a> · <a href=\"https://crimebrasil.com.br/cidade/rs/caxias-do-sul\" target=\"_blank\" rel=\"noopener\">Crime Brasil (estelionato)</a></p><p>2. <b>O prefeito NÃO é da esquerda — e os DOIS do 2º turno de 2024 eram de direita.</b> Prefeito <b>Adiló Didomenico (PSDB)</b>, reeleito no 2º turno com <b>51,38%</b> (116.730 votos) contra <b>Maurício Scalco (PL, apoiado por Bolsonaro e Michelle)</b>. <b>O PT (Denise Pessôa, 3ª no 1º turno) apoiou Adiló no 2º turno</b> para barrar o candidato bolsonarista. → Alvo &quot;esquerda&quot; vale no <b>federal (Lula/PT)</b> e via <b>Denise Pessôa (dep. federal PT de Caxias)</b>; no <b>municipal</b>, o enquadramento honesto é <b>&quot;velha política / máquina / custo do Estado&quot;</b>, NUNCA &quot;prefeito esquerdista&quot;. <b>Adiló é centro-direita — não queimar como se fosse petista.</b> (Ver alerta de aliado abaixo.)</p><p>   - Fontes: <a href=\"https://www.poder360.com.br/poder-eleicoes/adilo-didomenico-e-reeleito-prefeito-de-caxias-do-sul-rs/\" target=\"_blank\" rel=\"noopener\">Poder360 (reeleição/51,38%)</a> · <a href=\"https://serranossa.com.br/eleicoes-em-caxias-do-sul-scalco-recebe-michelle-bolsonaro-e-pt-decide-apoiar-adilo/\" target=\"_blank\" rel=\"noopener\">SERRANOSSA (Michelle p/ Scalco; PT apoia Adiló)</a> · <a href=\"https://sul21.com.br/noticias/politica/eleicoes-2024/2024/10/caxias-do-sul-saude-e-urbanizacao-pautam-disputa-inedita-de-direita-no-segundo-turno/\" target=\"_blank\" rel=\"noopener\">Sul21 (2º turno inédito de direita)</a></p><p>3. <b>Não forçar pauta rural/MST aqui.</b> Caxias é <b>polo metalmecânico/industrial</b> (mais de <b>6.500 indústrias</b>), não cidade agrária. Não há invasão do MST em pauta na cidade. Tentar &quot;anti-MST&quot; em Caxias soa deslocado — a pauta que ressoa é <b>indústria, emprego, imposto e empreendedorismo</b>. Guarde o anti-MST para cidades do interior agrário.</p><p>   - Fonte: <a href=\"https://revistaoeste.com/oestegeral/2026/07/27/6-500-industrias-pib-per-capita-maior-que-o-de-curitiba-e-neve-no-inverno-a-cidade-da-serra-gaucha-que-fabrica-os-onibus-que-rodam-o-mundo/\" target=\"_blank\" rel=\"noopener\">Revista Oeste (6.500 indústrias)</a></p><p>4. <b>Não superdimensionar a cidade.</b> É a <b>2ª maior do RS</b> (POA é a maior). População <b>463.501 (Censo 2022)</b>, estimada ~479,6 mil (2025). Dizer &quot;maior cidade do RS&quot; é erro de checagem.</p><p>   - Fonte: <a href=\"https://cidades.ibge.gov.br/brasil/rs/caxias-do-sul/panorama\" target=\"_blank\" rel=\"noopener\">IBGE Cidades — Caxias do Sul</a></p><h3>🏆 GANCHOS FORTES (cruzados com o DNA do Rony)</h3><h4>A. Carga tributária sufocando a indústria / custo Brasil (CAMPEÃO — é a identidade da cidade)</h4><ul><li>Caxias tem <b>PIB per capita R$ 81.683,97 (2023) — maior que o de Curitiba</b>, com <b>6.500+ indústrias</b> (metalmecânico, autopeças, ônibus/Marcopolo, moveleiro, vinícola) e responde por ~5,83% do PIB gaúcho. É a cidade que <b>produz e paga imposto</b> — e sente o Estado no lombo.</li><li><b>A própria CIC Caxias (Câmara de Indústria, Comércio e Serviços) bate nessa tecla:</b> em evento com o Instituto de Estudos Empresariais (IEE, mar/2026), o economista <b>Ricardo Hingel</b> afirmou que *&quot;a carga tributária brasileira está na origem dos principais problemas estruturais&quot;* e chamou o <b>populismo fiscal</b> de marca dos erros econômicos. Discurso pronto para o Rony encampar como visitante que <b>defende quem produz</b>.</li><li><b>Cross com DNA:</b> bolso/carga tributária + anti-Lula (gasto público/Estado inchado) + empreendedorismo. Fala de chegada: *&quot;Vim à capital do trabalho gaúcho ouvir quem sustenta o Brasil e é sufocado pelo imposto.&quot;*</li></ul><p>  - Fontes: <a href=\"https://revistaoeste.com/oestegeral/2026/07/27/6-500-industrias-pib-per-capita-maior-que-o-de-curitiba-e-neve-no-inverno-a-cidade-da-serra-gaucha-que-fabrica-os-onibus-que-rodam-o-mundo/\" target=\"_blank\" rel=\"noopener\">Revista Oeste (PIB per capita &gt; Curitiba; 6.500 indústrias)</a> · <a href=\"https://ciccaxias.org.br/noticias/2026/03/23/ricardo-hingel-carga-tributaria-esta-na-raiz-dos-entraves-ao-crescimento-brasileiro/\" target=\"_blank\" rel=\"noopener\">CIC Caxias (Hingel — carga tributária)</a> · <a href=\"https://cidades.ibge.gov.br/brasil/rs/caxias-do-sul/panorama\" target=\"_blank\" rel=\"noopener\">IBGE Cidades</a></p><h4>B. Trabalho x assistencialismo (a alma caxiense — cross perfeito com o DNA)</h4><ul><li>Caxias tem <b>216.460 empregos formais (2023)</b> e salário médio de ~2,9 salários mínimos — economia movida a trabalho e pequena/média indústria. A narrativa do imigrante que &quot;chegou sem nada e ergueu tudo no braço&quot; É o DNA do Rony (trabalho/empreendedorismo vs. assistencialismo).</li><li><b>Munição local pronta:</b> vereadores <b>do PL na Câmara de Caxias</b> propuseram a campanha <b>&quot;Não dê esmola, ofereça dignidade&quot;</b> — mesmíssima tese &quot;mão que trabalha, não mão estendida&quot;. Ângulo do Rony: *&quot;A dignidade caxiense se chama trabalho, não Bolsa do governo.&quot;*</li></ul><p>  - Fontes: <a href=\"https://www.camaracaxias.rs.gov.br/noticias/index/30301\" target=\"_blank\" rel=\"noopener\">Câmara de Caxias (campanha &quot;Não dê esmola, ofereça dignidade&quot;)</a> · <a href=\"https://cidades.ibge.gov.br/brasil/rs/caxias-do-sul/panorama\" target=\"_blank\" rel=\"noopener\">IBGE Cidades (empregos/salário)</a></p><h4>C. Fé, família e tradição italiana (pertencimento + valores conservadores)</h4><ul><li><b>150 anos da imigração italiana (1875–2025)</b>; a <b>95ª Festa Nacional da Uva (fev–mar/2026)</b> celebrou o marco. A <b>Gruta/N. Sra. de Caravaggio</b> (Parque Mário Bernardino Ramos) é um dos maiores centros de romaria mariana do Sul. Cidade de matriz <b>católica, familiar e trabalhadora</b> — terreno fértil para fé/família.</li><li><b>Cross com DNA:</b> fé/família + valores + patriotismo regional. Fala: *&quot;O italiano que colonizou Caxias trouxe três coisas: fé, família e trabalho — é isso que a esquerda quer apagar.&quot;*</li></ul><p>  - Fontes: <a href=\"https://gazetarural.com/festa-nacional-da-uva-celebra-150-anos-da-imigracao-italiana-em-caxias-do-sul/\" target=\"_blank\" rel=\"noopener\">Gazeta Rural (Festa da Uva / 150 anos)</a> · <a href=\"https://www.festadauva.com.br/turismo\" target=\"_blank\" rel=\"noopener\">Festa da Uva 2026 (95ª ed.)</a> · <a href=\"https://pt.wikipedia.org/wiki/Hist%C3%B3ria_de_Caxias_do_Sul\" target=\"_blank\" rel=\"noopener\">História de Caxias do Sul (Wikipédia)</a></p><h4>D. Anti-Lula/PT federal com rosto local — Denise Pessôa (dep. federal PT de Caxias)</h4><ul><li><b>Denise Pessôa (PT)</b> foi a <b>1ª deputada federal eleita por Caxias</b>, base local do PT/Lula, e ficou em 3º no 1º turno de 2024 (26,29%). É o <b>alvo federal legítimo e honesto</b> na cidade (Lula/PT, pauta de costumes), sem precisar atacar o prefeito centro-direita.</li><li><b>Cross com DNA:</b> anti-Lula/PT + costumes + bolso (emenda/gasto federal). Enquadre pela agenda nacional, não como briga municipal.</li></ul><p>  - Fonte: <a href=\"https://www.camara.leg.br/deputados/220553\" target=\"_blank\" rel=\"noopener\">Câmara dos Deputados — Denise Pessôa (PT/RS)</a></p><h4>E. Reforma tributária — Caxias como voz da indústria (federal com gancho local)</h4><ul><li>A <b>Câmara de Caxias apoiou a representação do município na discussão da reforma tributária</b> e a cidade tem cadeira na governança do novo IBS. Palco para o Rony se posicionar como <b>defensor da indústria do interior contra o custo/complexidade tributária</b> — pauta federal em que ele é candidato.</li></ul><p>  - Fonte: <a href=\"https://www.camaracaxias.rs.gov.br/noticias/index/31891\" target=\"_blank\" rel=\"noopener\">Câmara de Caxias (apoio à representação na reforma tributária)</a></p><h3>💛 ORGULHO / PERTENCIMENTO (gravar na chegada, mostra respeito)</h3><ul><li><b>Berço da imigração italiana no RS (1875)</b>, antiga &quot;Campo dos Bugres&quot;; a <b>Festa Nacional da Uva</b> (desde os anos 1930) é o maior símbolo; <b>cidade que fabrica os ônibus que rodam o mundo (Marcopolo)</b>; <b>PIB per capita maior que o de Curitiba</b>; <b>neve no inverno</b> na Serra Gaúcha; <b>N. Sra. de Caravaggio</b> como devoção mariana. Identidade-síntese: <b>trabalho, fé e família</b>.</li></ul><p>  - Fontes: <a href=\"https://revistaoeste.com/oestegeral/2026/07/27/6-500-industrias-pib-per-capita-maior-que-o-de-curitiba-e-neve-no-inverno-a-cidade-da-serra-gaucha-que-fabrica-os-onibus-que-rodam-o-mundo/\" target=\"_blank\" rel=\"noopener\">Revista Oeste (ônibus/Marcopolo, neve, PIB)</a> · <a href=\"https://pt.wikipedia.org/wiki/Hist%C3%B3ria_de_Caxias_do_Sul\" target=\"_blank\" rel=\"noopener\">História de Caxias do Sul (Wikipédia)</a></p><h3>⚠️ ALERTA DE ALIADO (ler antes de gravar)</h3><ul><li><b>NÃO chamar o prefeito Adiló (PSDB) de &quot;esquerda&quot;.</b> Ele é centro-direita, reeleito, e venceu o candidato do PL. Crítica só como <b>&quot;velha política/custo do Estado&quot;</b>, e apenas se o contato local for oposição a ele.</li><li><b>O PL (campo do Rony) PERDEU a prefeitura.</b> Scalco (PL, apoiado por Bolsonaro/Michelle) foi derrotado por Adiló com apoio do PT no 2º turno. Ao elogiar/atacar, saiba de que lado o contato está — pisar errado racha a direita local.</li><li><b>CUIDADO com o vereador Hiago Morandi (PL, o mais votado da história de Caxias — 11.304 votos).</b> Ele está <b>sob investigação do MP por suposta agressão a morador de rua (Morro do Sabão, jul/2025)</b>, com pedidos de cassação na Câmara. <b>NÃO amarrar o Rony a esse escândalo em hipótese alguma.</b></li><li><b>Atenção ao contato &quot;Leo Endres&quot;:</b> o nome que aparece publicamente (<b>Leonardo Endres, ex-assessor</b>) é justamente <b>quem ACUSOU o vereador Morandi</b> no caso do morador de rua — ou seja, está <b>em conflito aberto com o principal nome do PL local</b>. Se for a mesma pessoa, o Rony precisa <b>evitar tomar lado nessa briga interna da direita</b> até confirmar quem é quem. <b>Confirmar identidade e alinhamento antes da visita.</b></li></ul><p>  - Fontes: <a href=\"https://leouve.com.br/cidades/caxias-do-sul/com-hiago-morandi-como-o-vereador-mais-votado-da-historia-confira-a-futura-composicao-da-camara-de-vereadores-de-caxias-do-sul/\" target=\"_blank\" rel=\"noopener\">Leouve (Morandi mais votado da história)</a> · <a href=\"https://leouve.com.br/cidades/hiago-morandi-nega-agressao-morador-de-rua-caxias-do-sul-mp-investiga\" target=\"_blank\" rel=\"noopener\">Leouve (Morandi x Leonardo Endres; MP investiga)</a></p><h3>Lacunas (não achado — não inventar)</h3><ul><li><b>&quot;Baldo&quot; (retorno 19/08) não identificado</b> — sem correspondência confiável na web (vereador/empresário/liderança). Pedir ao contato o nome completo/cargo antes de citar.</li><li><b>&quot;Leo Endres&quot; — alinhamento com o Rony não confirmado.</b> Só há registro de Leonardo Endres (ex-assessor) no litígio com Morandi. Confirmar se é o mesmo e de que grupo é.</li><li>Taxa de desemprego atual e vagas industriais em aberto (setores metalmecânico/autopeças); dados de arrecadação municipal (IPTU/ISS) e reclamações do comércio sobre custo Brasil local; situação de fila de creche/saúde municipal (possível gancho família/gestão); detalhes da agenda de 08/08 (almoço) e 19/08.</li></ul><p>&lt;/content&gt;</p><p>&lt;/invoke&gt;</p>","elec":{"municipio":"CAXIAS DO SUL","lula_pct":33.6,"bolso_pct":66.4,"lula_votos":91262,"bolso_votos":180592,"vencedor":"Bolsonaro","abst_pct":16.9,"branco_pct":1.7,"nulo_pct":3.4,"aptos":344640,"comparecimento":286300,"dep_fed":{"nome":"MAURICIO MARCON","partido":"PODE","votos":52135},"dep_est":{"nome":"PEPE VARGAS","partido":"PT","votos":49830}},"dossie":{"e":{"ano":2024,"pop":503068,"orc":3460321283.06,"prop":854220717.57,"fed":600512916.25,"est":725721058.37,"pp":24.7,"pf":17.4,"pe":21.0,"dep":38.4,"principal":"Transferências (União/Estado)","setor":{"dom":"Serviços","dom_pct":51.7,"pib":31688552000.0,"agro":1.0,"ind":36.3,"serv":51.7,"adm":11.0},"gasto":[{"nome":"Saúde","valor":925367055.28,"pct":30.3},{"nome":"Educação","valor":533731446.79,"pct":17.5},{"nome":"Previdência","valor":513497105.5,"pct":16.8},{"nome":"Urbanismo","valor":239529410.86,"pct":7.8}]},"hooks":["<b>Terreno amigo:</b> Caxias do Sul deu <b>66.4% ao Bolsonaro</b> em 2022 — cidade de família, trabalho e fé. Abrir reconhecendo o povo.","<b>O básico que passa por Brasília:</b> a prefeitura investe <b>30.3% em saúde</b> — e o recurso depende do federal liberar."]}},{"nome":"Estação","estudo":"<h2>ESTUDO DE CIDADE — ESTAÇÃO (RS)</h2><p>&gt; Rony (vereador de Erechim, pré-candidato a Dep. Federal) em visita — jantar 04/08/2026 (mesmo dia de Sananduva). É <b>visitante</b>, mas aqui é <b>quase casa</b>: Estação fica a ~38 km de Erechim, mesma região (Alto Uruguai/Norte do RS). Conteúdo = respeito/pertencimento regional forte + cruzar com o DNA dele (agro/propriedade, fé/família, anti-Lula, trabalho vs. assistencialismo).</p><p>&gt; ⚠️ <b>Cidade MUITO pequena (~5.924 hab.). Há POUCO material online.</b> Este estudo é curto e honesto por escolha — o que não foi achado está em &quot;Lacunas&quot;. Não inventar.</p><h3>⚠️ CORREÇÕES DE PRECISÃO (não errar em vídeo)</h3><p>1. <b>O prefeito é do CAMPO ALIADO — NÃO atacar como &quot;esquerda&quot;.</b> Geverson Zimmermann, o <b>&quot;Gé&quot; (PSDB)</b>, foi <b>reeleito em 2024 com 70,90% (2.929 votos)</b>, com o vice Alcione Domingos Conte, o <b>&quot;Pé&quot; (PP)</b>, na coligação &quot;Pra Frente Estação&quot; (Federação PSDB/Cidadania + PP + União Brasil). É <b>centro-direita</b>. Chegar batendo no prefeito local queima ponte com a direita da cidade. A bandeira anti-Lula/PT é <b>federal</b>, não municipal.</p><p>   - Fontes: <a href=\"https://www.afolharegionalrs.com.br/eleicoes-2024-ge-psdb-e-pe-pp-sao-reeleitos-com7090-dos-votos-no-municipio-de-estacao\" target=\"_blank\" rel=\"noopener\">A Folha Regional</a> · <a href=\"https://www.otempo.com.br/eleicoes/2024/candidatos/rio-grande-do-sul/estacao/prefeito/ge-45\" target=\"_blank\" rel=\"noopener\">O Tempo — Gé 45</a></p><p>2. <b>Estação NÃO é cidade pobre/abandonada — é agro próspero.</b> <b>IDHM 0,753 (alto)</b>; <b>PIB per capita R$ 40.956 (2020)</b>, bem acima da média do RS. Não usar retórica de &quot;miséria/abandono&quot; — não cola e a checagem derruba. O ângulo honesto é <b>interior que TRABALHA e PRODUZ</b> (trabalho vs. assistencialismo), não &quot;interior miserável&quot;.</p><p>   - Fonte: <a href=\"https://pt.wikipedia.org/wiki/Esta%C3%A7%C3%A3o_(Rio_Grande_do_Sul\" target=\"_blank\" rel=\"noopener\">Wikipédia — Estação (RS)</a>) · <a href=\"https://cidades.ibge.gov.br/brasil/rs/estacao/panorama\" target=\"_blank\" rel=\"noopener\">IBGE Cidades</a></p><p>3. <b>Não confundir Estação com Getúlio Vargas.</b> Estação <b>emancipou-se de Getúlio Vargas em 1988</b>; o nome vem da <b>estação ferroviária</b> (já se chamou &quot;Estação Erechim&quot; e &quot;Estação Getúlio Vargas&quot;). A <b>Cotrigo</b> (Cooperativa Tritícola de <b>Getúlio Vargas</b>) tem <b>sede em Getúlio Vargas</b>, não em Estação — mas <b>opera em Estação</b> (unidade + matrizeiras de suínos). Falar &quot;Cotrigo, cooperativa daqui de Estação&quot; é impreciso; o certo é &quot;Cotrigo, que também está aqui / tem unidade aqui&quot;.</p><p>   - Fontes: <a href=\"https://pt.wikipedia.org/wiki/Esta%C3%A7%C3%A3o_(Rio_Grande_do_Sul\" target=\"_blank\" rel=\"noopener\">Wikipédia — Estação (RS)</a>) · <a href=\"https://www.econodata.com.br/consulta-empresa/90155953002831-cooperativa-triticola-de-getulio-vargas-ltda\" target=\"_blank\" rel=\"noopener\">Econodata — Cotrigo</a></p><p>4. <b>É município x federal.</b> Tudo que o Rony ataca (Lula/PT, assistencialismo, MST) é pauta <b>federal/nacional</b>. No <b>municipal</b>, Estação é gestão aliada de centro-direita. Não misturar.</p><h3>🏆 GANCHOS FORTES (cruzados com o DNA do Rony)</h3><h4>A. Pertencimento regional / &quot;quase em casa&quot; (CAMPEÃO — abre o vídeo)</h4><ul><li>Estação fica a <b>~38–39 km de Erechim</b> (~37 min de carro), na mesma região do <b>Alto Uruguai / Norte do RS</b> — mesma gente, mesma identidade de colono, mesma economia. O Rony não é &quot;de fora&quot;: é <b>vizinho e representante da região</b>. Ângulo forte: *&quot;Erechim e Estação são a mesma família do interior do Norte gaúcho — e o interior precisa de voz em Brasília.&quot;*</li></ul><p>  - Fonte: <a href=\"https://www.adistanciaentre.com/br/distancia-entre-erechim-e-estacao/DistanciaHistoria/1137447.aspx\" target=\"_blank\" rel=\"noopener\">A Distância Entre — Erechim x Estação</a></p><h4>B. Agro / cooperativismo / propriedade (o coração da cidade)</h4><ul><li>Economia de <b>agropecuária diversificada</b>: trigo, milho, soja, feijão, viticultura e <b>suinocultura</b> (a Cotrigo mantém matrizeiras de suínos em Estação). Cidade de <b>filhos de colono que vivem do trabalho na terra</b>. Casa com o DNA do Rony: <b>defesa da propriedade rural, valor do trabalho no campo, cooperativismo, anti-MST</b> (respeito a quem produz vs. quem invade).</li></ul><p>  - Fontes: <a href=\"https://pt.wikipedia.org/wiki/Esta%C3%A7%C3%A3o_(Rio_Grande_do_Sul\" target=\"_blank\" rel=\"noopener\">Wikipédia — Estação (RS)</a>) · <a href=\"https://www.econodata.com.br/consulta-empresa/90155953002831-cooperativa-triticola-de-getulio-vargas-ltda\" target=\"_blank\" rel=\"noopener\">Econodata — Cotrigo</a></p><ul><li>A <b>Cotrigo</b> (com sede em Getúlio Vargas e atuação em Estação) reúne <b>+5.000 associados, ~900 empregados e ~30 produtos</b> — símbolo do cooperativismo que sustenta a região. Ângulo: <b>cooperativismo = trabalho e união do produtor, o oposto do assistencialismo.</b></li></ul><p>  - Fonte: <a href=\"https://pt.wikipedia.org/wiki/Esta%C3%A7%C3%A3o_(Rio_Grande_do_Sul\" target=\"_blank\" rel=\"noopener\">Wikipédia — Estação (RS)</a>)</p><h4>C. Fé / família / valores (colonização e tradição)</h4><ul><li>Colonizada no <b>fim do séc. XIX por imigrantes italianos, alemães e poloneses</b> — cultura de <b>fé católica, família grande, trabalho duro e comunidade</b>. Terreno natural para o discurso <b>cristão/valores/família</b> do Rony. Ângulo: *&quot;o Brasil que ergueu tudo com fé, família e trabalho — que é o que se vê aqui.&quot;*</li></ul><p>  - Fonte: <a href=\"https://pt.wikipedia.org/wiki/Esta%C3%A7%C3%A3o_(Rio_Grande_do_Sul\" target=\"_blank\" rel=\"noopener\">Wikipédia — Estação (RS)</a>)</p><h4>D. Interior que produz e é esquecido por Brasília (economia no bolso)</h4><ul><li>Município pequeno (~5.924 hab.) que <b>gera riqueza pelo agro</b> mas tem pouco peso político em Brasília. Ângulo anti-sistema/bolso: <b>o interior produtivo sustenta o país e não é ouvido; precisa de deputado que defenda o pequeno produtor e o cooperativismo</b> (custo de produção, frete, impostos, energia). Ligar à pauta federal (carga tributária, política do governo Lula para o agro).</li></ul><p>  - Fonte: <a href=\"https://cidades.ibge.gov.br/brasil/rs/estacao/panorama\" target=\"_blank\" rel=\"noopener\">IBGE Cidades — Estação</a></p><h4>E. Voto conservador da região (anti-Lula ressoa)</h4><ul><li>O <b>RS deu vitória a Bolsonaro em 2022 (56,35% no 2º turno)</b>, e o <b>Alto Uruguai/Norte gaúcho colono é reduto conservador</b>. A pauta anti-Lula/PT do Rony encontra público. ⚠️ <b>Não afirmar o % exato de Estação</b> (não confirmado — ver Lacunas); usar o dado <b>estadual</b> e o perfil regional.</li></ul><p>  - Fonte: <a href=\"https://www.em.com.br/app/noticia/politica/2022/10/30/interna_politica,1414521/quem-ganhou-o-2-turno-da-eleicao-para-presidente-no-rio-grande-do-sul.shtml\" target=\"_blank\" rel=\"noopener\">Estado de Minas — 2º turno RS 2022</a></p><h3>💛 ORGULHO / PERTENCIMENTO (gravar na chegada, mostra respeito)</h3><ul><li><b>Emancipada em 21/04/1988</b> (Lei nº 8.572); 1ª eleição em 15/11/1988. O nome nasce da <b>ferrovia</b>: a estação do ramal <b>Passo Fundo–Marcelino Ramos</b>, inaugurada em <b>03/05/1910</b> — a cidade cresceu ao redor dos trilhos (já foi &quot;Estação Erechim&quot; e &quot;Estação Getúlio Vargas&quot;). Gentílico: <b>estaçonense</b>. Terra de <b>colonos italianos, alemães e poloneses</b> que fizeram tudo do zero com trabalho.</li></ul><p>  - Fonte: <a href=\"https://pt.wikipedia.org/wiki/Esta%C3%A7%C3%A3o_(Rio_Grande_do_Sul\" target=\"_blank\" rel=\"noopener\">Wikipédia — Estação (RS)</a>) · <a href=\"https://pmestacao.rs.gov.br/sobre-o-municipio/\" target=\"_blank\" rel=\"noopener\">Prefeitura de Estação — Sobre o município</a></p><h3>Lacunas (não achado — não inventar)</h3><ul><li><b>Padroeiro / nome da igreja matriz / festa religiosa</b> da cidade (importante p/ o gancho fé — checar no local com o anfitrião antes de citar).</li><li><b>Resultado presidencial 2022 no município de Estação</b> (% exato Bolsonaro/Lula) — só achei o dado estadual.</li><li><b>Dados de criminalidade da SSP/RS específicos de Estação</b> (município minúsculo, tende a baixíssima criminalidade — não afirmar sem número).</li><li><b>Quem recebe o Rony / vereador ou liderança parceira</b> no jantar de 04/08 — confirmar para não elogiar/atacar o lado errado (prefeito é PSDB/aliado).</li><li><b>Salário médio, taxa de desemprego, população censo 2022 confirmada</b> (referência mais recente ~5.924 hab.).</li><li><b>Pauta local viva</b> (obra, demanda, disputa recente) — não achada online; levantar com o contato local.</li></ul>","elec":{"municipio":"ESTAÇÃO","lula_pct":31.2,"bolso_pct":68.8,"lula_votos":1257,"bolso_votos":2768,"vencedor":"Bolsonaro","abst_pct":13.1,"branco_pct":1.9,"nulo_pct":2.7,"aptos":4854,"comparecimento":4217,"dep_fed":{"nome":"AFONSO HAMM","partido":"PP","votos":649},"dep_est":{"nome":" DELEGADA NADINE","partido":"PSDB","votos":1051}},"dossie":{"e":{"ano":2024,"pop":5517,"orc":56930224.94,"prop":4495148.55,"fed":21805035.1,"est":14299474.63,"pp":7.9,"pf":38.3,"pe":25.1,"dep":63.4,"principal":"Transferências (União/Estado)","setor":{"dom":"Serviços","dom_pct":45.4,"pib":350708000.0,"agro":20.0,"ind":20.6,"serv":45.4,"adm":14.0},"gasto":[{"nome":"Saúde","valor":10482890.77,"pct":21.1},{"nome":"Educação","valor":8760778.56,"pct":17.6},{"nome":"Transporte","valor":6858755.16,"pct":13.8},{"nome":"Administração","valor":6526034.78,"pct":13.1}]},"hooks":["<b>Terreno amigo:</b> Estação deu <b>68.8% ao Bolsonaro</b> em 2022 — cidade de família, trabalho e fé. Abrir reconhecendo o povo.","<b>Dependência de Brasília:</b> <b>63.4%</b> do orçamento vem de repasses federais/estaduais. Gancho: “o futuro daqui se decide em Brasília — e é lá que eu quero brigar por vocês”.","<b>O básico que passa por Brasília:</b> a prefeitura investe <b>21.1% em saúde</b> — e o recurso depende do federal liberar."]}},{"nome":"Farroupilha","estudo":"<h2>ESTUDO DE CIDADE — FARROUPILHA (RS)</h2><p>&gt; Rony (vereador de Erechim, pré-candidato a Dep. Federal) em visita. É <b>visitante</b> — conteúdo precisa mostrar respeito/pertencimento + cruzar com o DNA dele (fé/família, empreendedorismo, anti-esquerda no federal, esporte/juventude).</p><p>&gt; <b>CONTEXTO DA AGENDA:</b> noite de <b>08/08/2026</b>, evento de <b>boxe/luta — &quot;Sierra Fight Show&quot;</b>, no <b>Centro de Eventos Mário Bianchi</b>, a convite do <b>vereador Darlan de Jesus (PL)</b>. Tom de <b>evento popular / esporte</b>, não comício. Terra profundamente conservadora e católica — jogar em casa em fé, família e trabalho.</p><h3>⚠️ CORREÇÕES DE PRECISÃO (não errar em vídeo)</h3><p>1. <b>Farroupilha NÃO é cidade violenta — é o OPOSTO.</b> Sim, entrou na lista do programa estadual <b>RS Seguro</b> (23 municípios), mas é justamente a de <b>MELHOR desempenho</b>: <b>apenas 1 homicídio em 2025</b>, o <b>menor índice</b> entre os 23. Homicídios <b>−72% (2019→2024)</b>, roubo a pedestre <b>−75%</b>, roubo de veículo <b>−78%</b>. <b>Não chamar a cidade de perigosa</b> — a checagem derruba e ofende o morador. Ângulo correto: <b>elogiar</b> o resultado e defender <b>mais segurança/apoio ao policial</b> (casa com o perfil do anfitrião Darlan, formado em Segurança Pública).</p><p>   - Fontes: <a href=\"https://leouve.com.br/seguranca/farroupilha-apresenta-menor-indice-de-crimes-contra-a-vida-entre-cidades-do-programa-rs-seguro\" target=\"_blank\" rel=\"noopener\">Leouve – menor índice do RS Seguro</a> · <a href=\"https://estado.rs.gov.br/rs-seguro-amplia-de-18-para-23-os-municipios-priorizados\" target=\"_blank\" rel=\"noopener\">Estado RS – RS Seguro amplia p/ 23 municípios</a></p><p>2. <b>Farroupilha NÃO é governada pela esquerda — é campo conservador/direita.</b> Prefeito <b>Jonas Tomazini (MDB)</b>, eleito 2024 com <b>63,51%</b>; vice <b>Thiago Brunet (PP)</b>. Presidente da Câmara: <b>pastor Davi de Almeida</b>. No presidencial de 2022, <b>Bolsonaro fez 66,41% no 1º turno</b> (30.199 votos) contra 24,63% de Lula. → O alvo <b>&quot;esquerda/Lula/PT&quot;</b> vale no <b>federal</b>; no <b>municipal</b> o campo é aliado/amplo. Não chamar prefeito, vice ou vereadores locais de &quot;esquerda&quot;. Crítica de gestão, se houver, é <b>&quot;velha política&quot;</b>, nunca rótulo ideológico.</p><p>   - Fontes: <a href=\"https://www.cnnbrasil.com.br/eleicoes/jonas-e-eleito-prefeito-de-farroupilha-rs/\" target=\"_blank\" rel=\"noopener\">CNN – Jonas eleito</a> · <a href=\"https://spacofm.com.br/confira-os-resultados-das-eleicoes-em-farroupilha/\" target=\"_blank\" rel=\"noopener\">Spaço FM – resultados 2022 em Farroupilha</a></p><p>3. <b>A luta é EXIBIÇÃO/festiva — não é rivalidade política.</b> No Sierra Fight Show o combate-destaque é entre os vereadores <b>Darlan de Jesus (PL — o anfitrião do Rony)</b> e <b>Joel Corrêa (MDB — partido do prefeito)</b>. É esporte/entretenimento. <b>Não transformar em &quot;briga de direita x MDB&quot;</b> nem peitar o Joel/o grupo do prefeito — pode queimar ponte com a base local. Tratar como <b>festa da cidade, esporte e coragem</b>.</p><p>   - Fonte: <a href=\"https://spacofm.com.br/sierra-fight-show-tera-luta-entre-vereadores-joel-correa-e-darlan-de-jesus-em-agosto/\" target=\"_blank\" rel=\"noopener\">Spaço FM – luta entre os vereadores no Sierra Fight Show</a></p><p>4. <b>Caravaggio é SANTUÁRIO DIOCESANO (Diocese de Caxias do Sul), em Farroupilha</b> — não confundir com a cidade italiana homônima. A <b>grande romaria é 26 de maio</b> (não é agora). Caminhada tradicional (~20 km) e romarias de ciclistas, cavaleiros (&quot;Cavalgada da Fé&quot;) e motociclistas ao longo de maio. Falar &quot;romaria/santuário&quot; sim; não cravar data errada no vídeo.</p><p>   - Fonte: <a href=\"https://www.vaticannews.va/pt/igreja/news/2023-10/santuario-diocesano-nossa-senhora-caravaggio-farroupilha-rs.html\" target=\"_blank\" rel=\"noopener\">Vatican News – Santuário de Caravaggio, Farroupilha</a></p><h3>🏆 GANCHOS FORTES (cruzados com o DNA do Rony)</h3><h4>A. Fé / família — Santuário de Caravaggio (CAMPEÃO de pertencimento)</h4><ul><li><b>Santuário de Nossa Senhora de Caravaggio</b>, o <b>maior santuário em fluxo de romeiros do Sul do Brasil</b>: capela original de <b>1879</b>, santuário atual dos anos 1960, <b>Patrimônio Histórico e Cultural do RS (Lei 12.478/2006)</b>. A <b>romaria a pé de 26 de maio reúne mais de 250 mil pessoas</b>; ao longo do ano recebe <b>mais de 1 milhão de visitantes</b>. Monumento de N. Sra. (7 m) e da vidente <b>Joaneta Varoli</b> (3,8 m) inaugurado em 2008. Fé nascida do <b>imigrante italiano</b> que ergueu a capela na luta pela vida.</li></ul><p>  - Ângulo: <b>fé, família e gratidão do povo trabalhador</b> — puro DNA cristão do Rony, e o maior símbolo de pertencimento da cidade. Abrir/fechar vídeo com respeito a Caravaggio conquista o farroupilhense.</p><p>  - Fontes: <a href=\"https://pt.wikipedia.org/wiki/Santu%C3%A1rio_de_Nossa_Senhora_de_Caravaggio_(Farroupilha\" target=\"_blank\" rel=\"noopener\">Wikipédia – Santuário de Caravaggio (Farroupilha)</a>) · <a href=\"https://www.vaticannews.va/pt/igreja/news/2023-10/santuario-diocesano-nossa-senhora-caravaggio-farroupilha-rs.html\" target=\"_blank\" rel=\"noopener\">Vatican News</a></p><h4>B. Empreendedorismo / indústria / bolso (a alma econômica da cidade)</h4><ul><li><b>&quot;Capital Nacional do Moscatel&quot;</b> por lei federal (<b>Lei 13.795/2019, sancionada por Bolsonaro</b>): Farroupilha é a <b>maior produtora nacional de uva moscatel</b> e concentra ~40% do cultivo de Moscato Branco da região; 3ª maior produtora de vinho do país; selo de Indicação de Procedência desde 2014.</li><li><b>Polo da malha</b> — a cidade se firma como <b>&quot;capital da malha&quot;</b>, com dezenas de malharias e o tradicional shopping/feira de malhas; <b>indústria = 40,5%</b> do valor agregado local. <b>PIB per capita ~R$ 70,5 mil (2022)</b> — bem acima da média do RS.</li></ul><p>  - Ângulo: <b>empreendedor, colono e operário</b> geram riqueza — <b>trabalho vs. assistencialismo</b>, <b>menos imposto para quem produz</b>, defesa da pequena indústria e do produtor de uva. Elogiar quem &quot;faz acontecer&quot; na Serra.</p><p>  - Fontes: <a href=\"https://www.camara.leg.br/noticias/538936-camara-aprova-titulo-de-capital-nacional-da-uva-moscatel-a-farroupilha/\" target=\"_blank\" rel=\"noopener\">Câmara dos Deputados – título de Capital da Uva Moscatel</a> · <a href=\"https://www.planalto.gov.br/Ccivil_03/_Ato2019-2022/2019/Lei/L13795.htm\" target=\"_blank\" rel=\"noopener\">Lei 13.795/2019 – Planalto</a></p><h4>C. Esporte / juventude / coragem (liga direto ao evento de boxe)</h4><ul><li><b>Sierra Fight Show — 08/08 (sáb), Centro de Eventos Mário Bianchi</b>: MMA, boxe, kickboxing, jiu-jítsu, muay thai e queda de braço; destaque na luta-exibição entre os vereadores <b>Darlan de Jesus (PL)</b> e <b>Joel Corrêa (MDB)</b>, além de espaço gastronômico e atrações.</li></ul><p>  - Ângulo: <b>esporte tira o jovem do crime, ensina disciplina, respeito e superação</b> — valores conservadores. Prestigiar o evento, a garotada dos ringues e o esforço dos atletas. Casa com o anfitrião Darlan (Segurança Pública) e com a pauta de juventude/família.</p><p>  - Fonte: <a href=\"https://spacofm.com.br/sierra-fight-show-tera-luta-entre-vereadores-joel-correa-e-darlan-de-jesus-em-agosto/\" target=\"_blank\" rel=\"noopener\">Spaço FM – Sierra Fight Show</a></p><h4>D. Segurança pública (elogiar o resultado, defender o policial) — ALIADO</h4><ul><li><b>Darlan de Jesus (PL)</b>, o anfitrião: 1º mandato, <b>formado em Segurança Pública</b> e pós em Sistema Penitenciário, presidente do <b>PL Jovem</b> local; primeiro projeto na área de segurança. A cidade <b>investe em incentivo financeiro para agentes de segurança</b>.</li></ul><p>  - Ângulo: <b>valorizar quem defende a segurança</b>, reforçar aliança com o PL local, e usar o <b>bom resultado de Farroupilha</b> (queda de crimes) como prova de que <b>firmeza + apoio à polícia funciona</b> — contraste com a insegurança nacional.</p><p>  - Fontes: <a href=\"https://camarafarroupilha.rs.gov.br/vereadores/darlan-de-jesus/\" target=\"_blank\" rel=\"noopener\">Câmara de Farroupilha – Darlan de Jesus</a> · <a href=\"https://leouve.com.br/cidades/farroupilha/farroupilha-amplia-incentivo-financeiro-para-agentes-da-seguranca-publica\" target=\"_blank\" rel=\"noopener\">Leouve – incentivo a agentes de segurança</a></p><h4>E. Colonização italiana / trabalho (identidade + valores)</h4><ul><li><b>&quot;Berço da Imigração Italiana no RS&quot;</b> (colonização a partir de <b>1875</b>, distrito de Nova Milano); município criado em <b>11/12/1934</b>, em homenagem ao centenário da Revolução Farroupilha. Cultura do <b>trabalho duro, família grande, fé e comunidade</b> dos imigrantes.</li></ul><p>  - Ângulo: <b>os antepassados vieram sem nada e ergueram tudo no braço</b> — narrativa de mérito, esforço e fé, contra o assistencialismo. Patriotismo local (o próprio nome celebra a Farroupilha).</p><p>  - Fonte: <a href=\"https://pt.wikipedia.org/wiki/Farroupilha\" target=\"_blank\" rel=\"noopener\">Wikipédia – Farroupilha</a></p><h4>F. Agro / uva (produtor da Serra)</h4><ul><li><b>Agricultura + indústria da uva e vinho</b> sustentam a economia; forte presença de <b>pequenos produtores familiares</b> na Serra Gaúcha. Farroupilha é apontada como uma das melhores cidades do país para empreender.</li></ul><p>  - Ângulo: <b>defesa do produtor rural e da agroindústria familiar</b> — propriedade, produção e renda no interior; casa com a bandeira de propriedade/agro do Rony (sem precisar de tema de conflito, aqui o agro é próspero e ordeiro).</p><p>  - Fonte: <a href=\"https://www.ibge.gov.br/cidades-e-estados/rs/farroupilha.html\" target=\"_blank\" rel=\"noopener\">IBGE – Cidades e Estados: Farroupilha</a></p><h3>💛 ORGULHO / PERTENCIMENTO (gravar na chegada, mostra respeito)</h3><ul><li><b>Santuário de Caravaggio</b> (maior romaria do Sul, +250 mil na romaria de 26/05); <b>&quot;Capital Nacional do Moscatel&quot;</b> e do bom vinho/espumante; <b>berço da imigração italiana no RS</b> (desde 1875); <b>polo da malha</b>; cidade <b>ordeira e segura</b> (melhor índice do RS Seguro); <b>~72,5 mil habitantes</b> (Censo 2022), a ~23 km de Caxias e 110 km de Porto Alegre.</li></ul><p>  - Fontes: <a href=\"https://www.ibge.gov.br/cidades-e-estados/rs/farroupilha.html\" target=\"_blank\" rel=\"noopener\">IBGE – Farroupilha</a> · <a href=\"https://pt.wikipedia.org/wiki/Farroupilha\" target=\"_blank\" rel=\"noopener\">Wikipédia – Farroupilha</a></p><h3>Lacunas (não achado — não inventar)</h3><ul><li>Resultado do <b>2º turno de 2022</b> em Farroupilha isolado (temos o 1º turno: Bolsonaro 66,41%); taxa de desemprego/salário médio atualizado; agenda/horário exato da luta do Rony e se há fala/homenagem prevista no evento; pautas municipais quentes de 2026 (saúde, obras, tributos locais). <b>Cuidado:</b> existe um teólogo evangélico nacionalmente conhecido chamado Thiago Brunet — <b>não confundir</b> com o vice-prefeito <b>Dr. Thiago Brunet (PP, médico)</b> de Farroupilha.</li></ul>","elec":{"municipio":"FARROUPILHA","lula_pct":25.4,"bolso_pct":74.6,"lula_votos":11728,"bolso_votos":34359,"vencedor":"Bolsonaro","abst_pct":16.0,"branco_pct":1.6,"nulo_pct":2.5,"aptos":57229,"comparecimento":48065,"dep_fed":{"nome":"GLÓRIA MENEGOTTO","partido":"UNIÃO","votos":9497},"dep_est":{"nome":"FRAN SOMENSI","partido":"REPUBLICANOS","votos":9394}},"dossie":{"e":{"ano":2024,"pop":74879,"orc":556414482.58,"prop":104036925.84,"fed":128509832.3,"est":137286296.99,"pp":18.7,"pf":23.1,"pe":24.7,"dep":47.8,"principal":"Transferências (União/Estado)","setor":{"dom":"Serviços","dom_pct":43.3,"pib":4398457000.0,"agro":5.5,"ind":40.5,"serv":43.3,"adm":10.7},"gasto":[{"nome":"Saúde","valor":129935163.02,"pct":26.7},{"nome":"Educação","valor":110661731.58,"pct":22.8},{"nome":"Urbanismo","valor":68400024.87,"pct":14.1},{"nome":"Previdência","valor":55191955.51,"pct":11.4}]},"hooks":["<b>Terreno amigo:</b> Farroupilha deu <b>74.6% ao Bolsonaro</b> em 2022 — cidade de família, trabalho e fé. Abrir reconhecendo o povo.","<b>O básico que passa por Brasília:</b> a prefeitura investe <b>26.7% em saúde</b> — e o recurso depende do federal liberar."]}},{"nome":"Flores da Cunha","estudo":"<h2>ESTUDO DE CIDADE — FLORES DA CUNHA (RS)</h2><p>&gt; Rony (vereador de Erechim, pré-candidato a Dep. Federal) em visita — <b>jantar 07/08/2026, contato Kauan</b>. É <b>visitante</b> numa cidade próspera, católica, de colonização italiana e capital do vinho. Conteúdo precisa mostrar respeito/pertencimento + cruzar com o DNA dele (bolso/tributos, trabalho/empreendedorismo, fé/família, propriedade). <b>Cidade de administração de DIREITA — cuidado redobrado p/ não queimar aliado.</b></p><h3>⚠️ CORREÇÕES DE PRECISÃO (não errar em vídeo)</h3><p>1. <b>Flores da Cunha é governada pela DIREITA — não atacar a prefeitura.</b> Prefeito <b>César Ulian (PP/Progressistas)</b>, reeleito em 2024 com <b>50,99% (10.058 votos)</b>; vice <b>Marcio Rech (PL)</b>. 2º lugar foi <b>Lidio Scortegagna (MDB)</b> e 3º o <b>Republicanos</b> — <b>não houve nem candidato do PT</b>. → O alvo &quot;esquerda/Lula/PT&quot; vale só no <b>federal</b> (Reforma Tributária, acordo Mercosul-UE). No <b>municipal</b>, atacar a gestão local queima ponte com PP+PL. Crítica, se houver, é &quot;velha política&quot;, nunca &quot;esquerdopata&quot;.</p><p>2. <b>NÃO é cidade violenta.</b> É Serra Gaúcha, criminalidade historicamente baixa. Houve *alta pontual* de homicídios em 2025 (mais que em todo 2024, que teve só 1), mas <b>não afirmar que &quot;está tomada pelo crime&quot;</b> — a checagem derruba. Se tocar em segurança, enquadrar como &quot;até a Serra sente&quot; / valor da polícia, sem alarmismo.</p><p>3. <b>A grande Romaria de N.S. de Caravaggio (147ª, ~83 mil fiéis) é em FARROUPILHA, não em Flores da Cunha.</b> FdC tem a <b>Capela de N.S. de Caravaggio no distrito de Otávio Rocha</b> (concluída em 1926, inspirada no santuário italiano). Não confundir as duas.</p><p>4. <b>O nome homenageia um político, não &quot;flores&quot;.</b> Era <b>Nova Trento</b>; virou Flores da Cunha (decreto de 1935) em homenagem ao então governador <b>General José Antônio Flores da Cunha</b>. Bom saber p/ não passar vergonha se alguém puxar história.</p><p>5. <b>Imposto Seletivo é MUNICIPAL? Não — é FEDERAL (Reforma Tributária).</b> Quem decide alíquota é o <b>Senado/Congresso</b>, sob a <b>LC 214/2025</b>. Não cobrar o prefeito por isso; cobrar Brasília. Aí mora a munição.</p><h3>🏆 GANCHOS FORTES (cruzados com o DNA do Rony)</h3><h4>A. Tributação do vinho / Imposto Seletivo (CAMPEÃO — bolso + anti-Lula federal, dor local direta)</h4><ul><li>Setor estima que a carga total sobre o vinho pode chegar a <b>~55%</b> com o novo modelo (<b>ad valorem</b> + <b>ad rem</b> sobre teor alcoólico). O <b>Imposto Seletivo (o &quot;imposto do pecado&quot;)</b> trata o vinho como cigarro/bebida nociva e, por ser <b>cumulativo</b> (não gera crédito), gruda no preço final. Vale a partir de <b>2027</b> e &quot;aperta o caixa&quot; justamente das <b>pequenas vinícolas</b> de ciclo longo — a alma de Flores da Cunha.</li></ul><p>  - Ângulo Rony: *&quot;Brasília trata o vinho da família italiana como se fosse vício. Quem paga é o pequeno produtor da Serra, não o gabinete de Brasília.&quot;* Bolso + trabalho + anti-imposto.</p><p>  - Fontes: <a href=\"https://economicnewsbrasil.com.br/2026/07/11/imposto-seletivo-vinho-capital-giro-vinicolas/\" target=\"_blank\" rel=\"noopener\">Economic News Brasil – imposto seletivo aperta caixa das vinícolas</a> · <a href=\"https://www.avindima.com.br/imposto-seletivo-expoe-encruzilhada-vinho-brasileiro/\" target=\"_blank\" rel=\"noopener\">A Vindima – Imposto Seletivo expõe encruzilhada do vinho</a> · <a href=\"https://mercadocomum.com/com-a-reforma-tributaria-vinho-brasileiro-podera-ficar-mais-caro-para-os-consumidores/\" target=\"_blank\" rel=\"noopener\">Mercado Comum – vinho ficará mais caro</a></p><h4>B. Concorrência do importado / Acordo Mercosul-UE + isonomia tributária (protecionismo do produtor)</h4><ul><li>O <b>acordo Mercosul-UE entrou em vigor em 1º/05/2026</b> e zera tarifa de vinho europeu. O <b>vinho de mesa — 78% da produção de Flores da Cunha</b> — é o mais exposto. O <b>Consevitis-RS</b> alerta a assimetria: <b>Portugal liberou €1 bilhão</b> aos produtores, a <b>França mantém fortes incentivos</b>, e o Brasil taxa pesado e não subsidia. <b>~20 mil famílias gaúchas</b> dep
