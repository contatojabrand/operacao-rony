ida de quem produz</b>; menos imposto sobre o agro, defesa da propriedade e do resultado do trabalho. Alvo federal, não a Prefeitura (aliada).</p><p>  - Fontes: <a href=\"https://cidades.ibge.gov.br/brasil/rs/sananduva/panorama\" target=\"_blank\" rel=\"noopener\">IBGE Cidades — Panorama</a> · <a href=\"https://www.caravela.info/en/regional/sananduva---rs\" target=\"_blank\" rel=\"noopener\">Economia — Caravela</a></p><h4>E. Infraestrutura / asfalto travado (cobrança de obra — delicado: é ESTADUAL)</h4><ul><li><b>ERS-126 em Sananduva: pavimentação parada há mais de 4 anos</b> — convênio Município/DAER de 2010, obra interrompida em 2012, faltando ~400 m de um trecho de 2,2 km. A vizinha <b>ERS-465 (Santo Expedito do Sul–Sananduva)</b> segue em obras por etapas; o Município também começou a asfaltar acessos do interior (Seção Progresso).</li></ul><p>  - Ângulo Rony: <b>&quot;promessa de asfalto que nunca sai&quot;</b> = velha política. Mas ⚠️ <b>cuidado com o alvo</b>: rodovia estadual é responsabilidade do <b>DAER/Governo do Estado</b>, não da Prefeitura (PL, aliada). Enquadrar como cobrança geral de que o interior é sempre deixado por último — sem mirar aliado local.</p><p>  - Fontes: <a href=\"https://www.daer.rs.gov.br/ers-126sananduva\" target=\"_blank\" rel=\"noopener\">DAER — ERS-126 Sananduva</a> · <a href=\"https://santoexpeditodosul.rs.gov.br/noticias_ver.php?id_noticia=4544\" target=\"_blank\" rel=\"noopener\">ERS-465 andamento das obras</a> · <a href=\"https://www.sananduva.rs.gov.br/noticias_ver.php?id_noticia=7954\" target=\"_blank\" rel=\"noopener\">Prefeitura — asfaltamento no interior</a></p><h4>F. Fé, família e valores + reduto conservador (identidade — casa do Rony)</h4><ul><li>Colonização <b>italiana católica</b>, padroeiro <b>São João Batista</b>, interior de propriedade familiar: o DNA de fé/família/valores é a própria cultura da cidade. O <b>nordeste gaúcho de colonização italiana é a região mais bolsonarista do RS</b> (contexto regional, ver Correção 4) e Sananduva elegeu <b>prefeito do PL</b> em 2024.</li></ul><p>  - Ângulo Rony: falar de <b>Deus, família, trabalho e liberdade</b> aqui é falar a língua da casa — patriotismo e valores cristãos. Terreno amigo: reforçar pertencimento, não &quot;convencer&quot;.</p><p>  - Fontes: <a href=\"https://camarasananduva.rs.gov.br/cidade\" target=\"_blank\" rel=\"noopener\">Câmara — A cidade</a> · <a href=\"https://www.brasildefato.com.br/2022/11/01/no-nordeste-gaucho-o-campeao-de-votos-nao-e-lula-mas-bolsonaro/\" target=\"_blank\" rel=\"noopener\">Brasil de Fato — nordeste gaúcho bolsonarista</a> · <a href=\"https://www.ihu.unisinos.br/categorias/622751-confronto-opoe-o-sul-contra-o-norte-no-rio-grande-do-sul\" target=\"_blank\" rel=\"noopener\">IHU/Unisinos — Sul x Norte no RS</a></p><h3>💛 ORGULHO / PERTENCIMENTO (gravar na chegada, mostra respeito)</h3><ul><li><b>Colonização italiana</b> iniciada por volta de 1896 (<b>Fiorentino Bacchi</b>, de Mantova); colônia fundada em <b>02/06/1902</b>; <b>emancipação em 1954</b>, instalação em <b>28/02/1955</b>. O nome <b>&quot;Sananduva&quot;</b> vem da <b>corticeira-do-banhado</b>, árvore de flor vermelho-escarlate da região. <b>Igreja Matriz São João Batista</b> no coração da cidade; tradição da <b>Semana Italiana</b>. Terra de <b>agricultura familiar forte</b> e da rota histórica da <b>Estrada do Barracão / tropeirismo</b>.</li></ul><p>  - Fontes: <a href=\"https://www.sananduva.rs.gov.br/pg.php?area=HISTORIA\" target=\"_blank\" rel=\"noopener\">Prefeitura — História</a> · <a href=\"https://pt.wikipedia.org/wiki/Hist%C3%B3ria_de_Sananduva\" target=\"_blank\" rel=\"noopener\">Wikipédia — História de Sananduva</a> · <a href=\"https://www.sananduvafm.com.br/noticias_ver.php?id_noticia=12207\" target=\"_blank\" rel=\"noopener\">Censo 2022: 16.399 habitantes</a></p><h3>Lacunas (não achado — não inventar)</h3><ul><li><b>% exato de Bolsonaro/Lula em Sananduva (1º e 2º turno 2022)</b> e votação para governador — não confirmado online; buscar no TSE/TRE-RS antes de citar número. Usar só o padrão regional (fonte acima).</li><li><b>Dados de criminalidade SSP/RS do município</b> — cidade pequena, pouco dado público; não afirmar &quot;violência&quot; sem número.</li><li><b>Salário médio, IDHM, esgotamento sanitário e taxa de desemprego exatos</b> — não extraídos (páginas IBGE renderizam via JS); confirmar direto no <a href=\"https://cidades.ibge.gov.br/brasil/rs/sananduva/panorama\" target=\"_blank\" rel=\"noopener\">IBGE Cidades</a>.</li><li><b>Identidade/partido do contato &quot;Mariano&quot;</b> e do vereador/liderança parceira — não verificável online; confirmar com a equipe local antes de citar em vídeo (define se cabe ou não crítica de gestão).</li><li><b>Produção agrícola em números (toneladas de soja/milho, litros de leite, cabeças)</b> — só perfil qualitativo achado; puxar PAM/PPM do IBGE se precisar de número.</li></ul>","elec":{"municipio":"SANANDUVA","lula_pct":29.9,"bolso_pct":70.1,"lula_votos":3273,"bolso_votos":7685,"vencedor":"Bolsonaro","abst_pct":13.8,"branco_pct":2.0,"nulo_pct":2.0,"aptos":13243,"comparecimento":11414,"dep_fed":{"nome":"ALCEU MOREIRA","partido":"MDB","votos":1796},"dep_est":{"nome":"PAPARICO BACCHI","partido":"PL","votos":2133}},"dossie":{"e":{"ano":2024,"pop":17130,"orc":112898334.11,"prop":14332739.94,"fed":34891122.2,"est":32433755.65,"pp":12.7,"pf":30.9,"pe":28.7,"dep":59.6,"principal":"Transferências (União/Estado)","setor":{"dom":"Serviços","dom_pct":43.5,"pib":843826000.0,"agro":29.1,"ind":14.7,"serv":43.5,"adm":12.6},"gasto":[{"nome":"Educação","valor":31018942.91,"pct":28.7},{"nome":"Saúde","valor":21966533.33,"pct":20.3},{"nome":"Transporte","valor":14835101.25,"pct":13.7},{"nome":"Administração","valor":13660031.98,"pct":12.6}]},"hooks":["<b>Terreno amigo:</b> Sananduva deu <b>70.1% ao Bolsonaro</b> em 2022 — cidade de família, trabalho e fé. Abrir reconhecendo o povo.","<b>Dependência de Brasília:</b> <b>59.6%</b> do orçamento vem de repasses federais/estaduais. Gancho: “o futuro daqui se decide em Brasília — e é lá que eu quero brigar por vocês”.","<b>Defesa do produtor:</b> o agro é <b>29.1%</b> da economia. Gancho: “enquanto o Lula taxa quem produz, a gente precisa de quem defenda o produtor rural”.","<b>O básico que passa por Brasília:</b> a prefeitura investe <b>28.7% em educação</b> — e o recurso depende do federal liberar."]}},{"nome":"Viamão","estudo":"<h2>ESTUDO DE CIDADE — VIAMÃO (RS)</h2><p>&gt; Rony (vereador de Erechim, pré-candidato a Dep. Federal) em visita. É <b>visitante</b> — conteúdo precisa mostrar respeito/pertencimento + cruzar com o DNA dele (anti-esquerda, bolso, valores, anti-sistema).</p><h3>⚠️ CORREÇÕES DE PRECISÃO (não errar em vídeo)</h3><p>1. <b>Viamão NÃO é &quot;das mais violentas&quot;.</b> Dados SSP/RS: criminalidade ~média (80º de 496 municípios); o RS teve homicídios −27% em 2025. <b>Não afirmar que &quot;lidera violência&quot;</b> — a checagem derruba. Brecha real: <b>golpes/estelionato</b> (2º crime mais comum) e Guarda Municipal.</p><p>2. <b>Viamão NÃO é governada pela esquerda.</b> É <b>PSDB/centro-direita há +10 anos</b> (máquina do Bonatto; prefeito Bortoletti). PT teve 8,75% em 2024. → O alvo &quot;esquerda&quot; vale no <b>federal (Lula/PT)</b> e em parte no estadual; no <b>municipal</b> o enquadramento honesto é <b>&quot;velha política / máquina / prefeito cassado por conduta vedada&quot;</b>, NÃO &quot;esquerdopata&quot;.</p><p>3. <b>Elis Regina NÃO é de Viamão</b> (é de POA). Erro comum — não usar.</p><h3>🏆 GANCHOS FORTES (cruzados com o DNA do Rony)</h3><h4>A. Anti-MST / propriedade (CAMPEÃO — tema anti-sistema com gancho local)</h4><ul><li><b>Invasão MST Fazenda Rincão de São Brás (Itapuã), ago/2025</b>, 351 ha do Banco do Brasil, ~130 famílias. Câmara de Viamão aprovou <b>moção de repúdio 12×3</b> (vereador Thiago Gutierres/PSD). Prefeito (PSDB): *&quot;não vai ter invasão de terras em Viamão&quot;*. <b>Justiça suspendeu a reintegração (set/2025)</b> → invasão ficou. Dep. Adão Pretto Filho (PT) defendeu.</li></ul><p>  - Fontes: <a href=\"https://www.terra.com.br/noticias/mst-ocupa-fazenda-em-viamao-para-reforma-agraria,20af90284e0e114367dbbde7363e0f5c3ojckwcl.html\" target=\"_blank\" rel=\"noopener\">Terra</a> · <a href=\"https://camaraviamao.rs.gov.br/camara-aprova-mocao-de-repudio-a-ocupacao-de-uma-propriedade-rural-pelo-mst-na-pimenta/\" target=\"_blank\" rel=\"noopener\">Câmara Viamão</a> · <a href=\"https://mst.org.br/2025/09/08/justica-do-rs-suspende-ordem-de-reintegracao-de-posse-em-viamao-rs/\" target=\"_blank\" rel=\"noopener\">MST/suspensão</a></p><ul><li><b>&quot;Capital do Arroz Orgânico&quot;</b> por lei do PT (Adão Pretto Filho, 2018); maior assentamento do RS (Filhos de Sepé, 9.450 ha) fica aqui. Ângulo: identidade produtiva capturada pela esquerda; cadê o produtor tradicional. ⚠️ <b>não atacar o agricultor</b> — atacar a captura política.</li></ul><p>  - Fontes: <a href=\"https://mst.org.br/2023/03/17/mst-reune-4-mil-pessoas-para-celebrar-a-maior-producao-de-arroz-organico-da-america-latina/\" target=\"_blank\" rel=\"noopener\">MST</a> · <a href=\"https://www.brasildefato.com.br/2023/12/13/25-anos-do-assentamento-filhos-de-sepe-de-viamao/\" target=\"_blank\" rel=\"noopener\">Brasil de Fato</a></p><h4>B. Saúde (o ponto de crítica de GESTÃO mais forte — dor real &quot;no bolso/família&quot;)</h4><ul><li>Hospital único comprado por <b>R$ 24 mi</b> de fundação em recuperação judicial (abr/2024); <b>maternidade fechada</b> (parturientes mandadas p/ Alvorada e POA); sem traumato/ortopedia; <b>UPA projetada p/ 350/dia atende +500/dia</b>. Estado montou plano de contingência (jun/2025). Prometido Hospital Regional 506 leitos (2º sem/2025) — cobrar entrega.</li></ul><p>  - Fontes: <a href=\"https://www.jornaldocomercio.com/jornal-cidades/2024/04/1150852-prefeitura-concretiza-a-compra-do-hospital-de-viamao.html\" target=\"_blank\" rel=\"noopener\">Jornal do Comércio</a> · <a href=\"https://saude.rs.gov.br/estado-prepara-plano-de-contingencia-que-dara-apoio-para-o-hospital-de-viamao\" target=\"_blank\" rel=\"noopener\">Saúde RS</a></p><h4>C. Saneamento (escândalo objetivo)</h4><ul><li><b>Só 8,5% da população tem coleta de esgoto</b> — 207 mil pessoas sem coleta. PPP Corsan/Aegea R$ 683 mi promete 87% em 11 anos. Comunidades de Águas Claras processaram a Corsan/Aegea pela captação de água (set/2025).</li></ul><p>  - Fontes: <a href=\"https://www.aguaesaneamento.org.br/municipios-e-saneamento/rs/viamao\" target=\"_blank\" rel=\"noopener\">Água e Saneamento</a> · <a href=\"https://www.brasildefato.com.br/2025/09/10/comunidades-de-viamao-acionam-a-justica-contra-captacao-de-agua-subterranea-pela-corsan-aegea/\" target=\"_blank\" rel=\"noopener\">Brasil de Fato</a></p><h4>D. Economia / emprego (bolso)</h4><ul><li><b>PIB per capita R$ 24.741 (2023) — 486º de 497 no RS</b>; setor público = 28,5% da economia; <b>cidade-dormitório</b> de POA. Câmara criou <b>&quot;IPTU Premiado&quot;</b> (sorteio p/ quem paga em dia) — ou seja, foco em arrecadar mais do morador, não gerar emprego.</li></ul><p>  - Fontes: <a href=\"https://cidades.ibge.gov.br/brasil/rs/viamao/panorama\" target=\"_blank\" rel=\"noopener\">IBGE Cidades</a> · <a href=\"https://camaraviamao.rs.gov.br/aprovado-projeto-de-lei-que-institui-o-programa-avanca-viamao-iptu-premiado/\" target=\"_blank\" rel=\"noopener\">Câmara – IPTU Premiado</a></p><h4>E. Enchentes 2024 em Itapuã (munição federal — já na base do Rony)</h4><ul><li>Maio/2024: subida do Guaíba na Vila de Itapuã, <b>50+ desabrigados, ~250 moradias</b>. Liga à pauta `ATAQUE/rio_grande_do_sul.md` (resposta federal de Lula: R$ 6,5 bi parados, moradias não entregues).</li></ul><p>  - Fonte: <a href=\"https://www.vereadorarmando.com.br/enchentes-em-itapua/\" target=\"_blank\" rel=\"noopener\">Vereador Armando – enchentes Itapuã</a></p><h4>F. Prefeito cassado (delicado — ver nota)</h4><ul><li><b>Rafael Bortoletti (PSDB)</b>, eleito 2024 (48,49%). <b>TRE-RS manteve a cassação (dez/2025)</b> por conduta vedada (usou inauguração de obra pública em campanha). <b>TSE reintegrou (mar/2026, sub judice).</b> Máquina do Bonatto (PSDB) há +10 anos.</li></ul><p>  - ⚠️ <b>Delicado:</b> Bortoletti é centro-direita. Atacar o prefeito local pode queimar ponte com a direita local. Usar SÓ se o vereador parceiro for oposição a ele. Enquadrar como &quot;velha política/renovação&quot;, nunca como &quot;esquerda&quot;.</p><p>  - Fonte: <a href=\"https://www.brasildefato.com.br/2026/03/24/bortoletti-volta-a-ser-prefeito-de-viamao-e-tse-cancela-eleicao-suplementar-de-12-de-abril/\" target=\"_blank\" rel=\"noopener\">Brasil de Fato</a></p><h3>💛 ORGULHO / PERTENCIMENTO (gravar na chegada, mostra respeito)</h3><ul><li><b>1ª capital do RS</b> (1763–1773); <b>Igreja Matriz N.S. Conceição</b> tombada pelo IPHAN em 1938 (1º lote do Brasil); <b>Parque Estadual de Itapuã</b> (farol de 1860, único cervo-do-pantanal do RS); lenda do nome <b>&quot;vi a mão&quot;</b>.</li></ul><p>  - Fontes: <a href=\"https://www.viamao.rs.gov.br/portal/servicos/1002/historia/\" target=\"_blank\" rel=\"noopener\">Prefeitura – História</a> · <a href=\"https://www.sema.rs.gov.br/parque-estadual-de-itapua/\" target=\"_blank\" rel=\"noopener\">SEMA – Itapuã</a></p><h3>Lacunas (não achado — não inventar)</h3><p>Homicídios de Viamão isolados; taxa de desemprego/salário médio; surto de COVID jan/2026; controvérsia local de costumes (usar fila de creche como gancho família).</p>","elec":{"municipio":"VIAMÃO","lula_pct":53.5,"bolso_pct":46.5,"lula_votos":65948,"bolso_votos":57395,"vencedor":"Lula","abst_pct":20.0,"branco_pct":2.0,"nulo_pct":3.3,"aptos":162846,"comparecimento":130255,"dep_fed":{"nome":"NELSON MARCHEZAN JÚNIOR","partido":"PSDB","votos":11582},"dep_est":{"nome":"PROFESSOR BONATTO","partido":"PSDB","votos":35601}},"dossie":{"e":{"ano":2024,"pop":223679,"orc":895016326.88,"prop":147813444.53,"fed":218622524.77,"est":166690219.94,"pp":16.5,"pf":24.4,"pe":18.6,"dep":43.0,"principal":"Transferências (União/Estado)","setor":{"dom":"Serviços","dom_pct":44.1,"pib":4335081000.0,"agro":6.1,"ind":17.3,"serv":44.1,"adm":32.6},"gasto":[{"nome":"Educação","valor":283304061.77,"pct":34.1},{"nome":"Saúde","valor":144228757.54,"pct":17.4},{"nome":"Previdência","valor":131565485.45,"pct":15.8},{"nome":"Administração","valor":85929893.19,"pct":10.3}]},"hooks":["<b>O básico que passa por Brasília:</b> a prefeitura investe <b>34.1% em educação</b> — e o recurso depende do federal liberar."]}}];
const $=s=>document.querySelector(s);
function esc(x){return(x||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function nf(n){return (n||0).toLocaleString('pt-BR')}
function dossieHtml(ds){if(!ds)return '';const e=ds.e;const money=v=>v>=1e9?'R$ '+(v/1e9).toFixed(2).replace('.',',')+' bi':(v>=1e6?'R$ '+(v/1e6).toFixed(1).replace('.',',')+' mi':'R$ '+nf(v));let h='<div class=card style="border-left:4px solid var(--gold)"><b>💰 Economia &amp; ganchos de conteúdo</b> <span class=hint>(dados públicos — TSE · Tesouro · IBGE)</span>';h+=`<div class=meta style="margin-top:7px"><span>Orçamento <b>${money(e.orc)}</b></span><span>Depende de Brasília/estado <b>${e.dep}%</b></span>`;if(e.setor)h+=`<span>Move a economia: <b>${esc(e.setor.dom)} ${e.setor.dom_pct}%</b></span>`;if(e.gasto)h+=`<span>Gasta em: ${e.gasto.slice(0,3).map(g=>esc(g.nome)+' '+g.pct+'%').join(' · ')}</span>`;h+='</div>';if(ds.hooks&&ds.hooks.length)h+='<div style="margin-top:9px">'+ds.hooks.map(x=>`<div style="padding:6px 0;border-top:1px solid var(--line);font-size:13.5px;line-height:1.5">🎣 ${x}</div>`).join('')+'</div>';h+='</div>';return h;}
function elecCard(m){const cor=m.vencedor==='Lula'?'var(--pt)':'var(--pl)';const dep=x=>x?`<span class=nm>${esc(x.nome)}</span> <span class=pt>${esc(x.partido)} · ${nf(x.votos)} votos</span>`:'<span class=pt>sem dado</span>';return `<div class=card><div class=top><div class=mun>${esc(m.municipio)}</div><div class=badge style="background:${cor}">${esc(m.vencedor)} venceu</div></div><div class=vbar><div class=l style="width:${m.lula_pct}%">${m.lula_pct}%</div><div class=b style="width:${m.bolso_pct}%">${m.bolso_pct}%</div></div><div class=leg><span>🔴 Lula ${nf(m.lula_votos)}</span><span>Bolsonaro ${nf(m.bolso_votos)} 🔵</span></div><div class=row2><div class=mini><b>${m.abst_pct}%</b><span>abstenção</span></div><div class=mini><b>${m.branco_pct}%</b><span>brancos</span></div><div class=mini><b>${m.nulo_pct}%</b><span>nulos</span></div></div><div class=deps><div class=d><span>Dep. Federal + votado</span><span>${dep(m.dep_fed)}</span></div><div class=d><span>Dep. Estadual + votado</span><span>${dep(m.dep_est)}</span></div></div></div>`}
$('#chipsC').innerHTML=CID.map((c,i)=>`<button class="chip${i===0?' on':''}" data-c="${i}">${esc(c.nome)}</button>`).join('');
function showCid(i){const c=CID[i];let h='';if(c.elec)h+=elecCard(c.elec);else h+='<div class=card><b>'+esc(c.nome)+'</b><div class=pt>Perfil eleitoral não encontrado.</div></div>';h+=dossieHtml(c.dossie);h+='<div class=estudo>'+c.estudo+'</div>';$('#lC').innerHTML=h;}
$('#chipsC').addEventListener('click',e=>{if(e.target.dataset.c===undefined)return;document.querySelectorAll('#chipsC .chip').forEach(x=>x.classList.remove('on'));e.target.classList.add('on');showCid(+e.target.dataset.c);});
if(CID.length)showCid(0);
